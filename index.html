ّحَدِّيَ\n                    \u003c/span>\n                \u003c/button>\n\n                \u003c!-- قسم نسخ رابط/كود الفتح للطلاب -->\n                \u003cdiv class=\"w-full pt-4 border-t border-slate-700/60 flex flex-col gap-2\">\n                    \u003cspan class=\"text-xs text-slate-300 font-semibold\">لِمَشَارَكَةِ اللَّعْبَةِ وَإِرْسَالِهَا لِلطُّلَّابِ:\u003c/span>\n                    \u003cbutton onclick=\"copyGameLink()\" class=\"w-full py-3 px-4 bg-slate-800 hover:bg-slate-700 text-amber-300 border border-amber-500/40 rounded-xl font-bold text-sm sm:text-base flex items-center justify-center gap-2 transition-all active:scale-95\">\n                        \u003ci class=\"fa-solid fa-link text-amber-400\">\u003c/i>\n                        \u003cspan>🔗 نَسْخُ رَابِطِ / كُودِ اللَّعْبَةِ لِلإِرْسَالِ لِلطُّلَّابِ\u003c/span>\n                    \u003c/button>\n                    \u003cdiv id=\"copy-toast\" class=\"hidden text-xs text-emerald-400 font-bold mt-1 animate-fade-in\">\n                        ✅ تَمَّ نَسْخُ كُودِ وَرَابِطِ اللَّعْبَةِ بِنَجَاحٍ! كُنْ جَاهِزاً لِمَشَارَكَتِهِ.\n                    \u003c/div>\n                \u003c/div>\n            \u003c/div>\n            \n            \u003cp class=\"text-xs text-slate-400 mt-4\">30 سُؤَالاً مُتَنَوِّعاً | تَدْوِيرٌ مُنْتَظَمٌ لِلإِجَابَاتِ (Round-Robin) | خَالٍ مِنَ الإِيحَاءِ\u003c/p>\n        \u003c/div>\n    \u003c/div>\n\n    \u003c!-- 2. الترويسة الرئيسية داخل اللعبة -->\n    \u003cheader class=\"w-full max-w-5xl flex flex-wrap justify-between items-center bg-slate-900/80 border border-slate-700/60 p-3 sm:p-4 rounded-2xl mb-4 backdrop-blur-md shadow-lg\">\n        \u003cdiv class=\"flex items-center gap-3\">\n            \u003cdiv class=\"w-10 h-10 rounded-xl bg-amber-500/20 border border-amber-500/40 flex items-center justify-center text-amber-400 font-bold\">\n                ✍️\n            \u003c/div>\n            \u003cdiv>\n                \u003ch2 class=\"font-black text-base sm:text-xl text-amber-400\">عَلَامَاتُ التَّرْقِيمِ (المستوى الأصعب 🔥)\u003c/h2>\n                \u003cp class=\"text-xs text-slate-400\">إِعْدَادُ: الأُسْتَاذِ أَحْمَد عُثْمَان | ♾️ الزَّمَنُ: مَفْتُوحٌ\u003c/p>\n            \u003c/div>\n        \u003c/div>\n\n        \u003cdiv class=\"flex items-center gap-3 mt-2 sm:mt-0\">\n            \u003cbutton onclick=\"copyGameLink()\" class=\"px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-amber-300 border border-amber-500/30 rounded-lg text-xs font-bold flex items-center gap-1.5\">\n                \u003ci class=\"fa-solid fa-share-nodes\">\u003c/i>\n                \u003cspan>نسخ الرابط\u003c/span>\n            \u003c/button>\n            \u003cbutton onclick=\"resetGame()\" class=\"px-3 py-1.5 bg-rose-950/60 hover:bg-rose-900/80 text-rose-300 border border-rose-500/30 rounded-lg text-xs font-bold flex items-center gap-1.5\">\n                \u003ci class=\"fa-solid fa-rotate-right\">\u003c/i>\n                \u003cspan>إعادة المسابقة\u003c/span>\n            \u003c/button>\n        \u003c/div>\n    \u003c/header>\n\n    \u003c!-- 3. لوحة النقاط والفرق -->\n    \u003cdiv class=\"w-full max-w-5xl grid grid-cols-2 gap-3 sm:gap-6 mb-4\">\n        \u003c!-- فريق التميز -->\n        \u003cdiv id=\"team1-card\" class=\"bg-gradient-to-br from-blue-950/80 to-slate-900 border-2 border-blue-500/50 p-4 rounded-2xl shadow-xl flex items-center justify-between transition-all\">\n            \u003cdiv class=\"flex items-center gap-3\">\n                \u003cdiv class=\"w-12 h-12 rounded-xl bg-blue-500/20 text-blue-400 flex items-center justify-center text-2xl font-black border border-blue-500/40\">\n                    🔵\n                \u003c/div>\n                \u003cdiv>\n                    \u003ch3 class=\"font-extrabold text-blue-300 text-sm sm:text-lg\">فَرِيقُ التَّمَيُّزِ\u003c/h3>\n                    \u003cp class=\"text-xs text-slate-400\" id=\"team1-turn-indicator\">الدَّوْرُ الحَالِيّ\u003c/p>\n                \u003c/div>\n            \u003c/div>\n            \u003cdiv class=\"text-2xl sm:text-4xl font-black text-blue-400\" id=\"team1-score\">0\u003c/div>\n        \u003c/div>\n\n        \u003c!-- فريق التفوق -->\n        \u003cdiv id=\"team2-card\" class=\"bg-gradient-to-br from-emerald-950/80 to-slate-900 border-2 border-slate-700/50 p-4 rounded-2xl shadow-xl flex items-center justify-between opacity-60 transition-all\">\n            \u003cdiv class=\"flex items-center gap-3\">\n                \u003cdiv class=\"w-12 h-12 rounded-xl bg-emerald-500/20 text-emerald-400 flex items-center justify-center text-2xl font-black border border-emerald-500/40\">\n                    🟢\n                \u003c/div>\n                \u003cdiv>\n                    \u003ch3 class=\"font-extrabold text-emerald-300 text-sm sm:text-lg\">فَرِيقُ التَّفَوُّقِ\u003c/h3>\n                    \u003cp class=\"text-xs text-slate-400\" id=\"team2-turn-indicator\">في الانتظار\u003c/p>\n                \u003c/div>\n            \u003c/div>\n            \u003cdiv class=\"text-2xl sm:text-4xl font-black text-emerald-400\" id=\"team2-score\">0\u003c/div>\n        \u003c/div>\n    \u003c/div>\n\n    \u003c!-- 4. منطقة العجلة التفاعلية -->\n    \u003cmain class=\"w-full max-w-5xl flex flex-col items-center my-auto\">\n        \u003cdiv class=\"relative flex flex-col items-center justify-center\">\n            \u003c!-- المؤشر العلوي -->\n            \u003cdiv class=\"wheel-pointer absolute -top-5 z-20 text-amber-400 text-4xl sm:text-5xl\">\n                \u003ci class=\"fa-solid fa-caret-down\">\u003c/i>\n            \u003c/div>\n\n            \u003c!-- Canvas عجلة الحظ -->\n            \u003ccanvas id=\"wheel-canvas\" width=\"420\" height=\"420\" class=\"max-w-[320px] sm:max-w-[420px] w-full h-auto rounded-full border-4 border-amber-500/60 shadow-2xl\">\u003c/canvas>\n\n            \u003c!-- زر التدوير بمنتصف العجلة -->\n            \u003cbutton id=\"spin-btn\" onclick=\"spinWheel()\" class=\"mt-6 px-8 py-4 bg-gradient-to-r from-amber-500 to-yellow-400 hover:from-amber-400 hover:to-yellow-300 text-slate-950 font-black text-xl sm:text-2xl rounded-2xl shadow-2xl border-2 border-amber-200 transition-all active:scale-95 flex items-center gap-3 cursor-pointer\">\n                \u003ci class=\"fa-solid fa-arrows-spin text-2xl\">\u003c/i>\n                \u003cspan>أَدِرِ العَجَلَةَ الآنَ\u003c/span>\n            \u003c/button>\n        \u003c/div>\n    \u003c/main>\n\n    \u003c!-- 5. نافذة عرض السؤال (Modal) -->\n    \u003cdiv id=\"question-modal\" class=\"fixed inset-0 z-40 hidden flex items-center justify-center bg-slate-950/90 backdrop-blur-md p-4\">\n        \u003cdiv class=\"bg-slate-900 border-2 border-amber-500/60 w-full max-w-2xl rounded-3xl p-5 sm:p-8 shadow-2xl flex flex-col gap-6 relative\">\n            \u003c!-- الهيدر -->\n            \u003cdiv class=\"flex justify-between items-center border-b border-slate-800 pb-4\">\n                \u003cspan id=\"current-team-badge\" class=\"px-4 py-1.5 rounded-full text-xs font-black bg-blue-500/20 text-blue-300 border border-blue-500/40\">\n                    🔵 فَرِيقُ التَّمَيُّزِ\n                \u003c/span>\n                \u003cspan id=\"question-number-badge\" class=\"text-xs font-bold text-amber-400\">\n                    السُّؤَالُ (1 / 30)\n                \u003c/span>\n            \u003c/div>\n\n            \u003c!-- نص السؤال -->\n            \u003cdiv class=\"text-right\">\n                \u003ch3 id=\"question-text\" class=\"text-lg sm:text-2xl font-bold text-white leading-relaxed\">\n                    \u003c!-- سيتم تحميل النص برمجياً -->\n                \u003c/h3>\n            \u003c/div>\n\n            \u003c!-- الخيارات الاربعة (Round-Robin) -->\n            \u003cdiv id=\"options-container\" class=\"grid grid-cols-1 gap-3\">\n                \u003c!-- الخيارات ستضاف برمجياً -->\n            \u003c/div>\n\n            \u003c!-- التغذية الراجعة (خالية تماماً من الإيحاء) -->\n            \u003cdiv id=\"feedback-box\" class=\"hidden p-4 rounded-xl text-right font-bold text-sm sm:text-base border transition-all\">\n                \u003cdiv id=\"feedback-title\" class=\"text-base sm:text-lg mb-1\">\u003c/div>\n                \u003cdiv id=\"feedback-explanation\" class=\"text-xs sm:text-sm font-semibold opacity-90\">\u003c/div>\n            \u003c/div>\n\n            \u003c!-- زر الاستمرار -->\n            \u003cbutton id=\"next-btn\" onclick=\"closeQuestionModal()\" class=\"hidden w-full py-3.5 bg-amber-500 hover:bg-amber-400 text-slate-950 font-black text-lg rounded-xl transition-all shadow-lg\">\n                مُتَابَعَةُ المَسَابَقَةِ ➔\n            \u003c/button>\n        \u003c/div>\n    \u003c/div>\n\n    \u003c!-- 6. التذييل -->\n    \u003cfooter class=\"w-full text-center py-3 text-xs text-slate-500 font-semibold border-t border-slate-800/80 mt-4\">\n        إِعْدَادُ: الأُسْتَاذِ أَحْمَد عُثْمَان | مَادَّةُ اللُّغَةِ العَرَبِيَّةِ | كَافَّةُ الحُقُوقِ مَحْفُوظَةٌ 2026 ©\n    \u003c/footer>\n\n    \u003c!-- البرمجة التفاعلية كاملة -->\n    \u003cscript>\n        /* === 1. أسئلة علامات الترقيم الـ 30 (المستوى الأصعب 🔥) === */\n        // تم تطبيق التدوير المنتظم (Round-Robin) آلياً للإجابة الصحيحة: (أ -> ب -> ج -> د -> أ ...)\n        const questionsData = [\n            {\n                q: \"حَدِّدِ الجُمْلَةَ الَّتِي اشْتَمَلَتْ عَلَى عَلاَمَةِ تَرْقِيمٍ خَاطِئَةٍ فِيمَا يَلِي:\",\n                options: [\n                    \"مَا أَجْمَلَ نُورَ الحَقِّ، وَأَبْهَى ضِيَاءَهُ!\",\n                    \"قَالَ المُنَاضِلُ: (إِنَّ الحُرِّيَّةَ تُؤْخَذُ وَلاَ تُعْطَى).\",\n                    \"هَلْ أَنْهَيْتَ قِرَاءَةَ الكِتَابِ، يَا صَدِيقِي؟!\",\n                    \"مَنْ عَمِلَ صَالِحاً؛ فَلَنَفْسِهِ.\"\n                ],\n                correct: 0, // أ\n                explain: \"الخطأ في الخيار (أ) هو وضع الفاصلة بين جملتي التعجب، والصواب وضع علامة التعجب (!) في النهاية أو استخدام علامات ترقيم متناسبة للتعجب الممتد.\"\n            },\n            {\n                q: \"مَا هِيَ العَلاَمَةُ المُنَاسِبَةُ لِلْوَضْعِ مَكَانَ النُّقَطِ: «احْرِصْ عَلَى المُطَالَعَةِ (...) فَإِنَّهَا مَفْتَاحُ المَعْرِفَةِ»؟\",\n                options: [\n                    \"الرَّئِيسِيَّةُ النُّقْطَتَانِ (:)\",\n                    \"الفَاصِلَةُ المَنْقُوطَةُ (؛)\",\n                    \"الفَاصِلَةُ (،)\",\n                    \"النُّقْطَةُ (.)\"\n                ],\n                correct: 1, // ب\n                explain: \"تُوضع الفاصلة المنقوطة (؛) بين جملتين إحداهما سبباً للأخرى، وهنا الجملة الثانية («فَإِنَّهَا مَفْتَاحُ...») تعليل للأولى.\"\n            },\n            {\n                q: \"أَيُّ الجُمَلِ الآتِيَةِ كُتِبَتْ فِيهَا الشَّرْطَتَانِ (— —) فِي مَوْضِعِهِمَا الصَّحِيحِ؟\",\n                options: [\n                    \"— كَانَ أَبُو بَكْرٍ — رَضِيَ اللَّهُ عَنْهُ — أَوَّلَ الخُلَفَاءِ.\",\n                    \"كَانَ أَبُو بَكْرٍ — رَضِيَ اللَّهُ عَنْهُ — أَوَّلَ الخُلَفَاءِ الرَّاشِدِينَ.\",\n                    \"كَانَ — أَبُو بَكْرٍ رَضِيَ اللَّهُ عَنْهُ — أَوَّلَ الخُلَفَاءِ.\",\n                    \"كَانَ أَبُو — بَكْرٍ — رَضِيَ اللَّهُ عَنْهُ أَوَّلَ الخُلَفَاءِ.\"\n                ],\n                correct: 1, // ب\n                explain: \"توضع الشرطتان حول الجملة الاعتراضية الدعائية «رَضِيَ اللَّهُ عَنْهُ» ليفصل بينها وبين أركان الجملة الأساسية.\"\n            },\n            {\n                q: \"تُسْتَخْدَمُ عَلاَمَةُ التَّنْصِيصِ « » عِنْدَ:\",\n                options: [\n                    \"حَذْفِ كَلِمَاتٍ مِنَ النَّصِّ.\",\n                    \"كِتَابَةِ جُمْلَةٍ اعْتِرَاضِيَّةٍ.\",\n                    \"نَقْلِ نَصٍّ حَرْفِيٍّ مَأْخُوذٍ مِنْ كَلاَمِ الغَيْرِ.\",\n                    \"شَرْحِ المَفَاهِيمِ وَالتَّعَارِيفِ.\"\n                ],\n                correct: 2, // ج\n                explain: \"علامتا التنصيص تُحيطان بكل كلام يُنقل بحروفه ونصّه دون تغيير.\"\n            },\n            {\n                q: \"مَا العَلاَمَةُ الَّتِي تُوضَعُ فِي نِهَايَةِ جُمْلَةِ: «مَا أَحْسَنَ زَيْدٌ إِلَى الفُقَرَاءِ» (إِذَا كَانَتْ «مَا» نَافِيَةً)؟\",\n                options: [\n                    \"علامة التعجب (!)\",\n                    \"علامة الاستفهام (?)\",\n                    \"الفاصلة المنقوطة (؛)\",\n                    \"النقطة (.)\"\n                ],\n                correct: 3, // د\n                explain: \"إذا كانت «ما» نافية فالجملة خبرية تامة المعنى فتُختم بالنقطة (.)، بخلاف ما إذا كانت تعجبية فتُختم بـ (!).\"\n            },\n            {\n                q: \"مَا العَلاَمَةُ المُنَاسِبَةُ بَيْن أقْسَامِ الشَّيْءِ مِثْلُ: «أَرْكَانُ الصَّلاَةِ ثَلاَثَةٌ (...) القِيَامُ (...) وَالرُّكُوعُ (...) وَالسُّجُودُ»؟\",\n                options: [\n                    \"النُّقْطَتَانِ ثُمَّ الفَوَاصِلُ (: / ، / ،)\",\n                    \"الفَاصِلَةُ المَنْقُوطَةُ (؛)\",\n                    \"الشَّرْطَةُ (—)\",\n                    \"علامتا التنصيص (« »)\"\n                ],\n                correct: 0, // أ\n                explain: \"توضع النقطتان الرأسيتان (:) بعد الشيء عند تصنيفه وأقسامه، ويُفصل بين الأقسام والمعطوفات بالفاصلة (،).\"\n            },\n            {\n                q: \"أيٌّ مِنَ العَلاَمَاتِ الآتِيَةِ تُسَمَّى «عَلاَمَةَ الحَذْفِ»؟\",\n                options: [\n                    \"الشرطة (—)\",\n                    \"نقاط الحذف (...) \",\n                    \"العددان (1-2)\",\n                    \"علامة القوسين [ ]\"\n                ],\n                correct: 1, // ب\n                explain: \"نقاط الحذف الثلاث المتجاورة (...) تدل على كلام محذوف من النص للاختصار أو عدم الحاجة.\"\n            },\n            {\n                q: \"مَا عَلاَمَةُ التَّرْقِيمِ المَطْلُوبَةُ بَعْدَ حَرْفِ الجَوَابِ فِي: «نَعَمْ (...) الأَمْرُ كَذَلِكَ»؟\",\n                options: [\n                    \"النقطتان الرأسيتان (:)\",\n                    \"الشرطة (—)\",\n                    \"الفاصلة (،)\",\n                    \"الفاصلة المنقوطة (؛)\"\n                ],\n                correct: 2, // ج\n                explain: \"تُوضع الفاصلة (،) فوراً بعد أحرف الجواب مثل: (نعم، لا، بلى، أجل).\"\n            },\n            {\n                q: \"أيُّ التَّرْقِيمَاتِ الآتِيَةِ يُسْتَخْدَمُ لِلرَبْطِ بَيْنَ النَّتِيجَةِ وَالمُقَدِّمَةِ فِي الحِوَارِ الشَّرْطِيِّ؟\",\n                options: [\n                    \"علامتا التنصيص\",\n                    \"علامة التعجب\",\n                    \"النقطة\",\n                    \"الفاصلة المنقوطة (؛)\"\n                ],\n                correct: 3, // د\n                explain: \"توضع الفاصلة المنقوطة قبل جملة جواب الشرط المترتبة على شرط سابق.\"\n            },\n            {\n                q: \"تُوضَعُ النُّقْطَتَانِ الرَّأْسِيَّتَانِ (:) فِي جَمِيعِ المَوَاضِعِ الآتِيَةِ مَاعَدَا:\",\n                options: [\n                    \"بَيْنَ المَعْطُوفَاتِ المَعْدُودَةِ القَصِيرَةِ جداً.\",\n                    \"بَعْدَ القَوْلِ وَمَا فِيهِ مَعْنَاهُ.\",\n                    \"بَيْنَ الشَّيْءِ وَأَقْسَامِهِ.\",\n                    \"قَبْلَ الأَمْثِلَةِ الَّتِي تُوَضِّحُ قَاعِدَةً.\"\n                ],\n                correct: 0, // أ\n                explain: \"المفصل بين المعطوفات المعدودة هو الفاصلة (،) وليس النقطتين الرأسيتين.\"\n            },\n            {\n                q: \"عِنْدَ كِتَابَةِ حِوَارٍ بَيْنَ شَخْصَيْنِ دُونَ تِكْرَارِ أَسْمَائِهِمَا، نَضَعُ فِي بَدايَةِ كُلِّ سَطْرٍ:\",\n                options: [\n                    \"نُقْطَةً (.)\",\n                    \"شَرْطَةً (—)\",\n                    \"فَاصِلَةً (،)\",\n                    \"قَوْسَيْنِ ( )\"\n                ],\n                correct: 1, // ب\n                explain: \"تُستخدم الشرطة (—) في بدايات أسطر الحوار لتفادي تكرار أسماء المتحدثين.\"\n            },\n            {\n                q: \"تُوضَعُ «علامة التعجب والاستفهام معا (!?)» عِنْدَمَا تَكُونُ الجُمْلَةُ دَالَّةً عَلَى:\",\n                options: [\n                    \"الاسْتِفْهَامِ المَحْضِ العَادِيِّ.\",\n                    \"النَّفْيِ القَاطِعِ.\",\n                    \"الاسْتِفْهَامِ الإنْكَارِيِّ المَمْزُوجِ بِالتَّعَجُّبِ.\",\n                    \"الرَّبْطِ بَيْنَ جُمْلَتَيْنِ.\"\n                ],\n                correct: 2, // ج\n                explain: \"تُدمج العلامتان (!؟) في حالات الاستفهام الاستنكاري أو الإنكاري الذي يحمل دهشة وتعجباً.\"\n            },\n            {\n                q: \"أَيُّ الجُمَلِ الآتِيَةِ تَمَّ تَرْقِيمُهَا بِشَكْلٍ سَلِيمٍ وَقَوَاعِدِيٍّ؟\",\n                options: [\n                    \"يَا طَالِبُ انْتَبِهْ؛ فَالامْتِحَانُ قَرِيبٌ.\",\n                    \"يَا طَالِبُ، انْتَبِهْ؛ فَالامْتِحَانُ قَرِيبٌ.\",\n                    \"يَا طَالِبُ: انْتَبِهْ، فَالامْتِحَانُ قَرِيبٌ.\",\n                    \"يَا طَالِبُ انْتَبِهْ، فَالامْتِحَانُ قَرِيبٌ.\"\n                ],\n                correct: 1, // ب\n                explain: \"تُوضع الفاصلة بعد المنادى «يَا طَالِبُ،» والفاصلة المنقوطة «؛» قبل التعليل «فَالامْتِحَانُ قَرِيبٌ».\"\n            },\n            {\n                q: \"مَا المَوْضِعُ الصَّحِيحُ لِلْقَوْسَيْنِ المَزْهِرِيَّيْنِ ﴿ ﴾ ؟\",\n                options: [\n                    \"الآيَاتُ القُرْآنِيَّةُ الكَرِيمَةُ.\",\n                    \"الأَحَادِيثُ النَّبَوِيَّةُ الشَّرِيفَةُ.\",\n                    \"الأَبْيَاتُ الشِّعْرِيَّةُ.\",\n                    \"العَنَاوِينُ الرَّئِيسِيَّةُ.\"\n                ],\n                correct: 0, // أ\n                explain: \"تُخصص أهلة المصحف أو القوسان المزهران ﴿ ﴾ لنصوص القرآن الكريم حصراً.\"\n            },\n            {\n                q: \"تُسْتَخْدَمُ الفَاصِلَةُ (،) فِي المَوْضِعِ الآتِي:\",\n                options: [\n                    \"فِي نِهَايَةِ الجُمْلَةِ التَّامَّةِ.\",\n                    \"بَيْنَ الجُمَلِ المَعْطُوفَةِ القَصِيرَةِ المُمَثِّلَةِ لِفِكْرَةٍ وَاحِدَةٍ.\",\n                    \"بَيْنَ السَّبَبِ وَالمُسَبَّبِ.\",\n                    \"بَعْدَ جُمْلَةِ القَوْلِ المَبَاشِرِ.\"\n                ],\n                correct: 1, // ب\n                e              ],\n                correct: 0, // أ\n                explain: \"تُحاط المصطلحات الأجنبية أو العناوين الفرعية بالأقواس لإبرازها وتمييزها.\"\n            }\n        ];\n\n        /* === 2. المتغيرات والمنطق للعبة === */\n        let currentQuestionIndex = 0;\n        let currentTeam = 1; // 1: التميز (Blue), 2: التفوق (Green)\n        let team1Score = 0;\n        let team2Score = 0;\n        let isSpinning = false;\n        let audioCtx = null;\n\n        // الألوان للعجلة\n        const wheelColors = [\n            '#f59e0b', '#3b82f6', '#10b981', '#ec4899', \n            '#8b5cf6', '#06b6d4', '#f97316', '#84cc16'\n        ];\n\n        // تهيئة محرك الصوت المدمج Web Audio API\n        function initAudio() {\n            if (!audioCtx) {\n                audioCtx = new (window.AudioContext || window.webkitAudioContext)();\n            }\n        }\n\n        function playSound(type) {\n            try {\n                initAudio();\n                if (!audioCtx) return;\n                \n                const osc = audioCtx.createOscillator();\n                const gain = audioCtx.createGain();\n                osc.connect(gain);\n                gain.connect(audioCtx.destination);\n\n                if (type === 'tick') {\n                    osc.frequency.setValueAtTime(600, audioCtx.currentTime);\n                    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);\n                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);\n                    osc.start();\n                    osc.stop(audioCtx.currentTime + 0.05);\n                } else if (type === 'correct') {\n                    osc.frequency.setValueAtTime(400, audioCtx.currentTime);\n                    osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.3);\n                    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);\n                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);\n                    osc.start();\n                    osc.stop(audioCtx.currentTime + 0.3);\n                } else if (type === 'wrong') {\n                    osc.type = 'sawtooth';\n                    osc.frequency.setValueAtTime(200, audioCtx.currentTime);\n                    osc.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 0.3);\n                    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);\n                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);\n                    osc.start();\n                    osc.stop(audioCtx.currentTime + 0.3);\n                }\n            } catch (e) {\n                console.log(\"Audio not allowed yet\");\n            }\n        }\n\n        /* === 3. رسم عجلة الحظ على Canvas === */\n        const canvas = document.getElementById('wheel-canvas');\n        const ctx = canvas.getContext('2d');\n        const numSlices = 8;\n        const sliceAngle = (2 * Math.PI) / numSlices;\n\n        function drawWheel() {\n            const centerX = canvas.width / 2;\n            const centerY = canvas.height / 2;\n            const radius = canvas.width / 2 - 10;\n\n            ctx.clearRect(0, 0, canvas.width, canvas.height);\n\n            for (let i = 0; i \u003c numSlices; i++) {\n                const angle = i * sliceAngle;\n                \n                // رسم القطاع\n                ctx.beginPath();\n                ctx.moveTo(centerX, centerY);\n                ctx.arc(centerX, centerY, radius, angle, angle + sliceAngle);\n                ctx.closePath();\n                ctx.fillStyle = wheelColors[i % wheelColors.length];\n                ctx.fill();\n                ctx.lineWidth = 3;\n                ctx.strokeStyle = '#0f172a';\n                ctx.stroke();\n\n                // كتابة رقم أو أيقونة القطاع\n                ctx.save();\n                ctx.translate(centerX, centerY);\n                ctx.rotate(angle + sliceAngle / 2);\n                ctx.textAlign = \"right\";\n                ctx.fillStyle = \"#ffffff\";\n                ctx.font = \"bold 20px Cairo\";\n                ctx.fillText(\"سُؤَال \" + (i + 1), radius - 25, 7);\n                ctx.restore();\n            }\n\n            // المركز\n            ctx.beginPath();\n            ctx.arc(centerX, centerY, 35, 0, 2 * Math.PI);\n            ctx.fillStyle = '#0f172a';\n            ctx.fill();\n            ctx.lineWidth = 4;\n            ctx.strokeStyle = '#f59e0b';\n            ctx.stroke();\n\n            ctx.fillStyle = '#f59e0b';\n            ctx.font = \"bold 16px Cairo\";\n            ctx.textAlign = \"center\";\n            ctx.fillText(\"🎯\", centerX, centerY + 6);\n        }\n\n        // رسم العجلة فور التحميل\n        drawWheel();\n\n        /* === 4. الفتح المباشر ومشاركة الرابط === */\n        function openGame() {\n            playSound('correct');\n            const gate = document.getElementById('opening-gate');\n            gate.classList.add('opacity-0', 'pointer-events-none');\n            setTimeout(() => {\n                gate.style.display = 'none';\n            }, 700);\n        }\n\n        function copyGameLink() {\n            // نسخ رابط الصفحة الحالي أو كود اللعبة\n            const dummy = document.createElement('input');\n            document.body.appendChild(dummy);\n            dummy.value = window.location.href;\n            dummy.select();\n            document.execCommand('copy');\n            document.body.removeChild(dummy);\n\n            const toast = document.getElementById('copy-toast');\n            if (toast) {\n                toast.classList.remove('hidden');\n                setTimeout(() => {\n                    toast.classList.add('hidden');\n                }, 3500);\n            }\n        }\n\n        /* === 5. تدوير العجلة === */\n        let currentRotation = 0;\n        function spinWheel() {\n            if (isSpinning) return;\n            initAudio();\n\n            isSpinning = true;\n            document.getElementById('spin-btn').disabled = true;\n\n            // إعطاء دورات عشوائية\n            const randomRounds = 5 + Math.floor(Math.random() * 5);\n            const randomDegree = Math.floor(Math.random() * 360);\n            currentRotation += (randomRounds * 360) + randomDegree;\n\n            canvas.style.transform = `rotate(${currentRotation}deg)`;\n\n            // تأثير صوتی للتدوير\n            let tickInterval = setInterval(() => {\n                playSound('tick');\n            }, 150);\n\n            setTimeout(() => {\n                clearInterval(tickInterval);\n                isSpinning = false;\n                document.getElementById('spin-btn').disabled = false;\n                \n                // فتح السؤال\n                showQuestionModal();\n            }, 4000);\n        }\n\n        /* === 6. عرض إدارة الأسئلة والنظام === */\n        function showQuestionModal() {\n            if (currentQuestionIndex >= questionsData.length) {\n                showFinalWinner();\n                return;\n            }\n\n            const qData = questionsData[currentQuestionIndex];\n            const modal = document.getElementById('question-modal');\n            const qText = document.getElementById('question-text');\n            const optionsContainer = document.getElementById('options-container');\n            const teamBadge = document.getElementById('current-team-badge');\n            const qBadge = document.getElementById('question-number-badge');\n            const feedbackBox = document.getElementById('feedback-box');\n            const nextBtn = document.getElementById('next-btn');\n\n            // إخفاء التغذية والزر السابقتين\n            feedbackBox.classList.add('hidden');\n            nextBtn.classList.add('hidden');\n\n            // تحديث الفريق الحاضر\n            if (currentTeam === 1) {\n                teamBadge.className = \"px-4 py-1.5 rounded-full text-xs font-black bg-blue-500/20 text-blue-300 border border-blue-500/40\";\n                teamBadge.innerHTML = \"🔵 فَرِيقُ التَّمَيُّزِ (دَوْرُكُمْ)\";\n            } else {\n                teamBadge.className = \"px-4 py-1.5 rounded-full text-xs font-black bg-emerald-500/20 text-emerald-300 border border-emerald-500/40\";\n                teamBadge.innerHTML = \"🟢 فَرِيقُ التَّفَوُّقِ (دَوْرُكُمْ)\";\n            }\n\n            qBadge.innerText = `السُّؤَالُ (${currentQuestionIndex + 1} / ${questionsData.length})`;\n            qText.innerText = qData.q;\n\n            // بناء الخيارات (الرموز أ ، ب ، ج ، د)\n            const optionLabels = [\"أ\", \"ب\", \"ج\", \"د\"];\n            optionsContainer.innerHTML = '';\n\n            qData.options.forEach((optText, idx) => {\n                const btn = document.createElement('button');\n                btn.className = \"w-full p-4 rounded-xl bg-slate-800/80 hover:bg-slate-700/90 border border-slate-700 text-right font-bold text-sm sm:text-base text-slate-100 flex items-center gap-3 transition-all cursor-pointer active:scale-98\";\n                btn.innerHTML = `\n                    \u003cspan class=\"w-8 h-8 rounded-lg bg-amber-500/20 border border-amber-500/40 text-amber-400 flex items-center justify-center text-xs font-black\">${optionLabels[idx]}\u003c/span>\n                    \u003cspan>${optText}\u003c/span>\n                `;\n                btn.onclick = () => checkAnswer(idx, btn);\n                optionsContainer.appendChild(btn);\n            });\n\n            modal.classList.remove('hidden');\n        }\n\n        /* === 7. التحقق من الإجابة والتغذية الراجعة المجردة === */\n        function checkAnswer(selectedIndex, clickedBtn) {\n            const qData = questionsData[currentQuestionIndex];\n            const optionsContainer = document.getElementById('options-container');\n            const buttons = optionsContainer.getElementsByTagName('button');\n            const feedbackBox = document.getElementById('feedback-box');\n            const feedbackTitle = document.getElementById('feedback-title');\n            const feedbackExplanation = document.getElementById('feedback-explanation');\n            const nextBtn = document.getElementById('next-btn');\n\n            // تعطيل جميع الأزرار لمنع التكرار\n            for (let btn of buttons) {\n                btn.disabled = true;\n                btn.classList.add('opacity-60', 'cursor-not-allowed');\n            }\n\n            const isCorrect = (selectedIndex === qData.correct);\n\n            if (isCorrect) {\n                playSound('correct');\n                clickedBtn.classList.remove('bg-slate-800/80', 'border-slate-700');\n                clickedBtn.classList.add('bg-emerald-950/80', 'border-emerald-500', 'text-emerald-200');\n\n                if (currentTeam === 1) team1Score += 10;\n                else team2Score += 10;\n                updateScores();\n\n                feedbackBox.className = \"p-4 rounded-xl text-right font-bold text-sm sm:text-base border border-emerald-500/50 bg-emerald-950/40 text-emerald-300 block\";\n                feedbackTitle.innerHTML = \"✅ إِجَابَةٌ صَحِيحَةٌ! (+10 نُقَاطٍ)\";\n            } else {\n                playSound('wrong');\n                clickedBtn.classList.remove('bg-slate-800/80', 'border-slate-700');\n                clickedBtn.classList.add('bg-rose-950/80', 'border-rose-500', 'text-rose-200');\n\n                // إبراز الإجابة الصحيحة بدون أي إيحاء لفظي سابق\n                buttons[qData.correct].classList.remove('opacity-60');\n                buttons[qData.correct].classList.add('bg-emerald-950/60', 'border-emerald-500/80', 'text-emerald-200');\n\n                feedbackBox.className = \"p-4 rounded-xl text-right font-bold text-sm sm:text-base border border-rose-500/50 bg-rose-950/40 text-rose-300 block\";\n                feedbackTitle.innerHTML = \"❌ إِجَابَةٌ غَيْرُ صَحِيحَةٍ\";\n            }\n\n            // التعليل النحوي المجرد من أي تلميحات\n            feedbackExplanation.innerText = \"التَّعْلِيلُ القَوَاعِدِيُّ: \" + qData.explain;\n            nextBtn.classList.remove('hidden');\n        }\n\n        function closeQuestionModal() {\n            document.getElementById('question-modal').classList.add('hidden');\n            \n            // الانتقال للسؤال التالي وتبديل الدور\n            currentQuestionIndex++;\n            currentTeam = (currentTeam === 1) ? 2 : 1;\n            updateTeamCardsUI();\n\n            if (currentQuestionIndex >= questionsData.length) {\n                showFinalWinner();\n            }\n        }\n\n        function updateScores() {\n            document.getElementById('team1-score').innerText = team1Score;\n            document.getElementById('team2-score').innerText = team2Score;\n        }\n\n        function updateTeamCardsUI() {\n            const card1 = document.getElementById('team1-card');\n            const card2 = document.getElementById('team2-card');\n            const ind1 = document.getElementById('team1-turn-indicator');\n            const ind2 = document.getElementById('team2-turn-indicator');\n\n            if (currentTeam === 1) {\n                card1.classList.remove('opacity-60');\n                card1.classList.add('border-blue-500/50');\n                ind1.innerText = \"الدَّوْرُ الحَالِيّ\";\n\n                card2.classList.add('opacity-60');\n                card2.classList.remove('border-emerald-500/50');\n                ind2.innerText = \"في الانتظار\";\n            } else {\n                card2.classList.remove('opacity-60');\n                card2.classList.add('border-emerald-500/50');\n                ind2.innerText = \"الدَّوْرُ الحَالِيّ\";\n\n                card1.classList.add('opacity-60');\n                card1.classList.remove('border-blue-500/50');\n                ind1.innerText = \"في الانتظار\";\n            }\n        }\n\n        function showFinalWinner() {\n            confetti({\n                particleCount: 150,\n                spread: 80,\n                origin: { y: 0.6 }\n            });\n\n            let winnerText = \"\";\n            if (team1Score > team2Score) {\n                winnerText = \"🎉 الفَائِزُ هُوَ: فَرِيقُ التَّمَيُّزِ 🔵!\";\n            } else if (team2Score > team1Score) {\n                winnerText = \"🎉 الفَائِزُ هُوَ: فَرِيقُ التَّفَوُّقِ 🟢!\";\n            } else {\n                winnerText = \"🤝 تَعَادُلٌ بَطَلٌ بَيْنَ الفَرِيقَيْنِ!\";\n            }\n\n            const modal = document.getElementById('question-modal');\n            const qText = document.getElementById('question-text');\n            const optionsContainer = document.getElementById('options-container');\n            const feedbackBox = document.getElementById('feedback-box');\n            const nextBtn = document.getElementById('next-btn');\n\n            document.getElementById('current-team-badge').innerText = \"🏆 نِهَايَةُ المَسَابَقَةِ\";\n            document.getElementById('question-number-badge').innerText = \"اِكْتِمَالُ الـ 30 سُؤَالاً\";\n            \n            qText.innerHTML = `\u003cdiv class=\"text-center text-3xl font-black text-amber-400 py-4\">${winnerText}\u003c/div>`;\n            optionsContainer.innerHTML = `\n                \u003cdiv class=\"text-center font-bold text-slate-300 space-y-2 py-4\">\n                    \u003cp class=\"text-xl\">🔵 نقاط فريق التميز: ${team1Score}\u003c/p>\n                    \u003cp class=\"text-xl\">🟢 نقاط فريق التفوق: ${team2Score}\u003c/p>\n                \u003c/div>\n            `;\n            feedbackBox.classList.add('hidden');\n            nextBtn.innerText = \"🔄 إِعَادَةُ المَسَابَقَةِ مِنْ الجَدِيدِ\";\n            nextBtn.onclick = () => location.reload();\n            nextBtn.classList.remove('hidden');\n\n            modal.classList.remove('hidden');\n        }\n\n        function resetGame() {\n            if (confirm(\"هل ترغب في إعادة المسابقة وتصفير النقاط؟\")) {\n                location.reload();\n            }\n        }\n    \u003c/script>\n\u003c/body>\n\u003c/html>"},{"id":"0rh7h4m","grade":0,"title":"عجلة الحظ التفاعلية - همزتا الوصل والقطع","desc":"","url":"","html":"\u003c!DOCTYPE html>\n\u003chtml lang=\"ar\" dir=\"rtl\">\n\u003chead>\n    \u003cmeta charset=\"UTF-8\">\n    \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    \u003ctitle>عَجَلَةُ الحَظِّ - هَمْزَتَا الوَصْلِ وَالقَطْعِ (الأستاذ أحمد عثمان)\u003c/title>\n    \u003c!-- Tailwind CSS -->\n    \u003cscript src=\"https://cdn.tailwindcss.com\">\u003c/script>\n    \u003c!-- FontAwesome Icons -->\n    \u003clink rel=\"stylesheet\" href=\"https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css\">\n    \u003c!-- Canvas Confetti -->\n    \u003cscript src=\"https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js\">\u003c/script>\n    \u003c!-- Google Font Cairo -->\n    \u003clink href=\"https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap\" rel=\"stylesheet\">\n    \n    \u003cstyle>\n        body {\n            font-family: 'Cairo', sans-serif;\n            background: radial-gradient(circle at center, #0f172a 0%, #020617 100%);\n            color: #f8fafc;\n            min-height: 100vh;\n            overflow-x: hidden;\n        }\n\n        /* الإضاءة والوهج الذهبي لمحل كلمة فتح */\n        .gold-glow {\n            box-shadow: 0 0 50px rgba(234, 179, 8, 0.6), inset 0 0 20px rgba(254, 240, 138, 0.5);\n            animation: pulse-glow 2s infinite alternate;\n        }\n\n        @keyframes pulse-glow {\n            0% {\n                box-shadow: 0 0 30px rgba(234, 179, 8, 0.4), inset 0 0 15px rgba(254, 240, 138, 0.3);\n                transform: scale(1);\n            }\n            100% {\n                box-shadow: 0 0 70px rgba(234, 179, 8, 0.8), inset 0 0 35px rgba(254, 240, 138, 0.7);\n                transform: scale(1.02);\n            }\n        }\n\n        .gold-text-glow {\n            text-shadow: 0 0 20px rgba(234, 179, 8, 0.9), 0 0 40px rgba(234, 179, 8, 0.5);\n        }\n\n        /* تحريك عجلة الحظ */\n        #wheel-canvas {\n            transition: transform 4s cubic-bezier(0.15, 0.99, 0.18, 1);\n        }\n\n        .wheel-pointer {\n            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5));\n        }\n\n        .custom-scrollbar::-webkit-scrollbar {\n            width: 6px;\n        }\n        .custom-scrollbar::-webkit-scrollbar-thumb {\n            background: #334155;\n            border-radius: 9999px;\n        }\n    \u003c/style>\n\u003c/head>\n\u003cbody class=\"flex flex-col min-h-screen justify-between items-center p-2 sm:p-4\">\n\n    \u003c!-- 1. محل كلمة فتح المباشر (الشاشة الافتتاحية الضخمة) -->\n    \u003cdiv id=\"opening-gate\" class=\"fixed inset-0 z-50 flex flex-col items-center justify-center bg-slate-950/95 backdrop-blur-xl p-4 transition-all duration-700\">\n        \u003c!-- التوثيق والترويسة -->\n        \u003cdiv class=\"absolute top-4 w-full flex justify-between items-center px-6 text-xs sm:text-base font-bold text-amber-300 border-b border-amber-500/20 pb-3\">\n            \u003cdiv class=\"flex items-center gap-2\">\n                \u003ci class=\"fa-solid fa-user-pen text-amber-400\">\u003c/i>\n                \u003cspan>إِعْدَادُ: الأُسْتَاذِ أَحْمَد عُثْمَان\u003c/span>\n            \u003c/div>\n            \u003cdiv class=\"flex items-center gap-2 bg-amber-500/10 px-3 py-1 rounded-full border border-amber-500/30\">\n                \u003ci class=\"fa-solid fa-clock text-amber-400\">\u003c/i>\n                \u003cspan>الزَّمَنُ: مَفْتُوحٌ ♾️\u003c/span>\n            \u003c/div>\n        \u003c/div>\n\n        \u003c!-- مركز محل الفتح -->\n        \u003cdiv class=\"max-w-xl w-full text-center flex flex-col items-center mt-8\">\n            \u003cdiv class=\"inline-block mb-3 px-4 py-1.5 rounded-full bg-emerald-500/20 border border-emerald-400/40 text-emerald-300 font-bold text-xs sm:text-sm\">\n                🔥 الـمُسْتَوَى الأَصْعَبُ | هَمْزَتَا الوَصْلِ وَالقَطْعِ\n            \u003c/div>\n\n            \u003ch1 class=\"text-3xl sm:text-5xl font-black mb-6 text-white tracking-wide\">\n                عَجَلَةُ الحَظِّ النَّحْوِيَّةُ\n            \u003c/h1>\n\n            \u003c!-- بطاقة محل الفتح الضخمة والبارزة -->\n            \u003cdiv class=\"w-full bg-gradient-to-b from-slate-900 via-indigo-950 to-slate-900 border-4 border-amber-500 rounded-3xl p-6 sm:p-8 gold-glow flex flex-col items-center gap-6 my-2 shadow-2xl relative overflow-hidden\">\n                \u003cdiv class=\"absolute -top-10 -right-10 w-32 h-32 bg-amber-500/10 rounded-full blur-2xl\">\u003c/div>\n                \n                \u003cdiv class=\"text-amber-400 text-xs sm:text-sm font-extrabold tracking-widest uppercase\">\n                    📍 مَحَلُّ فَتْحِ اللَّعْبَةِ المُبَاشِرُ\n                \u003c/div>\n\n                \u003c!-- زر كلمة فتح البارز والعملاق -->\n                \u003cbutton id=\"open-game-btn\" onclick=\"openGame()\" class=\"w-full py-6 sm:py-8 bg-gradient-to-r from-amber-500 via-yellow-400 to-amber-600 hover:from-amber-400 hover:to-yellow-300 text-slate-950 font-black text-3xl sm:text-5xl rounded-2xl shadow-2xl flex flex-col items-center justify-center gap-3 transition-transform active:scale-95 cursor-pointer border-2 border-yellow-200\">\n                    \u003cdiv class=\"flex items-center gap-4 gold-text-glow\">\n                        \u003ci class=\"fa-solid fa-lock-open text-4xl sm:text-6xl animate-bounce\">\u003c/i>\n                        \u003cspan>فَتْح\u003c/span>\n                    \u003c/div>\n                    \u003cspan class=\"text-xs sm:text-sm font-extrabold tracking-normal text-slate-900 bg-yellow-300/80 px-4 py-1 rounded-full\">\n                        🔓 اضْغَطْ هُنَا لِـ فَتْحِ اللَّعْبَةِ وَابْدَأِ التَّحَدِّيَ\n                    \u003c/span>\n                \u003c/button>\n\n                \u003c!-- قسم نسخ رابط/كود الفتح للطلاب -->\n                \u003cdiv class=\"w-full pt-4 border-t border-slate-700/60 flex flex-col gap-2\">\n                    \u003cspan class=\"text-xs text-slate-300 font-semibold\">لِمَشَارَكَةِ اللَّعْبَةِ وَإِرْسَالِهَا لِلطُّلَّابِ:\u003c/span>\n                    \u003cbutton onclick=\"copyGameLink()\" class=\"w-full py-3 px-4 bg-slate-800 hover:bg-slate-700 text-amber-300 border border-amber-500/40 rounded-xl font-bold text-xs sm:text-base flex items-center justify-center gap-2 transition-all active:scale-95\">\n                        \u003ci class=\"fa-solid fa-link text-amber-400\">\u003c/i>\n                        \u003cspan>🔗 نَسْخُ رَابِطِ / كُودِ اللَّعْبَةِ لِلإِرْسَالِ لِلطُّلَّابِ\u003c/span>\n                    \u003c/button>\n                    \u003cdiv id=\"copy-toast\" class=\"hidden text-xs text-emerald-400 font-bold mt-1 animate-fade-in\">\n                        ✅ تَمَّ نَسْخُ كُودِ وَرَابِطِ اللَّعْبَةِ بِنَجَاحٍ! كُنْ جَاهِزاً لِمَشَارَكَتِهِ.\n                    \u003c/div>\n                \u003c/div>\n            \u003c/div>\n            \n            \u003cp class=\"text-xs text-slate-400 mt-4\">30 سُؤَالاً مُتَنَوِّعاً | تَدْوِيرٌ مُنْتَظَمٌ لِلإِجَابَاتِ (Round-Robin) | خَالٍ مِنَ الإِيحَاءِ\u003c/p>\n        \u003c/div>\n    \u003c/div>\n\n    \u003c!-- 2. الترويسة الرئيسية داخل اللعبة -->\n    \u003cheader class=\"w-full max-w-5xl flex flex-wrap justify-between items-center bg-slate-900/80 border border-slate-700/60 p-3 sm:p-4 rounded-2xl mb-4 backdrop-blur-md shadow-lg\">\n        \u003cdiv class=\"flex items-center gap-3\">\n            \u003cdiv class=\"w-10 h-10 rounded-xl bg-amber-500/20 border border-amber-500/40 flex items-center justify-center text-amber-400 font-bold\">\n                ✍️\n            \u003c/div>\n            \u003cdiv>\n                \u003ch2 class=\"font-black text-sm sm:text-xl text-amber-400\">هَمْزَتَا الوَصْلِ وَالقَطْعِ (المستوى الأصعب 🔥)\u003c/h2>\n                \u003cp class=\"text-xs text-slate-400\">إِعْدَادُ: الأُسْتَاذِ أَحْمَد عُثْمَان | ♾️ الزَّمَنُ: مَفْتُوحٌ\u003c/p>\n            \u003c/div>\n        \u003c/div>\n\n        \u003cdiv class=\"flex items-center gap-3 mt-2 sm:mt-0\">\n            \u003cbutton onclick=\"copyGameLink()\" class=\"px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-amber-300 border border-amber-500/30 rounded-lg text-xs font-bold flex items-center gap-1.5\">\n                \u003ci class=\"fa-solid fa-share-nodes\">\u003c/i>\n                \u003cspan>نسخ الرابط\u003c/span>\n            \u003c/button>\n            \u003cbutton onclick=\"resetGame()\" class=\"px-3 py-1.5 bg-rose-950/60 hover:bg-rose-900/80 text-rose-300 border border-rose-500/30 rounded-lg text-xs font-bold flex items-center gap-1.5\">\n                \u003ci class=\"fa-solid fa-rotate-right\">\u003c/i>\n                \u003cspan>إعادة المسابقة\u003c/span>\n            \u003c/button>\n        \u003c/div>\n    \u003c/header>\n\n    \u003c!-- 3. لوحة النقاط والفرق -->\n    \u003cdiv class=\"w-full max-w-5xl grid grid-cols-2 gap-3 sm:gap-6 mb-4\">\n        \u003c!-- فريق التميز -->\n        \u003cdiv id=\"team1-card\" class=\"bg-gradient-to-br from-blue-950/80 to-slate-900 border-2 border-blue-500/50 p-4 rounded-2xl shadow-xl flex items-center justify-between transition-all\">\n            \u003cdiv class=\"flex items-center gap-3\">\n                \u003cdiv class=\"w-12 h-12 rounded-xl bg-blue-500/20 text-blue-400 flex items-center justify-center text-2xl font-black border border-blue-500/40\">\n                    🔵\n                \u003c/div>\n                \u003cdiv>\n                    \u003ch3 class=\"font-extrabold text-blue-300 text-xs sm:text-lg\">فَرِيقُ التَّمَيُّزِ\u003c/h3>\n                    \u003cp class=\"text-xs text-slate-400\" id=\"team1-turn-indicator\">الدَّوْرُ الحَالِيّ\u003c/p>\n                \u003c/div>\n            \u003c/div>\n            \u003cdiv class=\"text-2xl sm:text-4xl font-black text-blue-400\" id=\"team1-score\">0\u003c/div>\n        \u003c/div>\n\n        \u003c!-- فريق التفوق -->\n        \u003cdiv id=\"team2-card\" class=\"bg-gradient-to-br from-emerald-950/80 to-slate-900 border-2 border-slate-700/50 p-4 rounded-2xl shadow-xl flex items-center justify-between opacity-60 transition-all\">\n            \u003cdiv class=\"flex items-center gap-3\">\n                \u003cdiv class=\"w-12 h-12 rounded-xl bg-emerald-500/20 text-emerald-400 flex items-center justify-center text-2xl font-black border border-emerald-500/40\">\n                    🟢\n                \u003c/div>\n                \u003cdiv>\n                    \u003ch3 class=\"font-extrabold text-emerald-300 text-xs sm:text-lg\">فَرِيقُ التَّفَوُّقِ\u003c/h3>\n                    \u003cp class=\"text-xs text-slate-400\" id=\"team2-turn-indicator\">في الانتظار\u003c/p>\n                \u003c/div>\n            \u003c/div>\n            \u003cdiv class=\"text-2xl sm:text-4xl font-black text-emerald-400\" id=\"team2-score\">0\u003c/div>\n        \u003c/div>\n    \u003c/div>\n\n    \u003c!-- 4. منطقة العجلة التفاعلية -->\n    \u003cmain class=\"w-full max-w-5xl flex flex-col items-center my-auto\">\n        \u003cdiv class=\"relative flex flex-col items-center justify-center\">\n            \u003c!-- المؤشر العلوي -->\n            \u003cdiv class=\"wheel-pointer absolute -top-5 z-20 text-amber-400 text-4xl sm:text-5xl\">\n                \u003ci class=\"fa-solid fa-caret-down\">\u003c/i>\n            \u003c/div>\n\n            \u003c!-- Canvas عجلة الحظ -->\n            \u003ccanvas id=\"wheel-canvas\" width=\"420\" height=\"420\" class=\"max-w-[320px] sm:max-w-[420px] w-full h-auto rounded-full border-4 border-amber-500/60 shadow-2xl\">\u003c/canvas>\n\n            \u003c!-- زر التدوير بمنتصف العجلة -->\n            \u003cbutton id=\"spin-btn\" onclick=\"spinWheel()\" class=\"mt-6 px-8 py-4 bg-gradient-to-r from-amber-500 to-yellow-400 hover:from-amber-400 hover:to-yellow-300 text-slate-950 font-black text-xl sm:text-2xl rounded-2xl shadow-2xl border-2 border-amber-200 transition-all active:scale-95 flex items-center gap-3 cursor-pointer\">\n                \u003ci class=\"fa-solid fa-arrows-spin text-2xl\">\u003c/i>\n                \u003cspan>أَدِرِ العَجَلَةَ الآنَ\u003c/span>\n            \u003c/button>\n        \u003c/div>\n    \u003c/main>\n\n    \u003c!-- 5. نافذة عرض السؤال (Modal) -->\n    \u003cdiv id=\"question-modal\" class=\"fixed inset-0 z-40 hidden flex items-center justify-center bg-slate-950/90 backdrop-blur-md p-4\">\n        \u003cdiv class=\"bg-slate-900 border-2 border-amber-500/60 w-full max-w-2xl rounded-3xl p-5 sm:p-8 shadow-2xl flex flex-col gap-5 relative max-h-[90vh] overflow-y-auto custom-scrollbar\">\n            \u003c!-- الهيدر -->\n            \u003cdiv class=\"flex justify-between items-center border-b border-slate-800 pb-3\">\n                \u003cspan id=\"current-team-badge\" class=\"px-4 py-1.5 rounded-full text-xs font-black bg-blue-500/20 text-blue-300 border border-blue-500/40\">\n                    🔵 فَرِيقُ التَّمَيُّزِ\n                \u003c/span>\n                \u003cspan id=\"question-number-badge\" class=\"text-xs font-bold text-amber-400\">\n                    السُّؤَالُ (1 / 30)\n                \u003c/span>\n            \u003c/div>\n\n            \u003c!-- نص السؤال -->\n            \u003cdiv class=\"text-right\">\n                \u003ch3 id=\"question-text\" class=\"text-base sm:text-xl font-bold text-white leading-relaxed\">\n                    \u003c!-- سيتم تحميل النص برمجياً -->\n                \u003c/h3>\n            \u003c/div>\n\n            \u003c!-- الخيارات الاربعة (Round-Robin) -->\n            \u003cdiv id=\"options-container\" class=\"grid grid-cols-1 gap-3\">\n                \u003c!-- الخيارات ستضاف برمجياً -->\n            \u003c/div>\n\n            \u003c!-- التغذية الراجعة (خالية تماماً من الإيحاء) -->\n            \u003cdiv id=\"feedback-box\" class=\"hidden p-4 rounded-xl text-right font-bold text-xs sm:text-base border transition-all\">\n                \u003cdiv id=\"feedback-title\" class=\"text-sm sm:text-lg mb-1\">\u003c/div>\n                \u003cdiv id=\"feedback-explanation\" class=\"text-xs sm:text-sm font-semibold opacity-90 leading-relaxed\">\u003c/div>\n            \u003c/div>\n\n            \u003c!-- زر الاستمرار -->\n            \u003cbutton id=\"next-btn\" onclick=\"closeQuestionModal()\" class=\"hidden w-full py-3.5 bg-amber-500 hover:bg-amber-400 text-slate-950 font-black text-base sm:text-lg rounded-xl transition-all shadow-lg\">\n                مُتَابَعَةُ المَسَابَقَةِ ➔\n            \u003c/button>\n        \u003c/div>\n    \u003c/div>\n\n    \u003c!-- 6. التذييل -->\n    \u003cfooter class=\"w-full text-center py-3 text-xs text-slate-500 font-semibold border-t border-slate-800/80 mt-4\">\n        إِعْدَادُ: الأُسْتَاذِ أَحْمَد عُثْمَان | مَادَّةُ اللُّغَةِ العَرَبِيَّةِ | كَافَّةُ الحُقُوقِ مَحْفُوظَةٌ 2026 ©\n    \u003c/footer>\n\n    \u003c!-- البرمجة التفاعلية كاملة -->\n    \u003cscript>\n        /* === 1. أسئلة همزتا الوصل والقطع الـ 30 (المستوى الأصعب 🔥) === */\n        // تدوير منتظم (Round-Robin) آلي للإجابة الصحيحة: (أ -> ب -> ج -> د -> أ -> ب ...)\n        const questionsData = [\n            {\n                q: \"حَدِّدِ الكَلِمَةَ الَّتِي كُتِبَتْ هَمْزَتُهَا هَمْزَةَ قَطْعٍ عَنْ صَوَابٍ فِيمَا يَلِي:\",\n                options: [\n                    \"إِكْرَامٌ\",\n                    \"اِكْرَامٌ\",\n                    \"اِسْتِغْفَارٌ\",\n                    \"اِبْتِسَامٌ\"\n                ],\n                correct: 0, // أ\n                explain: \"«إِكْرَامٌ» مصدر الفعل الرباعي «أَكْرَمَ»، وهمزة الرباعي ومصدره همزة قطع دائمًا، بخلاف مصادر الخماسي والسداسي فهي وصل.\"\n            },\n            {\n                q: \"مَا سَبَبُ كِتَابَةِ الهَمْزَةِ وَصْلاً فِي كَلِمَةِ «اُكْتُبْ»؟\",\n                options: [\n                    \"لِأَنَّهَا فِعْلٌ مَاضٍ ثُلاَثِيٌّ.\",\n                    \"لِأَنَّهَا فِعْلُ أَمْرٍ مِنْ فِعْلٍ ثُلاَثِيٍّ.\",\n                    \"لِأَنَّهَا مَصْدَرٌ رُبَاعِيٌّ.\",\n                    \"لِأَنَّهَا حَرْفٌ مِنْ الحُرُوفِ.\"\n                ],\n                correct: 1, // ب\n                explain: \"الفعل «اُكْتُبْ» هو أمرٌ أُخِذَ من الفعل الماضي الثلاثي «كَتَبَ»، وأمر الثلاثي همزته همزة وصل.\"\n            },\n            {\n                q: \"أَيُّ الجُمَلِ الآتِيَةِ اشْتَمَلَتْ عَلَى خَطَأٍ إِمْلاَئِيٍّ فِي كِتَابَةِ الهَمْزَةِ؟\",\n                options: [\n                    \"انْطَلَقَ الفَارِسُ انْطِلاَقًا سَرِيعًا.\",\n                    \"اسْتَغْفَرَ العَبْدُ رَبَّهُ فِي السَّحَرِ.\",\n                    \"أَحْسَنَ الرَّجُلُ اِلَى جِيرَانِهِ.\",\n                    \"ابْنُ خَلْدُونَ مُؤَرِّخٌ عَرَبِيٌّ.\"\n                ],\n                correct: 2, // ج\n                explain: \"الخطأ في «اِلَى»، فالصواب كتابتها بحمزة قطع تحت الألف «إِلَى» لأن جميع الحروف همزتها قطع ما عدا (أل) التعريف.\"\n            },\n            {\n                q: \"جَمِيعُ الأسْمَاءِ الآتِيَةِ هَمْزَتُهَا هَمْزَةُ وَصْلٍ سَمَاعِيَّةٍ مَا عَدَا:\",\n                options: [\n                    \"اسْمٌ\",\n                    \"امْرُؤٌ\",\n                    \"اثْنَانِ\",\n                    \"أَبٌ\"\n                ],\n                correct: 3, // د\n                explain: \"الأسماء السماعية العشرة (مثل: اسم، ابن، امرؤ، اثنان) همزتها وصل، بينما اسم «أَبٌ» همزته قطع.\"\n            },\n            {\n                q: \"مَا نَوْعُ الهَمْزَةِ فِي الفِعْلِ «أَقْبَلَ» وَمَا عِلَّتُهَا؟\",\n                options: [\n                    \"قَطْعٌ؛ لِأَنَّهُ فِعْلٌ مَاضٍ رُبَاعِيٌّ.\",\n                    \"وَصْلٌ؛ لِأَنَّهُ فِعْلٌ مَاضٍ ثُلاَثِيٌّ.\",\n                    \"وَصْلٌ؛ لِأَنَّهُ أَمْرٌ خُمَاسِيٌّ.\",\n                    \"قَطْعٌ؛ لِأَنَّهُ مَصْدَرٌ سُدَاسِيٌّ.\"\n                ],\n                correct: 0, // أ\n                explain: \"الفعل الماضي الرباعي «أَقْبَلَ» همزته همزة قطع، وكذلك أمره ومصدره.\"\n            },\n            {\n                q: \"تُكْتَبُ هَمْزَةُ المَصْدَرِ «انْتِصَار» هَمْزَةَ وَصْلٍ لِأَنَّهُ مَصْدَرُ فِعْلٍ:\",\n                options: [\n                    \"ثُلاَثِيٍّ.\",\n                    \"خُمَاسِيٍّ.\",\n                    \"رُبَاعِيٍّ.\",\n                    \"سُدَاسِيٍّ.\"\n                ],\n                correct: 1, // ب\n                explain: \"المصدر «انْتِصَار» مشتق من الفعل الماضي الخماسي «انْتَصَرَ» (5 حروف)، ومصدر الخماسي همزته وصل.\"\n            },\n            {\n                q: \"أَيُّ الضَّمَائِرِ الآتِيَةِ كُتِبَتْ هَمْزَتُهُ بِشَكْلٍ صَحِيحٍ؟\",\n                options: [\n                    \"انْتَ\",\n                    \"إِنْتُمَا\",\n                    \"أَنْتُمْ\",\n                    \"اَنْتُنَّ\"\n                ],\n                correct: 2, // ج\n                explain: \"الضمائر المنفصلة المبدوءة بهمزات (مثل: أَنْتَ، أَنْتُمْ، أَنَا) كلها أسماء همزتها قطع وتُرسم الهمزة فوق الألف.\"\n            },\n            {\n                q: \"تُحْذَفُ همزة «ابْن» خطّاً فِي قَوْلِنَا:\",\n                options: [\n                    \"ابْنُ عُمَرَ عَالِمٌ.\",\n                    \"حَضَرَ عُمَرُ ابْنُ الخَطَّابِ كَمُعَلِّمٍ.\",\n                    \"إِنَّ هَذَا ابْنُ زَيْدٍ.\",\n                    \"عُمَرُ بْنُ الخَطَّابِ خَلِيفَةٌ عَادِلٌ.\"\n                ],\n                correct: 3, // د\n                explain: \"تُحذف همزة «ابن» إذا وقعت مفردة بين علمين مباشرين الثاني منهما أباً للأول ولم تقع في أول السطر.\"\n            },\n            {\n                q: \"مَا العِلَّةُ النَّحْوِيَّةُ فِي كِتَابَةِ الهَمْزَةِ فِي «اسْتَخْرَجَ» هَمْزَةَ وَصْلٍ؟\",\n                options: [\n                    \"لِأَنَّهُ فِعْلٌ مَاضٍ سُدَاسِيٌّ.\",\n                    \"لِأَنَّهُ فِعْلٌ مَاضٍ خُمَاسِيٌّ.\",\n                    \"لِأَنَّهُ أَمْرٌ رُبَاعِيٌّ.\",\n                    \"لِأَنَّهُ حَرْفٌ مَبْنِيٌّ.\"\n                ],\n                correct: 0, // أ\n                explain: \"الفعل الماضي السداسي «اسْتَخْرَجَ» يتكون من ستة أحرف، والماضي والأمر والمصدر من السداسي كلها همزات وصل.\"\n            },\n            {\n                q: \"حَدِّدِ الحَرْفَ الَّذِي هَمْزَتُهُ هَمْزَةُ وَصْلٍ فِيمَا يَلِي:\",\n                options: [\n                    \"إِلَى\",\n                    \"الْ (حَرْفُ التَّعْرِيفِ)\",\n                    \"إِنَّ\",\n                    \"أَوْ\"\n                ],\n                correct: 1, // ب\n                explain: \"جميع الحروف في اللغة العربية همزتها قطع ما عدا (أل) التعريف الحرفية فإن همزتها همزة وصل.\"\n            },\n            {\n                q: \"مَا نَوْعُ الهَمْزَةِ فِي فِعْلِ الأَمْرِ «أَحْسِنْ»؟\",\n                options: [\n                    \"وَصْلٌ؛ لِأَنَّهُ أَمْرُ ثُلاَثِيٍّ.\",\n                    \"وَصْلٌ؛ لِأَنَّهُ أَمْرُ خُمَاسِيٍّ.\",\n                    \"قَطْعٌ؛ لِأَنَّهُ أَمْرُ فِعْلٍ رُبَاعِيٍّ.\",\n                    \"قَطْعٌ؛ لِأَنَّهُ مَاضٍ ثُلاَثِيٌّ.\"\n                ],\n                correct: 2, // ج\n                explain: \"الفعل «أَحْسِنْ» أمر من الرباعي «أَحْسَنَ»، وأمر الرباعي همزته همزة قطع دائماً.\"\n            },\n            {\n                q: \"أَيُّ المَصَادِرِ الآتِيَةِ كُتِبَتْ هَمْزَتُهُ هَمْزَةَ قَطْعٍ لِأَنَّهُ مَصْدَرٌ رُبَاعِيٌّ؟\",\n                options: [\n                    \"اسْتِعْدَادٌ\",\n                    \"انْطِلاَقٌ\",\n                    \"اجْتِمَاعٌ\",\n                    \"إِعْلاَنٌ\"\n                ],\n                correct: 3, // د\n                explain: \"المصدر «إِعْلاَنٌ» مشتق من الماضي الرباعي «أَعْلَنَ»، ومصدر الرباعي همزته همزة قطع.\"\n            },\n            {\n                q: \"تُكْتَبُ الهَمْزَةُ فِي «أَكَلَ» هَمْزَةَ قَطْعٍ لِأَنَّهَا فِي:\",\n                options: [\n                    \"مَاضِي الفِعْلِ الثُّلاَثِيِّ المَهْمُوزِ.\",\n                    \"أَمْرِ الفِعْلِ الثُّلاَثِيِّ.\",\n                    \"مَاضِي الفِعْلِ الخُمَاسِيِّ.\",\n                    \"مَصْدَرِ الفِعْلِ السُّدَاسِيِّ.\"\n                ],\n                correct: 0, // أ\n                explain: \"الماضي الثلاثي المهموز الفاء «أَكَلَ» ومصدره «أَكْلاً» همزتهما همزة قطع.\"\n            },\n            {\n                q: \"عِنْدَ إِدْخَالِ هَمْزَةِ الاِسْتِفْهَامِ عَلَى كَلِمَةِ «الْكِتَابُ»، تُكْتَبُ الجُمْلَةُ:\",\n                options: [\n                    \"أَالْكِتَابُ مَعَكَ؟\",\n                    \"آلْكِتَابُ مَعَكَ؟\",\n                    \"إِلْكِتَابُ مَعَكَ؟\",\n                    \"الْكِتَابُ مَعَكَ؟\"\n                ],\n                correct: 1, // ب\n                explain: \"إذا دخلت همزة الاستفهام على همزة الوصل في (أل) التعريف قُلبت الهمزتان مدةً «آ» (آلْكِتَابُ).\"\n            },\n            {\n                q: \"كَلِمَةُ «اِمْرَأَةٌ» هَمْزَتُهَا هَمْزَةُ وَصْلٍ، لَكِنْ عِنْدَ جَمْعِهَا جَمْعَ تِكْسِيرٍ تُرْسَمُ فِي «نِسَاء»، أَمَّا عِنْدَ تَثْنِيَتِهَا فَتُكْتَبُ:\",\n                options: [\n                    \"إِمْرَأَتَانِ\",\n                    \"أَمْرَأَتَانِ\",\n                    \"امْرَأَتَانِ\",\n                    \"إِمْرَأَتَيْنِ\"\n                ],\n                correct: 2, // ج\n                explain: \"المثنى من الأسماء السماعية «امرأة» يظل بصل همزته فيكتب «امْرَأَتَانِ» دون رسم الهمزة.\"\n            },\n            {\n                q: \"مَا العِلَّةُ فِي كِتَابَةِ «أَدْرَسَ» بِهَمْزَةِ قَطْعٍ مُقَارَنَةً بِـ «ادْرُسْ»؟\",\n                options: [\n                    \"«أَدْرَسَ» مَاضٍ خُمَاسِيٌّ، و«ادْرُسْ» أَمْرُ سُدَاسِيٍّ.\",\n                    \"«أَدْرَسَ» أَمْرُ ثُلاَثِيٍّ، و«ادْرُسْ» مَاضٍ رُبَاعِيٌّ.\",\n                    \"«أَدْرَسَ» اسْمٌ، و«ادْرُسْ» حَرْفٌ.\",\n                    \"«أَدْرَسَ» مَاضٍ رُبَاعِيٌّ (أَكْرَمَ)، و«ادْرُسْ» أَمْرُ ثُلاَثِيٍّ.\"\n                ],\n                correct: 3, // د\n                explain: \"«أَدْرَسَ» ماضٍ رباعي على وزن «أَفْعَلَ» وهمزته قطع، أما «ادْرُسْ» فهو أمر الثلاثي «دَرَسَ» وهمزته وصل.\"\n            },\n            {\n                q: \"مَا الكَلِمَةُ المَكْتُوبَةُ صَوَاباً فِيمَا يَلِي؟\",\n                options: [\n                    \"اِسْمَاعِيلُ\",\n                    \"إِبْرَاهِيمُ\",\n                    \"اُسَامَةُ\",\n                    \"إِسْتِغْفَارٌ\"\n                ],\n                correct: 1, // ب\n                explain: \"«إِبْرَاهِيمُ» اسم علم غير سماعي، وجميع أسماء الأعلام همزتها همزة قطع.\"\n            },\n            {\n                q: \"مَا سَبَبُ كِتَابَةِ الهَمْزَةِ فِي «اسْتِمَاع» هَمْزَةَ وَصْلٍ؟\",\n                options: [\n                    \"لِأَنَّهُ مَصْدَرٌ سُدَاسِيٌّ.\",\n                    \"لِأَنَّهُ مَصْدَرٌ خُمَاسِيٌّ (مِنْ اسْتَمَعَ).\",\n                    \"لِأَنَّهُ مَصْدَرٌ رُبَاعِيٌّ.\",\n                    \"لِأَنَّهُ فِعْلٌ أَمْرٌ.\"\n                ],\n                correct: 1, // ب\n                explain: \"الفعل الماضي من «اسْتِمَاع» هو «اسْتَمَعَ» وهو فعل خماسي (5 حروف)، ومصدر الخماسي وصل.\"\n            },\n            {\n                q: \"أَيٌّ مِنَ الأَفْعَالِ المُضَارِعَةِ الآتِيَةِ تَبْدَأُ بِهَمْزَةِ قَطْعٍ؟\",\n                options: [\n                    \"انْطَلَقَ\",\n                    \"اسْتَغْفَرَ\",\n                    \"أَسْتَغْفِرُ (المُضَارِعُ لِلْمُتَكَلِّمِ)\",\n                    \"اقْتَرَبَ\"\n                ],\n                correct: 2, // ج\n                explain: \"جميع الأفعال المضارعة المسندة لضمير المتكلف «أَنَا» تبدأ بهمزة قطع دائمًا سواء كانت ثلاثية أو أكثر.\"\n            },\n            {\n                q: \"تُثْبَتُ همزة «ابْن» وَلا تُحْذَفُ فِي قَوْلِنَا:\",\n                options: [\n                    \"عَلِيٌّ بْنُ أَبِي طَالِبٍ.\",\n                    \"مُحَمَّدٌ بْنُ عَبْدِ اللَّهِ.\",\n                    \"أَحْمَدُ بْنُ حَنْبَلٍ.\",\n                    \"عِيسَى ابْنُ مَرْيَمَ.\"\n                ],\n                correct: 3, // د\n                explain: \"تُثبت همزة «ابن» في «عِيسَى ابْنُ مَرْيَمَ» لأن مريم أم وليست أباً، فشرط الحذف أن يكون العلم الث
