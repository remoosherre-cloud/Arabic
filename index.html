                   correct: 1,\n                    exp: \"المُثَنّى يُنْصَبُ وتكونُ علامَةُ نَصْبِهِ الْياءَ (الطالِبَيْنِ).\"\n                },\n                {\n                    q: \"يَشْرَحُ المُعَلِّمونَ الدَّرْسَ بِبَراعَةٍ. المَعْلُومَةُ الصَّحيحَةُ عَنْ (المُعَلِّمونَ):\",\n                    opts: [\"فاعل مرفوع وعلامة رفعه الواو لأنه جمع مذكر سالم\", \"مفعول به منصوب بالفتحة\", \"فاعل مرفوع بالضمة المقدرة\", \"مبتدأ مرفوع بالواو\"],\n                    correct: 0,\n                    exp: \"جمعُ المذكرِ السالِمُ يُرْفَعُ وعلامةُ رفْعِهِ الواو (المُعَلِّمونَ).\"\n                },\n                {\n                    q: \"احْتَرَمْتُ أباكَ لِأَخْلاقِهِ. المَفْعولُ بِهِ في الجُمْلَةِ هو (أباكَ) وعَلامَةُ نَصْبِهِ:\",\n                    opts: [\"الفتحة الظاهرة\", \"الألف لأنه من الأسماء الخمسة\", \"الياء\", \"الكسرة\"],\n                    correct: 1,\n                    exp: \"الأسماءُ الخمسةُ تُنْصَبُ وعلامةُ نصْبِها الألِفُ (أباكَ).\"\n                },\n                {\n                    q: \"شَرِبَتِ الطِّفْلَةُ الحَليبَ. الفاعِلُ في الجُمْلَةِ هو:\",\n                    opts: [\"الحَليبَ\", \"الْمُسْتَتِر\", \"الطِّفْلَةُ\", \"تَاءُ التَّأْنيثِ\"],\n                    correct: 2,\n                    exp: \"الطِّفلَةُ هي الفاعِلُ. وتَاءُ التأنيثِ حَرْفٌ لا مَحَلَّ لَهُ مِنَ الإِعْرابِ.\"\n                },\n                {\n                    q: \"شَجَّعَ المُدَرِّسُ الطَّالِباتِ. علامَةُ نَصْبِ المَفْعولِ بِهِ (الطَّالِباتِ) هي:\",\n                    opts: [\"الفتحة\", \"الكسرة نيابة عن الفتحة لأنه جمع مؤنث سالم\", \"الياء\", \"الضمة\"],\n                    correct: 1,\n                    exp: \"جَمْعُ المُمؤَنَّثِ السَّالِمُ يُنْصَبُ بالكَسْرَةِ نِيابَةً عَنِ الفَتْحَةِ (الطَّالِباتِ).\"\n                },\n                {\n                    q: \"قالَ تَعالى: (وَوَرِثَ سُلَيْمَانُ دَاوُودَ). المَفْعولُ بِهِ في الآيَةِ الكَريمَةِ هو:\",\n                    opts: [\"سُلَيْمَانُ\", \"دَاوُودَ\", \"ضمير مستتر\", \"لا يوجد مفعول به\"],\n                    correct: 1,\n                    exp: \"دَاوُودَ هو المَفْعولُ بِهِ المنصوب بالفتحة، وسُلَيْمانُ هو الفاعِلُ المَرْفوعُ.\"\n                },\n                {\n                    q: \"كَتَبْتُ الرِّسالَةَ بِإِتْقانٍ. الفاعِلُ في الجُمْلَةِ هو:\",\n                    opts: [\"الرِّسالَةَ\", \"تاء الفاعل المتحركة (ـتُ)\", \"ضمير مستتر تقديره هو\", \"إتقان\"],\n                    correct: 1,\n                    exp: \"التاء المتحركة (كَتَبْتُ) هي ضمير متصل مبني في محل رفع فاعل.\"\n                },\n                {\n                    q: \"يَبْني العُمَّالُ المَسانِعَ. الضَّبْطُ النَّحْوِيُّ الصَّحيحُ لِكَلِمَةِ (المصانع) هو:\",\n                    opts: [\"المَصانِعُ\", \"المَصانِعَ\", \"المَصانِعِ\", \"المَصانِعْ\"],\n                    correct: 1,\n                    exp: \"تُضْبَطُ بِالفَتْحَةِ (المَصانِعَ) لأنها مَفْعولٌ بِهِ مَنْصوبٌ.\"\n                },\n                {\n                    q: \"سَقَى الفَلاَّحُ زَرْعَهُ. علامَةُ رَفْعِ الفاعِلِ (الفَلاَّحُ) هي:\",\n                    opts: [\"الضمة الظاهرة على آخره\", \"الواو\", \"الألف\", \"الفتحة\"],\n                    correct: 0,\n                    exp: \"الفَلاَّحُ اسم مفرد فُيُرْفَعُ بالضَّمَّةِ الظَّاهِرَةِ.\"\n                },\n                {\n                    q: \"يُحِبُّ اللهُ الصَّابِرِينَ. كلمة (الصَّابِرِينَ) تُعْرَبُ:\",\n                    opts: [\"فاعل مرفوع بالواو\", \"مفعول به منصوب وعلامة نصبه الياء لأنه جمع مذكر سالم\", \"حال منصوب بالفتحة\", \"صفة مرفوعة\"],\n                    correct: 1,\n                    exp: \"الصَّابِرِينَ مَفْعولٌ بِهِ مَنْصوبٌ بالياءِ لأنه جَمْعُ مَذَكَّرٍ سالِمٌ.\"\n                },\n                {\n                    q: \"أَكْرَمَ الجارُ ضَيْفَهُ. المَفْعولُ بِهِ هو:\",\n                    opts: [\"الجارُ\", \"ضَيْفَ (والهاء مضاف إليه)\", \"أكرم\", \"ضمير مستتر\"],\n                    correct: 1,\n                    exp: \"كلمة (ضَيْفَ) مَفْعولٌ بِهِ مَنْصوبٌ، وَالهاءُ ضَميرٌ مُتَّصِلٌ في مَحَلِّ جَرٍّ مَضافٌ إلَيْهِ.\"\n                },\n                {\n                    q: \"نَصَحَ الطَّبيبُ المَريضَيْنِ. الفاعِلُ في هذه الجُمْلَةِ هو:\",\n                    opts: [\"المَريضَيْنِ\", \"الطَّبيبُ\", \"ضمير مستتر\", \"نصح\"],\n                    correct: 1,\n                    exp: \"الطَّبيبُ هو مَنْ قامَ بالنَّصيحَةِ لِذا فهو الفاعِلُ المَرْفوعُ.\"\n                },\n                {\n                    q: \"رَأَيْتُ العُصْفورَ فَوْقَ الشَّجَرَةِ. موقع كلمة (العُصْفورَ) في الإِعْرابِ:\",\n                    opts: [\"فاعل مرفوع\", \"مفعول به منصوب\", \"ظرف مكان\", \"مبتدأ مؤخر\"],\n                    correct: 1,\n                    exp: \"وقعَ عليهِ الفِعْلُ (الرُّؤْيَةُ)، لِذا يُعْرَبُ مَفْعولاً بِهِ مَنْصوباً.\"\n                }\n            ],\n            team2: [\n                {\n                    q: \"قالَ تَعالى: (وَقالَ رَجُلانِ مِنَ الَّذينَ يَخافُونَ). علامَةُ رَفْعِ الفاعِلِ (رَجُلانِ):\",\n                    opts: [\"الضمة الظاهرة\", \"الألِفُ لأنه مثنى\", \"الواو\", \"ثبوت النون\"],\n                    correct: 1,\n                    exp: \"المُثَنَّى يُرْفَعُ وَتَكونُ علامَةُ رَفْعِهِ الأَلِفَ (رَجُلانِ).\"\n                },\n                {\n                    q: \"نَظَّفَ الأَوْلادُ المَلْعَبَ. كلمة (الأَوْلادُ) تُعْرَبُ:\",\n                    opts: [\"مفعول به منصوب بالفتحة\", \"فاعلاً مَرْفوعاً وعَلامَةُ رَفْعِهِ الضَّمَّةُ (جمع تكسير)\", \"مبتدأ مرفوع\", \"خبر مرفوع\"],\n                    correct: 1,\n                    exp: \"الأَوْلادُ جمعُ تكسيرٍ يُرْفَعُ بالضَّمَّةِ الظَّاهِرَةِ على آخِرِهِ.\"\n                },\n                {\n                    q: \"يُقَدِّرُ المُنْصِفُونَ المُبْدِعينَ. الفاعِلُ في الجُمْلَةِ هو:\",\n                    opts: [\"المُبْدِعينَ\", \"المُنْصِفُونَ\", \"ضمير مستتر\", \"يقدر\"],\n                    correct: 1,\n                    exp: \"المُنْصِفُونَ هم مَنْ يُقَدِّرونَ، فَهُمْ الفاعِلُ المَرْفوعُ بالواو.\"\n                },\n                {\n                    q: \"ساعَدَتْ هِنْدُ أُمَّها. الحركة الإعرابية الصحيحة على كلمة (أمَّ) هي:\",\n                    opts: [\"الفتحة (أُمَّ) لأنها مفعول به\", \"الضمة (أُمُّ)\", \"الكسرة (أُمِّ)\", \"السكون\"],\n                    correct: 0,\n                    exp: \"تُضْبَطُ بالفَتْحَةِ (أُمَّ) لأنها مَفْعولٌ بِهِ مَنْصوبٌ.\"\n                },\n                {\n                    q: \"زارَ أخوكَ المَتْحَفَ. كلمة (أخوكَ) فاعِلٌ مَرْفوعٌ وَعَلامَةُ رَفْعِهِ:\",\n                    opts: [\"الضمة الظاهرة\", \"الواو لأنه من الأسماء الخمسة\", \"الألف\", \"الضمة المقدرة\"],\n                    correct: 1,\n                    exp: \"تُرْفَعُ الأَسْماءُ الخَمْسَةُ بالواوِ (أَخوكَ).\"\n                },\n                {\n                    q: \"حَقَّقَ الأَبْطالُ النَّصْرَ. المَفْعولُ بِهِ هو:\",\n                    opts: [\"الأَبْطالُ\", \"النَّصْرَ\", \"حقّق\", \"ضمير مستتر\"],\n                    correct: 1,\n                    exp: \"النَّصْرَ هو الاسم الذي وقعَ عليه فِعْلُ التَّحْقيقِ.\"\n                },\n                {\n                    q: \"نَالَتِ المُجْتَهِداتُ الجَوائِزَ. الفاعِلُ في الجُمْلَةِ هو (المُجْتَهِداتُ) وَعَلامَةُ رَفْعِهِ:\",\n                    opts: [\"الضمة الظاهرة (جمع مؤنث سالم)\", \"الألف\", \"الكسرة\", \"الواو\"],\n                    correct: 0,\n                    exp: \"جَمْعُ المُمؤَنَّثِ السَّالِمُ يُرْفَعُ بالضَّمَّةِ الظَّاهِرَةِ.\"\n                },\n                {\n                    q: \"اصْطادَ الصَّيَّادُ سَمَكَتَيْنِ. المَفْعولُ بِهِ (سَمَكَتَيْنِ) مَنْصوبٌ وعلامَةُ نَصْبِهِ:\",\n                    opts: [\"الكسرة\", \"الياء لأنه مثنى\", \"الفتحة\", \"الألف\"],\n                    correct: 1,\n                    exp: \"سَمَكَتَيْنِ مثنّى منصوب وعلامةُ نصْبِهِ الياء.\"\n                },\n                {\n                    q: \"سَمِعْتُ الأَذانَ. الفاعِلُ في الجُمْلَةِ هو:\",\n                    opts: [\"الأَذانَ\", \"التاء المتحركة في (سَمِعْتُ)\", \"ضمير مستتر تقديره هو\", \"سمع\"],\n                    correct: 1,\n                    exp: \"التاء (تُ) ضمير متصل مبني في محل رفع فاعل.\"\n                },\n                {\n                    q: \"يَهْدِي اللهُ العِبادَ إلى الخَيْرِ. لَفْظُ الجَلالَةِ (اللهُ) يُعْرَبُ:\",\n                    opts: [\"مفعول به\", \"فاعلاً مَرْفوعاً وعَلامَةُ رَفْعِهِ الضَّمَّةُ\", \"مبتدأ\", \"اسم مجرور\"],\n                    correct: 1,\n                    exp: \"لفظُ الجلالةِ فاعِلٌ مرفوعٌ وعلامةُ رفعِهِ الضَّمَّةُ الظَّاهِرَةُ.\"\n                },\n                {\n                    q: \"رَسَمَ الفَنَّانُ اللَّوْحَةَ. المَفْعولُ بِهِ هو (اللَّوْحَةَ) وَحَرَكَتُهُ الإِعْرابِيَّةُ:\",\n                    opts: [\"الضمة\", \"الفتحة الظاهرة\", \"الكسرة\", \"السكون\"],\n                    correct: 1,\n                    exp: \"المَفْعولُ بِهِ المُفْرَدُ يُنْصَبُ بالْفَتْحَةِ الظَّاهِرَةِ.\"\n                },\n                {\n                    q: \"كَرَّمَتِ المَدْرَسَةُ ذَوِي الأَخْلاقِ. علامَةُ نَصْبِ المَفْعولِ بِهِ (ذَوِي):\",\n                    opts: [\"الفتحة\", \"الياء (ملحق بجمع المذكر السالم)\", \"الألف\", \"الكسرة\"],\n                    correct: 1,\n                    exp: \"كلمة (ذَوِي) مفعول به منصوب وعلامة نصبه الياء.\"\n                },\n                {\n                    q: \"يَحْتَرِمُ النَّاسُ المُلْتَزِمينَ. علامَةُ نَصْبِ (المُلْتَزِمينَ) هي:\",\n                    opts: [\"الفتحة\", \"الياء لأنه جمع مذكر سالم\", \"الكسرة\", \"الواو\"],\n                    correct: 1,\n                    exp: \"جمع المذكر السالم يُنْصَبُ وعلامة نصبه الياء.\"\n                },\n                {\n                    q: \"أَكَلَ الوَلَدُ التُّفَّاحَةَ. الضَّبْطُ الصَّحيحُ لِلفاعِلِ (الولد) هو:\",\n                    opts: [\"الَوَلَدُ\", \"الوَلَدَ\", \"الوَلَدِ\", \"الوَلَدْ\"],\n                    correct: 0,\n                    exp: \"الفاعِلُ يُرْفَعُ بالضَّمَّةِ الظَّاهِرَةِ (الوَلَدُ).\"\n                },\n                {\n                    q: \"فَازَ بالسِّباقِ الماهِرُ. الفاعِلُ في الجُمْلَةِ هو:\",\n                    opts: [\"السباق\", \"الماهِرُ (فاعل مؤخر)\", \"ضمير مستتر\", \"فاز\"],\n                    correct: 1,\n                    exp: \"الماهِرُ هو مَنْ قامَ بالفِعْلِ (الفَوْز)، وتَقَدَّمَ الجارُّ والمَجْرورُ عليهِ.\"\n                }\n            ]\n        };\n\n        // Game State Variables\n        let currentTurn = 1; // 1 = فريق التميز, 2 = فريق التفوق\n        let team1Score = 0;\n        let team2Score = 0;\n        let team1Index = 0;\n        let team2Index = 0;\n\n        let isSpinning = false;\n        let startAngle = 0;\n        let selectedSlice = null;\n\n        // Timer\n        let totalTimeSeconds = 40 * 60; // 40 Minutes\n        let timerInterval = null;\n\n        // Canvas\n        let canvas = null;\n        let ctx = null;\n\n        function launchGame() {\n            document.getElementById(\"startScreen\").classList.add(\"hidden\");\n            initAudio();\n            startTimer();\n        }\n\n        window.onload = function() {\n            canvas = document.getElementById(\"wheelCanvas\");\n            ctx = canvas.getContext(\"2d\");\n            drawWheel();\n            updateUI();\n        };\n\n        // Draw Canvas Wheel\n        function drawWheel() {\n            const numSlices = wheelSlices.length;\n            const arcSize = (2 * Math.PI) / numSlices;\n            const centerX = canvas.width / 2;\n            const centerY = canvas.height / 2;\n            const radius = centerX - 10;\n\n            ctx.clearRect(0, 0, canvas.width, canvas.height);\n\n            for (let i = 0; i \u003c numSlices; i++) {\n                const angle = startAngle + i * arcSize;\n                \n                // Draw Sector\n                ctx.beginPath();\n                ctx.arc(centerX, centerY, radius, angle, angle + arcSize, false);\n                ctx.lineTo(centerX, centerY);\n                ctx.fillStyle = wheelSlices[i].color;\n                ctx.fill();\n                ctx.strokeStyle = \"#0f172a\";\n                ctx.lineWidth = 4;\n                ctx.stroke();\n\n                // Draw Text Label\n                ctx.save();\n                ctx.translate(centerX, centerY);\n                ctx.rotate(angle + arcSize / 2);\n                ctx.textAlign = \"right\";\n                ctx.fillStyle = \"#ffffff\";\n                ctx.font = \"bold 16px Cairo\";\n                ctx.fillText(wheelSlices[i].label, radius - 25, 6);\n                ctx.restore();\n            }\n\n            // Draw Center Hub\n            ctx.beginPath();\n            ctx.arc(centerX, centerY, 30, 0, 2 * Math.PI);\n            ctx.fillStyle = \"#0f172a\";\n            ctx.fill();\n            ctx.strokeStyle = \"#f59e0b\";\n            ctx.lineWidth = 4;\n            ctx.stroke();\n\n            // Hub Text\n            ctx.fillStyle = \"#f59e0b\";\n            ctx.font = \"bold 14px Cairo\";\n            ctx.textAlign = \"center\";\n            ctx.textBaseline = \"middle\";\n            ctx.fillText(\"نحو\", centerX, centerY);\n        }\n\n        // Spin Functionality\n        function spinWheel() {\n            if (isSpinning) return;\n\n            if (team1Index >= 15 && team2Index >= 15) {\n                endGame();\n                return;\n            }\n\n            if (currentTurn === 1 && team1Index >= 15) {\n                currentTurn = 2;\n                updateUI();\n            } else if (currentTurn === 2 && team2Index >= 15) {\n                currentTurn = 1;\n                updateUI();\n            }\n\n            isSpinning = true;\n            document.getElementById(\"spinBtn\").disabled = true;\n\n            const spinRounds = 5 + Math.random() * 5;\n            const totalRotation = spinRounds * 2 * Math.PI + Math.random() * 2 * Math.PI;\n            const duration = 4000;\n            const startTime = performance.now();\n            const initialAngle = startAngle;\n\n            function animateSpin(now) {\n                const elapsed = now - startTime;\n                const progress = Math.min(elapsed / duration, 1);\n                const easeOut = 1 - Math.pow(1 - progress, 3);\n                \n                startAngle = initialAngle + totalRotation * easeOut;\n                drawWheel();\n\n                if (Math.random() \u003c 0.25) playSpinTick();\n\n                if (progress \u003c 1) {\n                    requestAnimationFrame(animateSpin);\n                } else {\n                    isSpinning = false;\n                    document.getElementById(\"spinBtn\").disabled = false;\n                    calculateSliceResult();\n                }\n            }\n\n            requestAnimationFrame(animateSpin);\n        }\n\n        function calculateSliceResult() {\n            const numSlices = wheelSlices.length;\n            const arcSize = (2 * Math.PI) / numSlices;\n            let normalizedAngle = (startAngle % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI);\n            let pointerAngle = (3 * Math.PI / 2 - normalizedAngle + 2 * Math.PI) % (2 * Math.PI);\n            let sliceIndex = Math.floor(pointerAngle / arcSize) % numSlices;\n\n            selectedSlice = wheelSlices[sliceIndex];\n            openQuestionModal();\n        }\n\n        // Timer\n        function startTimer() {\n            clearInterval(timerInterval);\n            timerInterval = setInterval(() => {\n                if (totalTimeSeconds > 0) {\n                    totalTimeSeconds--;\n                    const mins = Math.floor(totalTimeSeconds / 60).toString().padStart(2, '0');\n                    const secs = (totalTimeSeconds % 60).toString().padStart(2, '0');\n                    document.getElementById(\"timerText\").innerText = `${mins}:${secs}`;\n                } else {\n                    clearInterval(timerInterval);\n                    endGame();\n                }\n            }, 1000);\n        }\n\n        // UI Updates\n        function updateUI() {\n            document.getElementById(\"team1Score\").innerText = team1Score;\n            document.getElementById(\"team2Score\").innerText = team2Score;\n\n            document.getElementById(\"team1AnsweredCount\").innerText = `${team1Index} / 15`;\n            document.getElementById(\"team2AnsweredCount\").innerText = `${team2Index} / 15`;\n\n            document.getElementById(\"team1Bar\").style.width = `${(team1Index / 15) * 100}%`;\n            document.getElementById(\"team2Bar\").style.width = `${(team2Index / 15) * 100}%`;\n\n            const banner = document.getElementById(\"turnBanner\");\n            const bannerText = document.getElementById(\"turnBannerText\");\n            const card1 = document.getElementById(\"team1Card\");\n            const card2 = document.getElementById(\"team2Card\");\n\n            if (currentTurn === 1) {\n                banner.className = \"mb-4 px-6 py-2.5 rounded-full bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-black text-base md:text-lg shadow-lg flex items-center gap-2 glow-blue\";\n                bannerText.innerText = \"دور: فريق التميز (أَدِرِ العَجَلَة)\";\n                card1.classList.add(\"border-blue-500\", \"scale-102\", \"glow-blue\");\n                card2.classList.remove(\"border-emerald-500\", \"scale-102\", \"glow-emerald\");\n            } else {\n                banner.className = \"mb-4 px-6 py-2.5 rounded-full bg-gradient-to-r from-emerald-600 to-teal-600 text-white font-black text-base md:text-lg shadow-lg flex items-center gap-2 glow-emerald\";\n                bannerText.innerText = \"دور: فريق التفوق (أَدِرِ العَجَلَة)\";\n                card2.classList.add(\"border-emerald-500\", \"scale-102\", \"glow-emerald\");\n                card1.classList.remove(\"border-blue-500\", \"scale-102\", \"glow-blue\");\n            }\n        }\n\n        // Question Modal\n        function openQuestionModal() {\n            const isTeam1 = (currentTurn === 1);\n            const qList = isTeam1 ? questionsBank.team1 : questionsBank.team2;\n            const qIndex = isTeam1 ? team1Index : team2Index;\n\n            if (qIndex >= 15) {\n                alert(\"أتم هذا الفريق جميع الأسئلة المخصصة له!\");\n                currentTurn = isTeam1 ? 2 : 1;\n                updateUI();\n                return;\n            }\n\n            const questionObj = qList[qIndex];\n\n            const qTeamBadge = document.getElementById(\"qTeamBadge\");\n            if (isTeam1) {\n                qTeamBadge.className = \"px-3 py-1 rounded-full text-xs font-black bg-blue-500/20 text-blue-300 border border-blue-500/40\";\n                qTeamBadge.innerText = \"فريق التميز\";\n            } else {\n                qTeamBadge.className = \"px-3 py-1 rounded-full text-xs font-black bg-emerald-500/20 text-emerald-300 border border-emerald-500/40\";\n                qTeamBadge.innerText = \"فريق التفوق\";\n            }\n\n            document.getElementById(\"qPointsBadge\").innerText = `${selectedSlice.label} (${selectedSlice.value} نقطة)`;\n            document.getElementById(\"qNumBadge\").innerText = `سؤال ${qIndex + 1} من 15`;\n            document.getElementById(\"questionText\").innerText = questionObj.q;\n\n            const grid = document.getElementById(\"optionsGrid\");\n            grid.innerHTML = \"\";\n\n            questionObj.opts.forEach((optText, idx) => {\n                const btn = document.createElement(\"button\");\n                btn.className = \"text-right p-4 rounded-xl bg-slate-800/90 hover:bg-slate-700 border border-slate-700 font-bold text-sm text-slate-100 transition duration-150 flex items-center justify-between group\";\n                btn.onclick = () => checkAnswer(idx, questionObj);\n                btn.innerHTML = `\n                    \u003cspan>${optText}\u003c/span>\n                    \u003ci class=\"fa-regular fa-circle text-slate-500 group-hover:text-amber-400\">\u003c/i>\n                `;\n                grid.appendChild(btn);\n            });\n\n            document.getElementById(\"feedbackPanel\").classList.add(\"hidden\");\n            document.getElementById(\"questionModal\").classList.remove(\"hidden\");\n        }\n\n        function checkAnswer(selectedIdx, questionObj) {\n            const isCorrect = (selectedIdx === questionObj.correct);\n            const grid = document.getElementById(\"optionsGrid\");\n            const buttons = grid.querySelectorAll(\"button\");\n\n            buttons.forEach((btn, idx) => {\n                btn.disabled = true;\n                if (idx === questionObj.correct) {\n                    btn.className = \"text-right p-4 rounded-xl bg-emerald-950/90 border-2 border-emerald-500 font-bold text-sm text-emerald-200 flex items-center justify-between\";\n                    btn.querySelector(\"i\").className = \"fa-solid fa-circle-check text-emerald-400 text-lg\";\n                } else if (idx === selectedIdx && !isCorrect) {\n                    btn.className = \"text-right p-4 rounded-xl bg-rose-950/90 border-2 border-rose-500 font-bold text-sm text-rose-200 flex items-center justify-between\";\n                    btn.querySelector(\"i\").className = \"fa-solid fa-circle-xmark text-rose-400 text-lg\";\n                }\n            });\n\n            if (isCorrect) {\n                playCorrectSound();\n                if (currentTurn === 1) team1Score += selectedSlice.value;\n                else team2Score += selectedSlice.value;\n            } else {\n                playWrongSound();\n            }\n\n            if (currentTurn === 1) team1Index++;\n            else team2Index++;\n\n            showFeedback(isCorrect, questionObj.exp);\n        }\n\n        function showFeedback(isCorrect, explanation) {\n            const panel = document.getElementById(\"feedbackPanel\");\n            const title = document.getElementById(\"feedbackTitle\");\n            const exp = document.getElementById(\"feedbackExplanation\");\n\n            panel.classList.remove(\"hidden\");\n\n            if (isCorrect) {\n                panel.className = \"p-4 rounded-2xl space-y-2 border bg-emerald-950/70 border-emerald-500/50 text-emerald-200\";\n                title.innerHTML = `\u003ci class=\"fa-solid fa-circle-check text-emerald-400 text-lg\">\u003c/i> إجابة صحيحة! أحسنتم.`;\n            } else {\n                panel.className = \"p-4 rounded-2xl space-y-2 border bg-rose-950/70 border-rose-500/50 text-rose-200\";\n                title.innerHTML = `\u003ci class=\"fa-solid fa-circle-xmark text-rose-400 text-lg\">\u003c/i> إجابة خاطئة! التوضيح النحوي:`;\n            }\n\n            exp.innerText = explanation;\n        }\n\n        function closeQuestionModal() {\n            document.getElementById(\"questionModal\").classList.add(\"hidden\");\n            currentTurn = (currentTurn === 1) ? 2 : 1;\n            updateUI();\n\n            if (team1Index >= 15 && team2Index >= 15) {\n                endGame();\n            }\n        }\n\n        // End Game Logic\n        function endGame() {\n            clearInterval(timerInterval);\n            document.getElementById(\"victoryModal\").classList.remove(\"hidden\");\n\n            document.getElementById(\"vScore1\").innerText = `${team1Score}`;\n            document.getElementById(\"vScore2\").innerText = `${team2Score}`;\n\n            const winnerTitle = document.getElementById(\"winnerTitle\");\n            const winnerSub = document.getElementById(\"winnerSubtitle\");\n\n            if (team1Score > team2Score) {\n                winnerTitle.innerText = \"فريق التميز هو الفائز! 🏆\";\n                winnerSub.innerText = \"مبارك لفريق التميز على هذا الأداء النحوي الرفيع!\";\n            } else if (team2Score > team1Score) {\n                winnerTitle.innerText = \"فريق التفوق هو الفائز! 🏆\";\n                winnerSub.innerText = \"مبارك لفريق التفوق على هذا التفوق والتألق الإعرابي!\";\n            } else {\n                winnerTitle.innerText = \"تعادل أخوي رائع! 🤝\";\n                winnerSub.innerText = \"أبدع الفريقان في الإجابة عن كافة أسئلة درس الفاعل والمفعول به.\";\n            }\n\n            if (typeof confetti === 'function') {\n                confetti({ particleCount: 180, spread: 100, origin: { y: 0.6 } });\n            }\n        }\n    \u003c/script>\n\u003c/body>\n\u003c/html>"},{"id":"disq3ht","grade":0,"title":"عجلة الحظ النحوية - الأسماء الخمسة","desc":"","url":"","html":"\u003c!DOCTYPE html>\n\u003chtml lang=\"ar\" dir=\"rtl\">\n\u003chead>\n    \u003cmeta charset=\"UTF-8\">\n    \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    \u003ctitle>عجلة الحظ النحوية - الأسماء الخمسة - الأستاذ أحمد عثمان\u003c/title>\n    \u003c!-- Tailwind CSS CDN -->\n    \u003cscript src=\"https://cdn.tailwindcss.com\">\u003c/script>\n    \u003c!-- Font Awesome Icons -->\n    \u003clink rel=\"stylesheet\" href=\"https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css\">\n    \u003c!-- Google Fonts Cairo -->\n    \u003clink href=\"https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap\" rel=\"stylesheet\">\n    \u003c!-- Canvas Confetti -->\n    \u003cscript src=\"https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js\">\u003c/script>\n\n    \u003cscript>\n        tailwind.config = {\n            theme: {\n                extend: {\n                    colors: {\n                        gold: '#fbbf24',\n                        maroon: '#881337',\n                    },\n                    fontFamily: {\n                        cairo: ['Cairo', 'sans-serif']\n                    }\n                }\n            }\n        }\n    \u003c/script>\n\n    \u003cstyle>\n        body {\n            font-family: 'Cairo', sans-serif;\n            background: radial-gradient(circle at top center, #1e1b4b 0%, #030712 100%);\n            min-height: 100vh;\n            color: #f8fafc;\n            overflow-x: hidden;\n        }\n\n        .glass-card {\n            background: rgba(15, 23, 42, 0.95);\n            backdrop-filter: blur(20px);\n            border: 1px solid rgba(251, 191, 36, 0.35);\n            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.85);\n        }\n\n        .glow-gold {\n            box-shadow: 0 0 50px rgba(251, 191, 36, 0.45);\n        }\n        .glow-blue {\n            box-shadow: 0 0 40px rgba(37, 99, 235, 0.4);\n        }\n        .glow-green {\n            box-shadow: 0 0 40px rgba(5, 150, 105, 0.4);\n        }\n\n        .launcher-btn {\n            animation: launcherPulse 1.4s infinite alternate ease-in-out;\n        }\n\n        @keyframes launcherPulse {\n            0% {\n                box-shadow: 0 0 30px rgba(245, 158, 11, 0.8), 0 0 60px rgba(245, 158, 11, 0.4);\n                transform: scale(1);\n            }\n            100% {\n                box-shadow: 0 0 70px rgba(245, 158, 11, 1), 0 0 110px rgba(245, 158, 11, 0.8);\n                transform: scale(1.04);\n            }\n        }\n\n        .opening-box-glow {\n            animation: boxGlowRing 2s infinite ease-in-out;\n        }\n\n        @keyframes boxGlowRing {\n            0%, 100% { border-color: rgba(251, 191, 36, 0.8); box-shadow: 0 0 30px rgba(251, 191, 36, 0.3); }\n            50% { border-color: rgba(234, 179, 8, 1); box-shadow: 0 0 60px rgba(251, 191, 36, 0.7); }\n        }\n\n        @keyframes bouncePointer {\n            0%, 100% { transform: translateX(-50%) translateY(0); }\n            50% { transform: translateX(-50%) translateY(10px); }\n        }\n        .pointer-anim {\n            animation: bouncePointer 1s infinite ease-in-out;\n        }\n\n        #wheelCanvas {\n            filter: drop-shadow(0 15px 30px rgba(0, 0, 0, 0.85));\n            transition: transform 5s cubic-bezier(0.12, 0.98, 0.21, 1);\n        }\n\n        .modal-bg {\n            background: rgba(2, 6, 23, 0.97);\n            backdrop-filter: blur(16px);\n        }\n    \u003c/style>\n\u003c/head>\n\u003cbody class=\"flex flex-col min-h-screen justify-between p-3 md:p-6\">\n\n    \u003c!-- ================= 1. START / LAUNCH OVERLAY (محل الفتح الصريح وكلمة فتح) ================= -->\n    \u003cdiv id=\"startScreen\" class=\"fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/98 backdrop-blur-md\">\n        \u003cdiv class=\"opening-box-glow glass-card max-w-3xl w-full rounded-3xl p-6 md:p-10 text-center space-y-7 border-4 border-amber-500 relative overflow-hidden bg-gradient-to-b from-indigo-950/80 via-slate-900 to-slate-950\">\n            \n            \u003cdiv class=\"inline-flex items-center gap-2 bg-gradient-to-r from-indigo-600/30 via-amber-500/20 to-indigo-600/30 text-amber-300 border border-amber-500/50 px-6 py-2 rounded-full text-xs md:text-sm font-black\">\n                \u003ci class=\"fa-solid fa-fire text-red-500 text-lg animate-pulse\">\u003c/i>\n                \u003cspan>المُسَابَقَةُ النَّحْوِيَّةُ الكُبْرَى — المَسْتَوَى التَّنافُسِيُّ الأَصْعَبُ 🔥\u003c/span>\n            \u003c/div>\n\n            \u003cdiv class=\"space-y-3\">\n                \u003ch1 class=\"text-3xl md:text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-amber-200 via-yellow-400 to-amber-500 leading-tight\">\n                    عَجَلَةُ الحَظِّ النَّحْوِيَّةِ\n                \u003c/h1>\n                \u003cp class=\"text-2xl md:text-3xl font-extrabold text-amber-300\">\n                    تَحَدِّي دَرْسِ (الأَسْمَاءِ الخَمْسَةِ)\n                \u003c/p>\n                \u003cdiv class=\"inline-block bg-slate-900/90 px-8 py-3 rounded-2xl border border-amber-500/40 mt-2 shadow-inner\">\n                    \u003cp class=\"text-base md:text-xl text-amber-400 font-bold\">\n                        \u003ci class=\"fa-solid fa-user-tie ml-2 text-amber-300\">\u003c/i>إِعْدادُ الأُسْتاذِ: \u003cspan class=\"text-white font-black text-2xl\">أَحْمَد عُثْمان\u003c/span>\n                    \u003c/p>\n                \u003c/div>\n            \u003c/div>\n\n            \u003c!-- PROMINENT OPENING CARD AND BUTTON SHOWING \"كلمة فتح\" DEFINITIVELY -->\n            \u003cdiv class=\"bg-slate-900/95 p-6 rounded-3xl border-2 border-amber-400/60 shadow-2xl space-y-4\">\n                \u003cdiv class=\"text-amber-300 text-sm font-extrabold flex items-center justify-center gap-2\">\n                    \u003ci class=\"fa-solid fa-key text-xl text-amber-400\">\u003c/i>\n                    \u003cspan>مَحَلُّ الانْطِلاقِ المُبَاشِرِ لِلْمُسَابَقَةِ\u003c/span>\n                \u003c/div>\n\n                \u003cbutton onclick=\"launchGame()\" class=\"launcher-btn w-full py-6 bg-gradient-to-r from-amber-500 via-yellow-400 to-amber-500 hover:brightness-110 text-slate-950 font-black text-xl md:text-3xl rounded-2xl shadow-2xl transition-all duration-200 flex items-center justify-center gap-3 border-4 border-yellow-100 cursor-pointer\">\n                    \u003ci class=\"fa-solid fa-lock-open text-3xl\">\u003c/i>\n                    \u003cspan>🔓 اضْغَطْ هُنَا لِـ \u003cspan class=\"text-rose-950 underline decoration-wavy\">فَتْحِ\u003c/span> اللَّعْبَةِ وَابْدَأِ التَّحَدِّيَ\u003c/span>\n                \u003c/button>\n            \u003c/div>\n\n            \u003cdiv class=\"grid grid-cols-2 md:grid-cols-4 gap-3 text-right bg-slate-900/90 p-4 rounded-2xl border border-slate-800 text-xs md:text-sm font-bold\">\n                \u003cdiv class=\"p-2 border-l border-slate-800\">\n                    \u003cspan class=\"block text-slate-400 text-[11px]\">الفَرِيقُ الأَوَّلُ\u003c/span>\n                    \u003cspan class=\"text-blue-400 text-base font-extrabold\">\u003ci class=\"fa-solid fa-crown ml-1\">\u003c/i>فَرِيقُ التَّمَيُّزِ\u003c/span>\n                \u003c/div>\n                \u003cdiv class=\"p-2 md:border-l border-slate-800\">\n                    \u003cspan class=\"block text-slate-400 text-[11px]\">الفَرِيقُ الثَّانِي\u003c/span>\n                    \u003cspan class=\"text-emerald-400 text-base font-extrabold\">\u003ci class=\"fa-solid fa-star ml-1\">\u003c/i>فَرِيقُ التَّفَوُّقِ\u003c/span>\n                \u003c/div>\n                \u003cdiv class=\"p-2 border-l border-slate-800\">\n                    \u003cspan class=\"block text-slate-400 text-[11px]\">عَدَدُ الأَسْئِلَةِ\u003c/span>\n                    \u003cspan class=\"text-amber-300 text-base font-extrabold\">\u003ci class=\"fa-solid fa-list-check ml-1\">\u003c/i>30 سُؤَالاً دَقِيقاً\u003c/span>\n                \u003c/div>\n                \u003cdiv class=\"p-2\">\n                    \u003cspan class=\"block text-slate-400 text-[11px]\">نَظامُ الوَقْتِ\u003c/span>\n                    \u003cspan class=\"text-purple-300 text-base font-extrabold\">\u003ci class=\"fa-solid fa-infinity ml-1\">\u003c/i>زَمَنٌ مَفْتُوحٌ ♾️\u003c/span>\n                \u003c/div>\n            \u003c/div>\n\n        \u003c/div>\n    \u003c/div>\n\n    \u003c!-- ================= 2. HEADER BAR ================= -->\n    \u003cheader class=\"w-full max-w-6xl mx-auto flex flex-wrap items-center justify-between gap-4 p-4 glass-card rounded-2xl mb-4\">\n        \u003cdiv class=\"flex items-center gap-3\">\n            \u003cdiv class=\"w-12 h-12 bg-gradient-to-tr from-amber-500 to-yellow-300 rounded-xl flex items-center justify-center text-slate-950 text-2xl font-black shadow-lg\">\n                \u003ci class=\"fa-solid fa-book-open\">\u003c/i>\n            \u003c/div>\n            \u003cdiv>\n                \u003ch1 class=\"text-base md:text-xl font-black text-amber-300\">\n                    عجلة الحظ - الأسماء الخمسة \u003cspan class=\"text-xs bg-red-600/40 text-red-300 px-2 py-0.5 rounded border border-red-500/50\">المستوى الأصعب 🔥\u003c/span>\n                \u003c/h1>\n                \u003cp class=\"text-xs text-slate-300 font-bold\">\n                    إعداد الأستاذ: \u003cspan class=\"text-amber-400 font-extrabold text-sm\">أحمد عثمان\u003c/span>\n                \u003c/p>\n            \u003c/div>\n        \u003c/div>\n\n        \u003cdiv class=\"flex items-center gap-3\">\n            \u003cdiv class=\"flex items-center gap-2 bg-slate-900/90 px-4 py-2 rounded-xl border border-amber-500/30\">\n                \u003ci class=\"fa-solid fa-infinity text-amber-400 text-lg\">\u003c/i>\n                \u003cdiv class=\"text-right\">\n                    \u003cspan class=\"block text-[10px] text-slate-400 font-bold\">الوقت المحدد\u003c/span>\n                    \u003cspan class=\"font-bold text-amber-300 text-sm\">زَمَنٌ مَفْتُوحٌ ♾️\u003c/span>\n                \u003c/div>\n            \u003c/div>\n\n            \u003cbutton id=\"soundToggleBtn\" onclick=\"toggleAudio()\" class=\"w-10 h-10 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 flex items-center justify-center text-amber-400 transition\" title=\"كتم / تشغيل الصوت\">\n                \u003ci class=\"fa-solid fa-volume-high text-lg\">\u003c/i>\n            \u003c/button>\n        \u003c/div>\n    \u003c/header>\n\n    \u003c!-- ================= 3. GAME ARENA ================= -->\n    \u003cmain class=\"w-full max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-6 items-start my-auto\">\n        \n        \u003c!-- Team 1 Score Card (Blue) -->\n        \u003cdiv id=\"team1Card\" class=\"lg:col-span-3 glass-card p-5 rounded-3xl space-y-4 border-2 border-blue-500/40 transition-all duration-300\">\n            \u003cdiv class=\"flex items-center justify-between\">\n                \u003cdiv class=\"flex items-center gap-2\">\n                    \u003cspan class=\"w-3.5 h-3.5 rounded-full bg-blue-500 animate-pulse\">\u003c/span>\n                    \u003ch2 class=\"font-black text-lg text-blue-400\">فريق التميز\u003c/h2>\n                \u003c/div>\n                \u003cspan class=\"text-xs bg-blue-500/20 text-blue-300 px-2.5 py-1 rounded-full border border-blue-500/30 font-bold\">الفريق الأزرق\u003c/span>\n            \u003c/div>\n\n            \u003cdiv class=\"bg-slate-900/90 p-4 rounded-2xl text-center border border-slate-800\">\n                \u003cspan class=\"block text-xs text-slate-400 mb-1 font-bold\">النقاط الإجمالية\u003c/span>\n                \u003cspan id=\"team1Score\" class=\"font-black text-4xl text-blue-400\">0\u003c/span>\n            \u003c/div>\n\n            \u003cdiv class=\"space-y-1\">\n                \u003cdiv class=\"flex justify-between text-xs text-slate-300 font-bold\">\n                    \u003cspan>الأسئلة المُجابة:\u003c/span>\n                    \u003cspan id=\"team1AnsweredCount\">0 / 15\u003c/span>\n                \u003c/div>\n                \u003cdiv class=\"w-full bg-slate-800 h-2.5 rounded-full overflow-hidden\">\n                    \u003cdiv id=\"team1Bar\" class=\"bg-blue-500 h-full w-0 transition-all duration-300\">\u003c/div>\n                \u003c/div>\n            \u003c/div>\n        \u003c/div>\n\n        \u003c!-- Center Wheel Area -->\n        \u003cdiv class=\"lg:col-span-6 glass-card p-6 rounded-3xl flex flex-col items-center justify-center relative overflow-hidden\">\n            \n            \u003cdiv id=\"turnBanner\" class=\"mb-4 px-6 py-2.5 rounded-full bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-black text-base md:text-lg shadow-lg flex items-center gap-2 glow-blue\">\n                \u003ci class=\"fa-solid fa-gamepad\">\u003c/i>\n                \u003cspan id=\"turnBannerText\">دور: فريق التميز (أَدِرِ العَجَلَة)\u003c/span>\n            \u003c/div>\n\n            \u003cdiv class=\"relative my-2\">\n                \u003cdiv class=\"absolute -top-4 left-1/2 -translate-x-1/2 z-20 pointer-anim text-amber-400 text-3xl filter drop-shadow\">\n                    \u003ci class=\"fa-solid fa-caret-down\">\u003c/i>\n                \u003c/div>\n\n                \u003ccanvas id=\"wheelCanvas\" width=\"380\" height=\"380\" class=\"max-w-full h-auto\">\u003c/canvas>\n            \u003c/div>\n\n            \u003cbutton id=\"spinBtn\" onclick=\"spinWheel()\" class=\"mt-4 px-10 py-4 bg-gradient-to-r from-amber-500 via-yellow-400 to-amber-500 hover:brightness-110 text-slate-950 font-black text-xl rounded-2xl shadow-xl active:scale-95 transition-all flex items-center gap-3 border border-yellow-200 glow-gold cursor-pointer\">\n                \u003ci class=\"fa-solid fa-rotate text-2xl\">\u003c/i>\n                \u003cspan>أَدِر العَجَلَة الآن!\u003c/span>\n            \u003c/button>\n        \u003c/div>\n\n        \u003c!-- Team 2 Score Card (Green) -->\n        \u003cdiv id=\"team2Card\" class=\"lg:col-span-3 glass-card p-5 rounded-3xl space-y-4 border-2 border-emerald-500/40 transition-all duration-300\">\n            \u003cdiv class=\"flex items-center justify-between\">\n                \u003cdiv class=\"flex items-center gap-2\">\n                    \u003cspan class=\"w-3.5 h-3.5 rounded-full bg-emerald-500\">\u003c/span>\n                    \u003ch2 class=\"font-black text-lg text-emerald-400\">فريق التفوق\u003c/h2>\n                \u003c/div>\n                \u003cspan class=\"text-xs bg-emerald-500/20 text-emerald-300 px-2.5 py-1 rounded-full border border-emerald-500/30 font-bold\">الفريق الأخضر\u003c/span>\n            \u003c/div>\n\n            \u003cdiv class=\"bg-slate-900/90 p-4 rounded-2xl text-center border border-slate-800\">\n                \u003cspan class=\"block text-xs text-slate-400 mb-1 font-bold\">النقاط الإجمالية\u003c/span>\n                \u003cspan id=\"team2Score\" class=\"font-black text-4xl text-emerald-400\">0\u003c/span>\n            \u003c/div>\n\n            \u003cdiv class=\"space-y-1\">\n                \u003cdiv class=\"flex justify-between text-xs text-slate-300 font-bold\">\n                    \u003cspan>الأسئلة المُجابة:\u003c/span>\n                    \u003cspan id=\"team2AnsweredCount\">0 / 15\u003c/span>\n                \u003c/div>\n                \u003cdiv class=\"w-full bg-slate-800 h-2.5 rounded-full overflow-hidden\">\n                    \u003cdiv id=\"team2Bar\" class=\"bg-emerald-500 h-full w-0 transition-all duration-300\">\u003c/div>\n                \u003c/div>\n            \u003c/div>\n        \u003c/div>\n\n    \u003c/main>\n\n    \u003cfooter class=\"w-full max-w-6xl mx-auto text-center text-xs text-slate-400 py-3 font-semibold\">\n        مسابقة الأسماء الخمسة التفاعلية (المستوى الأصعب) &copy; 2026 - إعداد الأستاذ أحمد عثمان\n    \u003c/footer>\n\n    \u003c!-- ================= 4. QUESTION MODAL ================= -->\n    \u003cdiv id=\"questionModal\" class=\"fixed inset-0 z-50 modal-bg hidden flex items-center justify-center p-4\">\n        \u003cdiv class=\"glass-card w-full max-w-3xl rounded-3xl p-6 md:p-8 space-y-6 relative border border-slate-700 shadow-2xl\">\n            \n            \u003cdiv class=\"flex items-center justify-between border-b border-slate-700/60 pb-4\">\n                \u003cdiv class=\"flex items-center gap-2\">\n                    \u003cspan id=\"qTeamBadge\" class=\"px-3 py-1 rounded-full text-xs font-black\">--\u003c/span>\n                    \u003cspan id=\"qPointsBadge\" class=\"bg-amber-500/20 text-amber-300 border border-amber-500/30 px-3 py-1 rounded-full text-xs font-bold\">100 نقطة\u003c/span>\n                    \u003cspan class=\"bg-red-500/20 text-red-300 border border-red-500/30 px-2.5 py-0.5 rounded-full text-[11px] font-bold\">المستوى الأصعب 🔥\u003c/span>\n                \u003c/div>\n                \u003cspan id=\"qNumBadge\" class=\"text-xs text-slate-400 font-bold\">سؤال 1 من 15\u003c/span>\n            \u003c/div>\n\n            \u003cdiv class=\"text-center py-2\">\n                \u003ch3 id=\"questionText\" class=\"text-lg md:text-2xl font-black text-white leading-relaxed\">\n                    --\n                \u003c/h3>\n            \u003c/div>\n\n            \u003cdiv id=\"optionsGrid\" class=\"grid grid-cols-1 md:grid-cols-2 gap-3\">\n                \u003c!-- Options Rendered Dynamically -->\n            \u003c/div>\n\n            \u003cdiv id=\"feedbackPanel\" class=\"hidden p-4 rounded-2xl space-y-3 border\">\n                \u003ch4 id=\"feedbackTitle\" class=\"font-bold text-base flex items-center gap-2\">\u003c/h4>\n                \u003cp id=\"feedbackExplanation\" class=\"text-sm text-slate-100 leading-relaxed font-semibold bg-slate-900/80 p-3 rounded-xl border border-slate-800\">\u003c/p>\n                \u003cdiv class=\"text-left pt-1\">\n                    \u003cbutton onclick=\"closeQuestionModal()\" class=\"px-6 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-sm rounded-xl transition shadow-lg cursor-pointer\">\n                        متابعة المسابقة \u003ci class=\"fa-solid fa-arrow-left ml-1\">\u003c/i>\n                    \u003c/button>\n                \u003c/div>\n            \u003c/div>\n\n        \u003c/div>\n    \u003c/div>\n\n    \u003c!-- ================= 5. VICTORY MODAL ================= -->\n    \u003cdiv id=\"victoryModal\" class=\"fixed inset-0 z-50 modal-bg hidden flex items-center justify-center p-4\">\n        \u003cdiv class=\"glass-card w-full max-w-xl rounded-3xl p-8 text-center space-y-6 border border-amber-500/50 shadow-2xl glow-gold\">\n            \u003cdiv class=\"w-20 h-20 bg-gradient-to-tr from-amber-400 to-yellow-200 rounded-full flex items-center justify-center text-slate-950 text-4xl shadow-xl mx-auto\">\n                \u003ci class=\"fa-solid fa-trophy animate-bounce\">\u003c/i>\n            \u003c/div>\n            \n            \u003cdiv class=\"space-y-2\">\n                \u003ch2 class=\"text-xl font-bold text-slate-300\">ختام التحدي النحوي الكبير!\u003c/h2>\n                \u003ch1 id=\"winnerTitle\" class=\"text-3xl md:text-4xl font-black text-amber-300\">--\u003c/h1>\n                \u003cp id=\"winnerSubtitle\" class=\"text-sm text-slate-300 font-semibold\">\u003c/p>\n                \u003cp class=\"text-base text-amber-400 font-extrabold pt-2\">إعداد وتأطير: الأستاذ أحمد عثمان\u003c/p>\n            \u003c/div>\n\n            \u003cdiv class=\"grid grid-cols-2 gap-4 bg-slate-900/90 p-4 rounded-2xl border border-slate-800\">\n                \u003cdiv>\n                    \u003cspan class=\"block text-xs text-slate-400 font-bold\">فريق التميز\u003c/span>\n                    \u003cspan id=\"vScore1\" class=\"font-black text-3xl text-blue-400\">0\u003c/span>\n                \u003c/div>\n                \u003cdiv>\n                    \u003cspan class=\"block text-xs text-slate-400 font-bold\">فريق التفوق\u003c/span>\n                    \u003cspan id=\"vScore2\" class=\"font-black text-3xl text-emerald-400\">0\u003c/span>\n                \u003c/div>\n            \u003c/div>\n\n            \u003cbutton onclick=\"location.reload()\" class=\"w-full py-4 bg-gradient-to-r from-amber-500 to-yellow-400 hover:brightness-110 text-slate-950 font-black text-lg rounded-2xl shadow-xl transition cursor-pointer\">\n                \u003ci class=\"fa-solid fa-rotate-right ml-2\">\u003c/i>إعادة المسابقة من جديد\n            \u003c/button>\n        \u003c/div>\n    \u003c/div>\n\n    \u003c!-- ================= JAVASCRIPT LOGIC ================= -->\n    \u003cscript>\n        // Web Audio Synthesizer\n        let audioCtx = null;\n        let soundEnabled = true;\n\n        function initAudio() {\n            if (!audioCtx) {\n                audioCtx = new (window.AudioContext || window.webkitAudioContext)();\n            }\n        }\n\n        function toggleAudio() {\n            soundEnabled = !soundEnabled;\n            const btn = document.getElementById(\"soundToggleBtn\");\n            btn.innerHTML = soundEnabled ? '\u003ci class=\"fa-solid fa-volume-high text-lg\">\u003c/i>' : '\u003ci class=\"fa-solid fa-volume-xmark text-lg text-slate-500\">\u003c/i>';\n        }\n\n        function playBeep(freq, type, duration) {\n            if (!soundEnabled) return;\n            try {\n                initAudio();\n                const osc = audioCtx.createOscillator();\n                const gain = audioCtx.createGain();\n                osc.type = type || 'sine';\n                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);\n                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);\n                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);\n                osc.connect(gain);\n                gain.connect(audioCtx.destination);\n                osc.start();\n                osc.stop(audioCtx.currentTime + duration);\n            } catch(e){}\n        }\n\n        function playCorrectSound() {\n            playBeep(523.25, 'sine', 0.15);\n            setTimeout(() => playBeep(659.25, 'sine', 0.15), 120);\n            setTimeout(() => playBeep(783.99, 'sine', 0.25), 240);\n        }\n\n        function playWrongSound() {\n            playBeep(220, 'sawtooth', 0.2);\n            setTimeout(() => playBeep(180, 'sawtooth', 0.3), 150);\n        }\n\n        function playSpinTick() {\n            playBeep(450, 'triangle', 0.03);\n        }\n\n        // Wheel Segments\n        const wheelSlices = [\n            { label: '100 نقطة', value: 100, color: '#2563eb' },\n            { label: '200 نقطة', value: 200, color: '#059669' },\n            { label: '300 نقطة', value: 300, color: '#d97706' },\n            { label: 'سؤال ذهبي 500', value: 500, color: '#7c3aed' },\n            { label: '150 نقطة', value: 150, color: '#db2777' },\n            { label: '250 نقطة', value: 250, color: '#0891b2' }\n        ];\n\n        // 30 HARDEST ASMAA AL-KHAMSA QUESTIONS - ZERO HINTING PHRASES (NO \"لأنه من الأسماء الخمسة\")\n        const rawQuestionsTeam1 = [\n            {\n                q: \"إعراب كلمة (أَبُوكَ) في جملة: (حَضَرَ أَبُوكَ إلَى المَدْرَسَةِ):\",\n                correct: \"فاعل مرفوع وعلامة رفعه الواو\",\n                wrongs: [\"فاعل مرفوع وعلامة رفعه الضمة الظاهرة\", \"فاعل مرفوع وعلامة رفعه الضمة المقدرة\", \"مبتدأ مرفوع وعلامة رفعه الواو\"],\n                exp: \"التوجيه النحوي: اسم مضاف لغير ياء المتكلم ومفرد، فيُرفع بالواو.\"\n            },\n            {\n                q: \"إعراب كلمة (أَبِي) في جملة: (أَبِي رَجُلٌ كَرِيمٌ):\",\n                correct: \"مبتدأ مرفوع وعلامة رفعه الضمة المقدرة على ما قبل ياء المتكلم\",\n                wrongs: [\"مبتدأ مرفوع وعلامة رفعه الواو\", \"مبتدأ مرفوع وعلامة رفعه الضمة الظاهرة\", \"خبر مرفوع وعلامة رفعه الواو\"],\n                exp: \"التوجيه النحوي: أضيف الاسم لياء المتكلم فَيُعرب بالحركات المقدرة.\"\n            },\n            {\n                q: \"إعراب كلمة (أَخَاك) في جملة: (إِنَّ أَخَاكَ ذُو عِلْمٍ):\",\n                correct: \"اسم إن منصوب وعلامة نصبه الألف\",\n                wrongs: [\"اسم إن منصوب وعلامة نصبه الفتحة الظاهرة\", \"خبر إن مرفوع وعلامة رفعه الواو\", \"مفعول به منصوب وعلامة نصبه الألف\"],\n                exp: \"التوجيه النحوي: اسم مفرد مضاف للجميع فيُنصب بالألف.\"\n            },\n            {\n                q: \"إعراب كلمة (فُوهُ) في جملة: (يَنْطِقُ فُوهُ بِالْحَقِّ):\",\n                correct: \"فاعل مرفوع وعلامة رفعه الواو\",\n                wrongs: [\"فاعل مرفوع وعلامة رفعه الضمة الظاهرة\", \"نائب فاعل مرفوع وعلامة رفعه الواو\", \"فاعل مرفوع وعلامة رفعه ثبوت النون\"],\n                exp: \"التوجيه النحوي: اسم مفرد جُرِّد من الميم وأُضيف للهاء فيُرفع بالواو.\"\n            },\n            {\n                q: \"إعراب كلمة (فَمُكَ) في جملة: (فَمُكَ طَاهِرٌ):\",\n                correct: \"مبتدأ مرفوع وعلامة رفعه الضمة الظاهرة\",\n                wrongs: [\"مبتدأ مرفوع وعلامة رفعه الواو\", \"خبر مرفوع وعلامة رفعه الضمة المقدرة\", \"مبتدأ مرفوع وعلامة رفعه الألف\"],\n                exp: \"التوجيه النحوي: اتصلت الميم بالاسم فَيُعرب بالحركات الظاهرة.\"\n            },\n            {\n                q: \"إعراب كلمة (ذِي) في جملة: (مَرَرْتُ بِذِي فَضْلٍ):\",\n                correct: \"اسم مجرور وعلامة جره الياء\",\n                wrongs: [\"اسم مجرور وعلامة جره الكسرة الظاهرة\", \"اسم مجرور وعلامة جره الكسرة المقدرة\", \"مضاف إليه مجرور وعلامة جره الياء\"],\n                exp: \"التوجيه النحوي: اسم مضاف لاسم ظاهر فيُجر بالياء.\"\n            },\n            {\n                q: \"إعراب كلمة (ذُو) في جملة: (هَذَا رَجُلٌ ذُو عِلْمٍ):\",\n                correct: \"نعت مرفوع وعلامة رفعه الواو\",\n                wrongs: [\"خبر مرفوع وعلامة رفعه الضمة الظاهرة\", \"نعت مرفوع وعلامة رفعه الضمة الظاهرة\", \"بدل مرفوع وعلامة رفعه الواو\"],\n                exp: \"التوجيه النحوي: اسم مضاف لاسم ظاهر وقع نعتاً لمرفوع فيُرفع بالواو.\"\n            },\n            {\n                q: \"إعراب كلمة (آبَاؤُكُمْ) في جملة: (آبَاؤُكُمْ كُرَمَاءُ):\",\n                correct: \"مبتدأ مرفوع وعلامة رفعه الضمة الظاهرة\",\n                wrongs: [\"مبتدأ مرفوع وعلامة رفعه الواو\", \"مبتدأ مرفوع وعلامة رفعه ثبوت النون\", \"خبر مرفوع وعلامة رفعه الضمة الظاهرة\"],\n                exp: \"التوجيه النحوي: الاسم جاء بصيغة الجمع فيُعرب بالحركات الظاهرة.\"\n            },\n            {\n                q: \"إعراب كلمة (حَمُوكَ) في جملة: (كَانَ حَمُوكَ رَجُلاً صَالِحاً):\",\n                correct: \"اسم كان مرفوع وعلامة رفعه الواو\",\n                wrongs: [\"اسم كان مرفوع وعلامة رفعه الضمة الظاهرة\", \"خبر كان منصوب وعلامة نصبه الألف\", \"فاعل مرفوع وعلامة رفعه الواو\"],\n                exp: \"التوجيه النحوي: اسم مفرد مضاف للغير فيُرفع بالواو.\"\n            },\n            {\n                q: \"إعراب كلمة (أُخَيَّكَ) في جملة: (شَاهَدْتُ أُخَيَّكَ):\",\n                correct: \"مفعول به منصوب وعلامة نصبه الفتحة الظاهرة\",\n                wrongs: [\"مفعول به منصوب وعلامة نصبه الألف\", \"مفعول به منصوب وعلامة نصبه الياء\", \"اسم منصوب وعلامة نصبه الفتحة المقدرة\"],\n                exp: \"التوجيه النحوي: الاسم مصغر فيُعرب بالحركات الظاهرة.\"\n            },\n            {\n                q: \"إعراب كلمة (ذَا) في جملة: (إِنَّ ذَا الْمَالِ مَحْبُوبٌ):\",\n                correct: \"اسم إن منصوب وعلامة نصبه الألف\",\n                wrongs: [\"اسم إن منصوب وعلامة نصبه الفتحة الظاهرة\", \"اسم إشارة مبني في محل نصب\", \"خبر إن منصوب وعلامة نصبه الألف\"],\n                exp: \"التوجيه النحوي: (ذا) بـمعنى صاحب مضافة لاسم ظاهر فتُنصب بالألف.\"\n            },\n            {\n                q: \"إعراب كلمة (أَخَوَيْنِ) في جملة: (رَأَيْتُ أَخَوَيْنِ):\",\n                correct: \"مفعول به منصوب وعلامة نصبه الياء لأنه مثنى\",\n                wrongs: [\"مفعول به منصوب وعلامة نصبه الألف\", \"مفعول به منصوب وعلامة نصبه الفتحة\", \"اسم منصوب وعلامة نصبه الكسرة\"],\n                exp: \"التوجيه النحوي: الاسم مثنى فيُعرب إعراب المثنى بالياء.\"\n            },\n            {\n                q: \"إعراب كلمة (أَبٍ) في جملة: (رَبَّتْنِي يَدَا أَبٍ كَرِيمٍ):\",\n                correct: \"مضاف إليه مجرور وعلامة جره الكسرة الظاهرة\",\n                wrongs: [\"مضاف إليه مجرور وعلامة جره الياء\", \"مضاف إليه مجرور وعلامة جره الكسرة المقدرة\", \"اسم مجرور وعلامة جره الياء\"],\n                exp: \"التوجيه النحوي: الاسم غير مضاف فَيُعرب بالحركات الظاهرة.\"\n            },\n            {\n                q: \"إعراب كلمة (فَاهُ) في جملة: (فَتَحَ الطَّبِيبُ فَاهُ):\",\n                correct: \"مفعول به منصوب وعلامة نصبه الألف\",\n                wrongs: [\"مفعول به منصوب وعلامة نصبه الفتحة الظاهرة\", \"مفعول به منصوب وعلامة نصبه الفتحة المقدرة\", \"فاعل مرفوع وعلامة رفعه الواو\"],\n                exp: \"التوجيه النحوي: اسم مجرد من الميم ومضاف للضمير فيُنصب بالألف.\"\n            },\n            {\n                q: \"إعراب كلمة (حَمٍ) في جملة: (سَلَّمْتُ عَلَى حَمٍ):\",\n                correct: \"اسم مجرور وعلامة جره الكسرة الظاهرة\",\n                wrongs: [\"اسم مجرور وعلامة جره الياء\", \"اسم مجرور وعلامة جره الكسرة المقدرة\", \"مضاف إليه مجرور وعلامة جره الياء\"],\n                exp: \"التوجيه النحوي: الاسم مقطوع عن الإضافة فَيُعرب بالحركات الظاهرة.\"\n            }\n        ];\n\n        const rawQuestionsTeam2 = [\n            {\n                q: \"إعراب كلمة (أَخُوكَ) في جملة: (أَخُوكَ طَالِبٌ مُجْتَهِدٌ):\",\n                correct: \"مبتدأ مرفوع وعلامة رفعه الواو\",\n                wrongs: [\"مبتدأ مرفوع وعلامة رفعه الضمة الظاهرة\", \"خبر مرفوع وعلامة رفعه الواو\", \"مبتدأ مرفوع وعلامة رفعه الضمة المقدرة\"],\n                exp: \"التوجيه النحوي: اسم مفرد مضاف لغير ياء المتكلم فيُرفع بالواو.\"\n            },\n            {\n                q: \"إعراب كلمة (أَخِي) في جملة: (جَاءَ أَخِي):\",\n                correct: \"فاعل مرفوع وعلامة رفعه الضمة المقدرة على ما قبل ياء المتكلم\",\n                wrongs: [\"فاعل مرفوع وعلامة رفعه الواو\", \"فاعل مرفوع وعلامة رفعه الضمة الظاهرة\", \"مفعول به منصوب وعلامة نصبه الياء\"],\n                exp: \"التوجيه النحوي: أضيف لياء المتكلم فَيُعرب بالحركات المقدرة.\"\n            },\n            {\n                q: \"إعراب كلمة (أَبَاكَ) في جملة: (احْتَرِمْ أَبَاكَ):\",\n                correct: \"مفعول به منصوب وعلامة نصبه الألف\",\n                wrongs: [\"مفعول به منصوب وعلامة نصبه الفتحة الظاهرة\", \"فاعل مرفوع وعلامة رفعه الواو\", \"اسم منصوب وعلامة نصبه الفتحة المقدرة\"],\n                exp: \"التوجيه النحوي: اسم مفرد مضاف للغير فيُنصب بالألف.\"\n            },\n            {\n                q: \"إعراب كلمة (فِيكَ) في جملة: (لاَ تُخْرِجْ شَرّاً مِنْ فِيكَ):\",\n                correct: \"اسم مجرور وعلامة جره الياء\",\n                wrongs: [\"اسم مجرور وعلامة جره الكسرة الظاهرة\", \"اسم مجرور وعلامة جره الكسرة المقدرة\", \"مضاف إليه مجرور وعلامة جره الياء\"],\n                exp: \"التوجيه النحوي: اسم مجرد من الميم ومضاف فيُجر بالياء.\"\n            },\n            {\n                q: \"إعراب كلمة (فَمٌ) في جملة: (هَذَا فَمٌ يَنْطِقُ بِالْحِكْمَةِ):\",\n                correct: \"خبر مرفوع وعلامة رفعه الضمة الظاهرة\",\n                wrongs: [\"خبر مرفوع وعلامة رفعه الواو\", \"مبتدأ مرفوع وعلامة رفعه الضمة المقدرة\", \"خبر مرفوع وعلامة رفعه الألف\"],\n                exp: \"التوجيه النحوي: اتصلت به الميم فَيُعرب بالحركات الظاهرة.\"\n            },\n            {\n                q: \"إعراب كلمة (ذُو) في جملة: (المُعَلِّمُ ذُو فَضْلٍ):\",\n                correct: \"خبر مرفوع وعلامة رفعه الواو\",\n                wrongs: [\"خبر مرفوع وعلامة رفعه الضمة الظاهرة\", \"نعت مرفوع وعلامة رفعه الواو\", \"مبتدأ ثاني مرفوع وعلامة رفعه الضمة\"],\n                exp: \"التوجيه النحوي: اسم مضاف لاسم ظاهر فيُرفع بالواو.\"\n            },\n            {\n                q: \"إعراب كلمة (ذِي) في جملة: (سَلَّمْتُ عَلَى رَجُلٍ ذِي مَالٍ):\",\n                correct: \"نعت مجرور وعلامة جره الياء\",\n                wrongs: [\"اسم مجرور وعلامة جره الكسرة الظاهرة\", \"نعت مجرور وعلامة جره الكسرة المقدرة\", \"مضاف إليه مجرور وعلامة جره الياء\"],\n                exp: \"التوجيه النحوي: اسم مضاف لاسم ظاهر وقع نعتاً لمجرور فيُجر بالياء.\"\n            },\n            {\n                q: \"إعراب كلمة (إِخْوَانُكَ) في جملة: (إِخْوَانُكَ أَوْفِيَاءُ):\",\n                correct: \"مبتدأ مرفوع وعلامة رفعه الضمة الظاهرة\",\n                wrongs: [\"مبتدأ مرفوع وعلامة رفعه الواو\", \"مبتدأ مرفوع وعلامة رفعه الألف\", \"خبر مرفوع وعلامة رفعه الضمة الظاهرة\"],\n                exp: \"التوجيه النحوي: جاء بصيغة جمع التكسير فَيُعرب بالحركات الظاهرة.\"\n            },\n            {\n                q: \"إعراب كلمة (حَمَاكِ) في جملة: (اكْرِمِي حَمَاكِ):\",\n                correct: \"مفعول به منصوب وعلامة نصبه الألف\",\n                wrongs: [\"مفعول به منصوب وعلامة نصبه الفتحة الظاهرة\", \"فاعل مرفوع وعلامة رفعه الواو\", \"مفعول به منصوب وعلامة نصبه الكسرة\"],\n                exp: \"التوجيه النحوي: اسم مفرد مضاف للغير فيُنصب بالألف.\"\n            },\n            {\n                q: \"إعراب كلمة (أُبَيَّكَ) في جملة: (أَطِعْ أُبَيَّكَ):\",\n                correct: \"مفعول به منصوب وعلامة نصبه الفتحة الظاهرة\",\n                wrongs: [\"مفعول به منصوب وعلامة نصبه الألف\", \"مفعول به منصوب وعلامة نصبه الياء\", \"فاعل مرفوع وعلامة رفعه الضمة\"],\n                exp: \"التوجيه النحوي: الاسم جاء مصغراً فَيُعرب بالحركات الظاهرة.\"\n            },\n            {\n                q: \"إعراب كلمة (ذُو) في جملة: (إِنَّ زَيْداً ذُو عِلْمٍ):\",\n                correct: \"خبر إن مرفوع وعلامة رفعه الواو\",\n                wrongs: [\"اسم إن منصوب وعلامة نصبه الألف\", \"خبر إن مرفوع وعلامة رفعه الضمة الظاهرة\", \"نعت مرفوع وعلامة رفعه الواو\"],\n                exp: \"التوجيه النحوي: (ذو) مضافة لاسم ظاهر ووقعت خبراً لإن فُترفع بالواو.\"\n            },\n            {\n                q: \"إعراب كلمة (أَبَوَاكَ) في جملة: (أَبَوَاكَ رَحِيمَانِ):\",\n                correct: \"مبتدأ مرفوع وعلامة رفعه الألف لأنه مثنى\",\n                wrongs: [\"مبتدأ مرفوع وعلامة رفعه الواو\", \"مبتدأ مرفوع وعلامة رفعه الضمة الظاهرة\", \"مبتدأ مرفوع وعلامة رفعه الضمة المقدرة\"],\n                exp: \"التوجيه النحوي: الاسم مثنى فَيُعرب إعراب المثنى بالألف.\"\n            },\n            {\n                q: \"إعراب كلمة (أَخٌ) في جملة: (هَذَا أَخٌ صَالِحٌ):\",\n                correct: \"خبر مرفوع وعلامة رفعه الضمة الظاهرة\",\n                wrongs: [\"خبر مرفوع وعلامة رفعه الواو\", \"خبر مرفوع وعلامة رفعه الضمة المقدرة\", \"مبتدأ مرفوع وعلامة رفعه الواو\"],\n                exp: \"التوجيه النحوي: الاسم غير مضاف فَيُعرب بالحركات الظاهرة.\"\n            },\n            {\n                q: \"إعراب كلمة (فُوهُ) في جملة: (فُوهُ طَيِّبُ الرَّائِحَةِ):\",\n                correct: \"مبتدأ مرفوع وعلامة رفعه الواو\",\n                wrongs: [\"مبتدأ مرفوع وعلامة رفعه الضمة الظاهرة\", \"مبتدأ مرفوع وعلامة رفعه الضمة المقدرة\", \"خبر مرفوع وعلامة رفعه الواو\"],\n                exp: \"التوجيه النحوي: اسم مجرد من الميم ومضاف فيُرفع بالواو.\"\n            },\n            {\n                q: \"إعراب كلمة (حَمٍ) في جملة: (هَذَا حَمٌ كَرِيمٌ):\",\n                correct: \"خبر مرفوع وعلامة رفعه الضمة الظاهرة\",\n                wrongs: [\"خبر مرفوع وعلامة رفعه الواو\", \"خبر مرفوع وعلامة رفعه الضمة المقدرة\", \"مبتدأ مرفوع وعلامة رفعه الواو\"],\n                exp: \"التوجيه النحوي: الاسم غير مضاف فَيُعرب بالحركات الظاهرة.\"\n            }\n        ];\n\n        // STRICT ROUND-ROBIN OPTION ROTATION ALGORITHM (Question 1: A, 2: B, 3: C, 4: D, 5: A...)\n        function generateRoundRobinQuestions(rawList) {\n            return rawList.map((item, index) => {\n                const targetPos = index % 4; // 0: A (أ), 1: B (ب), 2: C (ج), 3: D (د)\n                const options = [null, null, null, null];\n                \n                // Set correct answer strictly at target position\n                options[targetPos] = { text: item.correct, correct: true };\n\n                // Fill remaining positions with wrong options\n                let wIdx = 0;\n                for (let i = 0; i \u003c 4; i++) {\n                    if (i !== targetPos) {\n                        options[i] = { text: item.wrongs[wIdx], correct: false };\n                        wIdx++;\n                    }\n                }\n\n                return {\n                    q: item.q,\n                    options: options,\n                    exp: item.exp\n                };\n            });\n        }\n\n        const questionsBank = {\n            team1: generateRoundRobinQuestions(rawQuestionsTeam1),\n            team2: generateRoundRobinQuestions(rawQuestionsTeam2)\n        };\n\n        // Game State Variables\n        let currentTurn = 1;\n        let team1Score = 0;\n        let team2Score = 0;\n        let team1Index = 0;\n        let team2Index = 0;\n\n        let isSpinning = false;\n        let startAngle = 0;\n        let selectedSlice = null;\n\n        let canvas = null;\n        let ctx = null;\n\n        function launchGame() {\n            document.getElementById(\"startScreen\").classList.add(\"hidden\");\n            initAudio();\n        }\n\n        window.onload = function() {\n            canvas = document.getElementById(\"wheelCanvas\");\n            ctx = canvas.getContext(\"2d\");\n            drawWheel();\n            updateUI();\n        };\n\n        function drawWheel() {\n            const numSlices = wheelSlices.length;\n            const arcSize = (2 * Math.PI) / numSlices;\n            const centerX = canvas.width / 2;\n            const centerY = canvas.height / 2;\n            const radius = centerX - 10;\n\n            ctx.clearRect(0, 0, canvas.width, canvas.height);\n\n            for (let i = 0; i \u003c numSlices; i++) {\n                const angle = startAngle + i * arcSize;\n                \n                ctx.beginPath();\n                ctx.arc(centerX, centerY, radius, angle, angle + arcSize, false);\n                ctx.lineTo(centerX, centerY);\n                ctx.fillStyle = wheelSlices[i].color;\n                ctx.fill();\n                ctx.strokeStyle = \"#020617\";\n                ctx.lineWidth = 4;\n                ctx.stroke();\n\n                ctx.save();\n                ctx.translate(centerX, centerY);\n                ctx.rotate(angle + arcSize / 2);\n                ctx.textAlign = \"right\";\n                ctx.fillStyle = \"#ffffff\";\n                ctx.font = \"bold 15px Cairo\";\n                ctx.fillText(wheelSlices[i].label, radius - 20, 6);\n                ctx.restore();\n            }\n\n            // Center Hub\n            ctx.beginPath();\n            ctx.arc(centerX, centerY, 34, 0, 2 * Math.PI);\n            ctx.fillStyle = \"#020617\";\n            ctx.fill();\n            ctx.strokeStyle = \"#fbbf24\";\n            ctx.lineWidth = 4;\n            ctx.stroke();\n\n            ctx.fillStyle = \"#fbbf24\";\n            ctx.font = \"bold 12px Cairo\";\n            ctx.textAlign = \"center\";\n            ctx.textBaseline = \"middle\";\n            ctx.fillText(\"الخَمْسَة 🔥\", centerX, centerY);\n        }\n\n        function spinWheel() {\n            if (isSpinning) return;\n\n            if (team1Index >= 15 && team2Index >= 15) {\n                endGame();\n                return;\n            }\n\n            if (currentTurn === 1 && team1Index >= 15) {\n                currentTurn = 2;\n                updateUI();\n            } else if (currentTurn === 2 && team2Index >= 15) {\n                currentTurn = 1;\n                updateUI();\n            }\n\n            isSpinning = true;\n            document.getElementById(\"spinBtn\").disabled = true;\n\n            const spinRounds = 6 + Math.random() * 5;\n            const totalRotation = spinRounds * 2 * Math.PI + Math.random() * 2 * Math.PI;\n            const duration = 4200;\n            const startTime = performance.now();\n            const initialAngle = startAngle;\n\n            function animateSpin(now) {\n                const elapsed = now - startTime;\n                const progress = Math.min(elapsed / duration, 1);\n                const easeOut = 1 - Math.pow(1 - progress, 3);\n                \n                startAngle = initialAngle + totalRotation * easeOut;\n                drawWheel();\n\n                if (Math.random() \u003c 0.25) playSpinTick();\n\n                if (progress \u003c 1) {\n                    requestAnimationFrame(animateSpin);\n                } else {\n                    isSpinning = false;\n                    document.getElementById(\"spinBtn\").disabled = false;\n                    calculateSliceResult();\n                }\n            }\n\n            requestAnimationFrame(animateSpin);\n        }\n\n        function calculateSliceResult() {\n            const numSlices = wheelSlices.length;\n            const arcSize = (2 * Math.PI) / numSlices;\n            let normalizedAngle = (startAngle % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI);\n            let pointerAngle = (3 * Math.PI / 2 - normalizedAngle + 2 * Math.PI) % (2 * Math.PI);\n            let sliceIndex = Math.floor(pointerAngle / arcSize) % numSlices;\n\n            selectedSlice = wheelSlices[sliceIndex];\n            openQuestionModal();\n        }\n\n        function updateUI() {\n            document.getElementById(\"team1Score\").innerText = team1Score;\n            document.getElementById(\"team2Score\").innerText = team2Score;\n\n            document.getElementById(\"team1AnsweredCount\").innerText = `${team1Index} / 15`;\n            document.getElementById(\"team2AnsweredCount\").innerText = `${team2Index} / 15`;\n\n            document.getElementById(\"team1Bar\").style.width = `${(team1Index / 15) * 100}%`;\n            document.getElementById(\"team2Bar\").style.width = `${(team2Index / 15) * 100}%`;\n\n            const banner = document.getElementById(\"turnBanner\");\n            const bannerText = document.getElementById(\"turnBannerText\");\n            const card1 = document.getElementById(\"team1Card\");\n            const card2 = document.getElementById(\"team2Card\");\n\n            if (currentTurn === 1) {\n                banner.className = \"mb-4 px-6 py-2.5 rounded-full bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-black text-base md:text-lg shadow-lg flex items-center gap-2 glow-blue\";\n                bannerText.innerText = \"دور: فريق التميز (أَدِرِ العَجَلَة)\";\n                card1.classList.add(\"border-blue-500\", \"glow-blue\");\n                card2.classList.remove(\"border-emerald-500\", \"glow-green\");\n            } else {\n                banner.className = \"mb-4 px-6 py-2.5 rounded-full bg-gradient-to-r from-emerald-600 to-teal-600 text-white font-black text-base md:text-lg shadow-lg flex items-center gap-2 glow-green\";\n                bannerText.innerText = \"دور: فريق التفوق (أَدِرِ العَجَلَة)\";\n                card2.classList.add(\"border-emerald-500\", \"glow-green\");\n                card1.classList.remove(\"border-blue-500\", \"glow-blue\");\n            }\n        }\n\n        function openQuestionModal() {\n            const isTeam1 = (currentTurn === 1);\n            const qList = isTeam1 ? questionsBank.team1 : questionsBank.team2;\n            const qIndex = isTeam1 ? team1Index : team2Index;\n\n            if (qIndex >= 15) {\n                alert(\"أكمل هذا الفريق جميع أسئلته بنجاح!\");\n                currentTurn = isTeam1 ? 2 : 1;\n                updateUI();\n                return;\n            }\n\n            const currentQ = qList[qIndex];\n            const optionPrefixes = [\"أ\", \"ب\", \"ج\", \"د\"];\n\n            const qTeamBadge = document.getElementById(\"qTeamBadge\");\n            if (isTeam1) {\n                qTeamBadge.className = \"px-3 py-1 rounded-full text-xs font-black bg-blue-500/20 text-blue-300 border border-blue-500/40\";\n                qTeamBadge.innerText = \"فريق التميز\";\n            } else {\n                qTeamBadge.className = \"px-3 py-1 rounded-full text-xs font-black bg-emerald-500/20 text-emerald-300 border border-emerald-500/40\";\n                qTeamBadge.innerText = \"فريق التفوق\";\n            }\n\n            document.getElementById(\"qPointsBadge\").innerText = `${selectedSlice.label} (${selectedSlice.value} نقطة)`;\n            document.getElementById(\"qNumBadge\").innerText = `سؤال ${qIndex + 1} من 15`;\n            document.getElementById(\"questionText\").innerText = currentQ.q;\n\n            const grid = document.getElementById(\"optionsGrid\");\n            grid.innerHTML = \"\";\n\n            currentQ.options.forEach((opt, idx) => {\n                const btn = document.createElement(\"button\");\n                btn.className = \"text-right p-4 rounded-xl bg-slate-800/90 hover:bg-slate-700 border border-slate-700 font-bold text-sm text-slate-100 transition duration-150 flex items-center justify-between group cursor-pointer\";\n                btn.onclick = () => checkAnswer(btn, opt.correct, currentQ.exp, currentQ.options);\n                btn.innerHTML = `\n                    \u003cdiv class=\"flex items-center gap-3\">\n                        \u003cspan class=\"w-7 h-7 rounded-lg bg-amber-500/20 border border-amber-500/40 text-amber-300 flex items-center justify-center text-xs font-black\">${optionPrefixes[idx]}\u003c/span>\n                        \u003cspan>${opt.text}\u003c/span>\n                    \u003c/div>\n                    \u003ci class=\"fa-regular fa-circle text-slate-500 group-hover:text-amber-400\">\u003c/i>\n                `;\n                grid.appendChild(btn);\n            });\n\n            document.getElementById(\"feedbackPanel\").classList.add(\"hidden\");\n            document.getElementById(\"questionModal\").classList.remove(\"hidden\");\n        }\n\n        function checkAnswer(clickedBtn, isCorrect, explanation, optionsList) {\n            const grid = document.getElementById(\"optionsGrid\");\n            const buttons = grid.querySelectorAll(\"button\");\n\n            buttons.forEach((btn, idx) => {\n                btn.disabled = true;\n                const isThisOptCorrect = optionsList[idx].correct;\n\n                if (isThisOptCorrect) {\n                    btn.className = \"text-right p-4 rounded-xl bg-emerald-950/90 border-2 border-emerald-500 font-bold text-sm text-emerald-200 flex items-center justify-between\";\n                    btn.querySelector(\"i\").className = \"fa-solid fa-circle-check text-emerald-400 text-lg\";\n                } else if (btn === clickedBtn && !isCorrect) {\n                    btn.className = \"text-right p-4 rounded-xl bg-rose-950/90 border-2 border-rose-500 font-bold text-sm text-rose-200 flex items-center justify-between\";\n                    btn.querySelector(\"i\").className = \"fa-solid fa-circle-xmark text-rose-400 text-lg\";\n                }\n            });\n\n            if (isCorrect) {\n                playCorrectSound();\n                if (currentTurn === 1) team1Score += selectedSlice.value;\n                else team2Score += selectedSlice.value;\n            } else {\n                playWrongSound();\n            }\n\n            if (currentTurn === 1) team1Index++;\n            else team2Index++;\n\n            showFeedback(isCorrect, explanation);\n        }\n\n        function showFeedback(isCorrect, explanation) {\n            const panel = document.getElementById(\"feedbackPanel\");\n            const title = document.getElementById(\"feedbackTitle\");\n            const exp = document.getElementById(\"feedbackExplanation\");\n\n            panel.classList.remove(\"hidden\");\n\n            if (isCorrect) {\n                panel.className = \"p-4 rounded-2xl space-y-3 border bg-emerald-950/70 border-emerald-500/50 text-emerald-200\";\n                title.innerHTML = `\u003ci class=\"fa-solid fa-circle-check text-emerald-400 text-lg\">\u003c/i> إجابة صحيحة! التوجيه النحوي:`;\n            } else {\n                panel.className = \"p-4 rounded-2xl space-y-3 border bg-rose-950/70 border-rose-500/50 text-rose-200\";\n                title.innerHTML = `\u003ci class=\"fa-solid fa-circle-xmark text-rose-400 text-lg\">\u003c/i> إجابة غير دقيقة! التوجيه النحوي الصحيح:`;\n            }\n\n            exp.innerText = explanation;\n        }\n\n        function closeQuestionModal() {\n            document.getElementById(\"questionModal\").classList.add(\"hidden\");\n            currentTurn = (currentTurn === 1) ? 2 : 1;\n            updateUI();\n\n            if (team1Index >= 15 && team2Index >= 15) {\n                endGame();\n            }\n        }\n\n        function endGame() {\n            document.getElementById(\"victoryModal\").classList.remove(\"hidden\");\n\n            document.getElementById(\"vScore1\").innerText = `${team1Score}`;\n            document.getElementById(\"vScore2\").innerText = `${team2Score}`;\n\n            const winnerTitle = document.getElementById(\"winnerTitle\");\n            const winnerSub = document.getElementById(\"winnerSubtitle\");\n\n            if (team1Score > team2Score) {\n                winnerTitle.innerText = \"فريق التميز ينتصر باللقب! 🏆\";\n                winnerSub.innerText = \"إتقان استثنائي وتدقيق دقيق لأحكام ودقائق الأسماء الخمسة!\";\n            } else if (team2Score > team1Score) {\n                winnerTitle.innerText = \"فريق التفوق ينتصر باللقب! 🏆\";\n                winnerSub.innerText = \"تفوق باهر في تحديد حالات الإعراب بالحروف والحركات الظاهرة والمقدرة!\";\n            } else {\n                winnerTitle.innerText = \"تعادل نادِر بين العمالقة! 🤝\";\n                winnerSub.innerText = \"أظهر الفريقان تفوقاً استثنائياً في ضبط قواعد النحو المتقدمة.\";\n            }\n\n            if (typeof confetti === 'function') {\n                confetti({ particleCount: 250, spread: 120, origin: { y: 0.6 } });\n            }\n        }\n    \u003c/script>\n\u003c/body>\n\u003c/html>"},{"id":"zh7hf92","grade":0,"title":"عجلة الحظ التفاعلية - علامات الترقيم","desc":"","url":"","html":"\u003c!DOCTYPE html>\n\u003chtml lang=\"ar\" dir=\"rtl\">\n\u003chead>\n    \u003cmeta charset=\"UTF-8\">\n    \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    \u003ctitle>عَجَلَةُ الحَظِّ - عَلَامَاتُ التَّرْقِيمِ (الأستاذ أحمد عثمان)\u003c/title>\n    \u003c!-- Tailwind CSS -->\n    \u003cscript src=\"https://cdn.tailwindcss.com\">\u003c/script>\n    \u003c!-- FontAwesome Icons -->\n    \u003clink rel=\"stylesheet\" href=\"https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css\">\n    \u003c!-- Canvas Confetti -->\n    \u003cscript src=\"https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js\">\u003c/script>\n    \u003c!-- Google Font Cairo -->\n    \u003clink href=\"https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap\" rel=\"stylesheet\">\n    \n    \u003cstyle>\n        body {\n            font-family: 'Cairo', sans-serif;\n            background: radial-gradient(circle at center, #1e1b4b 0%, #0f172a 100%);\n            color: #f8fafc;\n            min-height: 100vh;\n            overflow-x: hidden;\n        }\n\n        /* الإضاءة والوهج الذهبي لمحل كلمة فتح */\n        .gold-glow {\n            box-shadow: 0 0 50px rgba(234, 179, 8, 0.6), inset 0 0 20px rgba(254, 240, 138, 0.5);\n            animation: pulse-glow 2s infinite alternate;\n        }\n\n        @keyframes pulse-glow {\n            0% {\n                box-shadow: 0 0 30px rgba(234, 179, 8, 0.4), inset 0 0 15px rgba(254, 240, 138, 0.3);\n                transform: scale(1);\n            }\n            100% {\n                box-shadow: 0 0 70px rgba(234, 179, 8, 0.8), inset 0 0 35px rgba(254, 240, 138, 0.7);\n                transform: scale(1.02);\n            }\n        }\n\n        .gold-text-glow {\n            text-shadow: 0 0 20px rgba(234, 179, 8, 0.9), 0 0 40px rgba(234, 179, 8, 0.5);\n        }\n\n        /* تحريك عجلة الحظ */\n        #wheel-canvas {\n            transition: transform 4s cubic-bezier(0.15, 0.99, 0.18, 1);\n        }\n\n        .wheel-pointer {\n            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5));\n        }\n    \u003c/style>\n\u003c/head>\n\u003cbody class=\"flex flex-col min-h-screen justify-between items-center p-2 sm:p-4\">\n\n    \u003c!-- 1. محل كلمة فتح المباشر (الشاشة الافتتاحية الضخمة) -->\n    \u003cdiv id=\"opening-gate\" class=\"fixed inset-0 z-50 flex flex-col items-center justify-center bg-slate-950/95 backdrop-blur-xl p-4 transition-all duration-700\">\n        \u003c!-- التوثيق والترويسة -->\n        \u003cdiv class=\"absolute top-4 w-full flex justify-between items-center px-6 text-sm sm:text-base font-bold text-amber-300 border-b border-amber-500/20 pb-3\">\n            \u003cdiv class=\"flex items-center gap-2\">\n                \u003ci class=\"fa-solid fa-user-pen text-amber-400\">\u003c/i>\n                \u003cspan>إِعْدَادُ: الأُسْتَاذِ أَحْمَد عُثْمَان\u003c/span>\n            \u003c/div>\n            \u003cdiv class=\"flex items-center gap-2 bg-amber-500/10 px-3 py-1 rounded-full border border-amber-500/30\">\n                \u003ci class=\"fa-solid fa-clock text-amber-400\">\u003c/i>\n                \u003cspan>الزَّمَنُ: مَفْتُوحٌ ♾️\u003c/span>\n            \u003c/div>\n        \u003c/div>\n\n        \u003c!-- مركز محل الفتح -->\n        \u003cdiv class=\"max-w-xl w-full text-center flex flex-col items-center mt-8\">\n            \u003cdiv class=\"inline-block mb-3 px-4 py-1.5 rounded-full bg-amber-500/20 border border-amber-400/40 text-amber-300 font-bold text-sm\">\n                🔥 الـمُسْتَوَى الأَصْعَبُ | عَلَامَاتُ التَّرْقِيمِ\n            \u003c/div>\n\n            \u003ch1 class=\"text-3xl sm:text-5xl font-black mb-6 text-white tracking-wide\">\n                عَجَلَةُ الحَظِّ النَّحْوِيَّةُ\n            \u003c/h1>\n\n            \u003c!-- بطاقة محل الفتح الضخمة والبارزة -->\n            \u003cdiv class=\"w-full bg-gradient-to-b from-slate-900 to-indigo-950 border-4 border-amber-500 rounded-3xl p-6 sm:p-8 gold-glow flex flex-col items-center gap-6 my-2 shadow-2xl relative overflow-hidden\">\n                \u003cdiv class=\"absolute -top-10 -right-10 w-32 h-32 bg-amber-500/10 rounded-full blur-2xl\">\u003c/div>\n                \n                \u003cdiv class=\"text-amber-400 text-sm font-extrabold tracking-widest uppercase\">\n                    📍 مَحَلُّ فَتْحِ اللَّعْبَةِ المُبَاشِرُ\n                \u003c/div>\n\n                \u003c!-- زر كلمة فتح البارز والعملاق -->\n                \u003cbutton id=\"open-game-btn\" onclick=\"openGame()\" class=\"w-full py-6 sm:py-8 bg-gradient-to-r from-amber-500 via-yellow-400 to-amber-600 hover:from-amber-400 hover:to-yellow-300 text-slate-950 font-black text-3xl sm:text-5xl rounded-2xl shadow-2xl flex flex-col items-center justify-center gap-3 transition-transform active:scale-95 cursor-pointer border-2 border-yellow-200\">\n                    \u003cdiv class=\"flex items-center gap-4 gold-text-glow\">\n                        \u003ci class=\"fa-solid fa-lock-open text-4xl sm:text-6xl animate-bounce\">\u003c/i>\n                        \u003cspan>فَتْح\u003c/span>\n                    \u003c/div>\n                    \u003cspan class=\"text-xs sm:text-sm font-extrabold tracking-normal text-slate-900 bg-yellow-300/80 px-4 py-1 rounded-full\">\n                        🔓 اضْغَطْ هُنَا لِـ فَتْحِ اللَّعْبَةِ وَابْدَأِ التَ
