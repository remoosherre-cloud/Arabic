function ghLoad(){try{const c=JSON.parse(ss.get('ao_gh')||ls.get('ao_gh')||'null');return c&&c.token&&c.owner&&c.repo?c:null}catch(e){return null}}
function ghForget(){ss.del('ao_gh');ls.del('ao_gh');remoteSha=undefined}
function ghGuess(){
  const h=location.hostname.toLowerCase(),parts=location.pathname.split('/').filter(Boolean);
  const file=parts.length&&/\.html?$/i.test(parts[parts.length-1])?parts.pop():'index.html';
  if(!h.endsWith('.github.io'))return {owner:'',repo:'',branch:'main',path:'index.html'};
  return {owner:h.split('.')[0],repo:parts[0]||h,branch:'main',path:file};
}
async function ghApi(c,url,opt){
  opt=opt||{};let r;
  try{r=await fetch('https://api.github.com/repos/'+encodeURIComponent(c.owner)+'/'+encodeURIComponent(c.repo)+url,{method:opt.method||'GET',body:opt.body,cache:'no-store',
    signal:window.AbortSignal&&AbortSignal.timeout?AbortSignal.timeout(120000):undefined,
    headers:{Authorization:'Bearer '+c.token,Accept:opt.accept||'application/vnd.github+json'}})}
  catch(e){throw {code:'offline'}}
  if(r.ok)return r;
  const s=r.status;
  throw {code:s===401?'auth':s===429||(s===403&&r.headers.get('x-ratelimit-remaining')==='0')?'rate_limited':s===403?'forbidden':s===404?'notfound':s===409?'conflict':s===422?'rejected':'other'};
}
const ghFile=c=>'/contents/'+c.path.split('/').map(encodeURIComponent).join('/');
async function ghHead(c){
  try{const r=await ghApi(c,ghFile(c)+'?ref='+encodeURIComponent(c.branch),{accept:'application/vnd.github.object+json'});return (await r.json()).sha}
  catch(e){if(e.code!=='notfound')throw e;await ghApi(c,'/branches/'+encodeURIComponent(c.branch));return null}
}
async function ghRead(c,sha){
  const text=await (await ghApi(c,'/git/blobs/'+sha,{accept:'application/vnd.github.raw+json'})).text();
  try{const el=new DOMParser().parseFromString(text,'text/html').getElementById('state');const o=JSON.parse(el.textContent);if(!Array.isArray(o.codes))throw 0;return el.textContent}
  catch(e){throw {code:'not_platform'}}
}
const canon=t=>{try{return JSON.stringify(JSON.parse(t))}catch(e){return t}};
function adopt(text){
  S=JSON.parse(text);S.settings=S.settings||{};S.codes=S.codes||[];S.games=S.games||[];S.live=S.live||[];
  $('#state').textContent=text;editG=null;editL=null;
}
async function ghSync(c){
  const sha=await ghHead(c);
  if(sha&&sha!==remoteSha)adopt(await ghRead(c,sha));
  remoteSha=sha;
}
function ghMsg(e){
  return ({offline:'تعذّر الاتصال بـ GitHub. تأكد من الإنترنت ثم أعد المحاولة.',
    auth:'مفتاح GitHub غير صحيح أو انتهت صلاحيته. أنشئ مفتاحًا جديدًا وأدخله في الإعدادات.',
    forbidden:'المفتاح لا يملك صلاحية التعديل. فعّل صلاحية Contents: Read and write لهذا المستودع.',
    notfound:'لم يُعثر على المستودع أو الفرع، أو أن المفتاح لا يملك صلاحية عليه. راجع بيانات النشر.',
    conflict:'نُشرت نسخة أحدث من جهاز آخر، فلم يتم النشر حتى لا تُمسح. اضغط «تحميل أحدث نسخة» ثم أعد تعديلك.',
    rejected:'رفض GitHub النشر. حمّل الصفحة من جديد وراجع بيانات النشر.',
    rate_limited:'تكررت الطلبات بسرعة. انتظر قليلًا ثم أعد المحاولة.',
    not_platform:'الملف الموجود في المستودع ليس ملف المنصة. راجع اسم الملف في الإعدادات.'})[e&&e.code]||'تعذّرت العملية. أعد المحاولة بعد قليل.';
}
const toB64=t=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(new Blob([t]))});
async function publishGH(){
  if(saving||syncing)return;
  const c=ghLoad();
  if(!c){tab='settings';ss.set('ao_tab',tab);render();toast('أدخل بيانات النشر ومفتاح GitHub أولًا.');return}
  saving=true;conflict=false;refreshBar();
  try{
    const sha=await ghHead(c);
    if(sha&&sha!==remoteSha&&canon(await ghRead(c,sha))!==canon($('#state').textContent))throw {code:'conflict'};
    const sent=rev,st=stateJSON();
    const body={message:'تحديث المنصة',content:await toB64(buildDoc(st)),branch:c.branch};
    if(sha)body.sha=sha;
    const r=await ghApi(c,ghFile(c),{method:'PUT',body:JSON.stringify(body)});
    remoteSha=(await r.json()).content.sha;
    $('#state').textContent=st;
    if(rev===sent){dirty=false;ls.del('ao_draft')}else saveDraft();
    toast('تم النشر. تظهر التغييرات للطلاب خلال دقائق.');
  }catch(e){conflict=!!e&&e.code==='conflict';toast(ghMsg(e))}
  saving=false;refreshBar();
}
async function ghReload(){
  const c=ghLoad();if(!c||saving||syncing)return;
  saving=true;refreshBar();
  try{
    const sha=await ghHead(c);if(!sha)throw {code:'notfound'};
    adopt(await ghRead(c,sha));remoteSha=sha;dirty=false;conflict=false;ls.del('ao_draft');ss.del('ao_new');
    saving=false;render();toast('حُمّلت أحدث نسخة منشورة.');
  }catch(e){saving=false;refreshBar();toast(ghMsg(e))}
}

async function ghSave(form){
  const val=id=>$('#'+id).value.trim(),old=ghLoad(),keep=$('#gh_keep').checked;
  const c={owner:val('gh_owner'),repo:val('gh_repo'),branch:val('gh_branch')||'main',path:val('gh_path').replace(/^\/+/,'')||'index.html',token:val('gh_token')||(old&&old.token)||''};

  try{
    const sha=await ghHead(c);
    const text=sha?await ghRead(c,sha):null;
    ghForget();(keep?ls:ss).set('ao_gh',JSON.stringify(c));
    if((keep?ls:ss).get('ao_gh')===null){btn.disabled=false;toast('هذا المتصفح يمنع حفظ المفتاح. جرّب خارج وضع التصفح الخاص.');return}
    if(!dirty){if(text)adopt(text);remoteSha=sha}
    conflict=false;rerenderKeepScroll();toast('تم الاتصال بالمستودع. يمكنك النشر من هذا الجهاز.');
  }catch(e){btn.disabled=false;toast(ghMsg(e))}
}
window.addEventListener('beforeunload',e=>{if(!inClaude&&dirty){e.preventDefault();e.returnValue=''}});

/* ---------- publish ---------- */
function stateJSON(){return JSON.stringify(S).replace(/</g,'\\u003c').replace(/\u2028/g,'\\u2028').replace(/\u2029/g,'\\u2029')}
function buildDoc(st){
  const css=$('#css').textContent,app=$('#app').textContent;
  const base=inClaude?RESET:(($('head style')||{}).textContent||RESET);
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+base+'</style></head><body>'
   +'<meta name="claude:viewport-fit-sides" content="cover"><title>منصة أستاذ أحمد عثمان للغة العربية</title>'+FONT_LINK
   +'<style id="css">'+css+'</style><div id="root" dir="rtl" lang="ar"></div>'
   +'<script type="application/json" id="state">'+st+'<\/script><script id="app">'+app+'<\/script></body></html>';
}
async function publish(){
  if(!inClaude)return publishGH();
  if(saving)return;
  if(!artifact){toast('النشر غير متاح في هذا العرض. افتح المنصة من حسابك على Claude.');return}
  saving=true;refreshBar();
  ss.set('ao_tab',tab);ss.set('ao_saved','1');ls.del('ao_draft');
  try{await artifact.publish(buildDoc(stateJSON()))}
  catch(e){
    saving=false;ss.del('ao_saved');
    if(dirty)saveDraft();
    const c=e&&e.code;
    if(c==='conflict')toast('نُشرت نسخة أحدث من الصفحة. سيُعاد التحميل، ثم أعد إدخال تعديلك.');
    else if(c==='not_writer'||c==='not_granted')toast('ليس لديك صلاحية تعديل هذه الصفحة. افتحها من حسابك.');
    else if(c==='too_large')toast('حجم الصفحة كبير جدًا. صغّر الشعار أو احذف بعض العناصر.');
    else if(c==='rate_limited')toast('تكرر النشر بسرعة. انتظر قليلًا ثم أعد المحاولة.');
    else toast('تعذّر النشر. أعد المحاولة بعد قليل.');
    refreshBar();
  }
}

/* ---------- login ---------- */
async function tryCode(raw,silent){
  const n=norm(raw);if(n.length<4)return {err:'اكتب كود الدخول كما أعطاك إياه الأستاذ.'};
  if(n==='1981'){ss.set('ao_adm',ADMIN_H);await enterAdmin();return {ok:true}}
  let h;try{h=await hashCode(n)}catch(e){return {err:'تعذّر التحقق من الكود في هذا المتصفح.'}}
  if(h===ADMIN_H){ss.set('ao_adm',h);await enterAdmin();return {ok:true}}
  const c=S.codes.find(x=>x.h===h);
  if(!c)return {err:'الكود غير صحيح. تأكد من كتابته كما وصلك.'};
  if(today()>c.until)return {err:'انتهى اشتراك هذا الكود بتاريخ '+fd(c.until)+'. تواصل مع الأستاذ لتجديد الاشتراك.',warn:true};
  session={h,name:c.name,grade:c.grade,until:c.until};
  ls.set('ao_h',h);view='student';liveKey='';render();return {ok:true};
}
async function restore(){
  if(ss.get('ao_adm')===ADMIN_H&&view==='gate'){await enterAdmin();if(ss.get('ao_saved')){ss.del('ao_saved');setTimeout(()=>toast('تم الحفظ والنشر. يرى الطلاب التغييرات الآن.'),300)}return}
  const h=ls.get('ao_h');if(!h)return;
  if(h.startsWith('open:')){ls.del('ao_h');return}
  const c=S.codes.find(x=>x.h===h);
  if(c&&today()<=c.until){session={h,name:c.name,grade:c.grade,until:c.until};if(view==='gate'){view='student';render()}}
  else ls.del('ao_h');
}

/* ---------- events ---------- */
root.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,id=b.dataset.id;
  if(a==='copy'){copy(b.dataset.text);return}
  if(a==='pickGrade'){const g=parseInt(id);session={name:'طالب',grade:g,until:null,open:true};ls.set('ao_h','open:'+g);view='student';liveKey='';render();return}
  if(a==='goAdmin'){view='admin';render();return}
  if(a==='goGate'){ss.del('ao_adm');view='gate';render();return}
  if(a==='logout'){
    if(session&&session.preview){session=null;view='admin';render();return}
    session=null;ls.del('ao_h');view='gate';render();return}
  if(a==='preview'){const g=parseInt($('#pv').value);_pv=g;session={name:'معاينة',grade:g,until:null,preview:true};view='student';liveKey='';render();return}
  if(a==='tab'){tab=id;ss.set('ao_tab',tab);editG=null;editL=null;render();return}
  if(a==='save'){publish();return}
  if(a==='ghReload'){if(!armed(b,'تأكيد: ستُهمل تعديلاتك'))return;ghReload();return}
  if(a==='ghForget'){if(!armed(b))return;ghForget();conflict=false;rerenderKeepScroll();toast('حُذف المفتاح من هذا الجهاز.');return}
  if(a==='playGame'){const x=S.games.find(g=>g.id===id);if(x&&x.html)openGame(x);return}
  if(a==='gEdit'){editG=id;rerenderKeepScroll();return}
  if(a==='gCancel'){editG=null;rerenderKeepScroll();return}
  if(a==='gDel'){if(!armed(b))return;S.games=S.games.filter(x=>x.id!==id);markDirty();rerenderKeepScroll();return}
  if(a==='lEdit'){editL=id;rerenderKeepScroll();return}
  if(a==='lCancel'){editL=null;rerenderKeepScroll();return}
  if(a==='lDel'){if(!armed(b))return;S.live=S.live.filter(x=>x.id!==id);markDirty();rerenderKeepScroll();return}
  if(a==='cDel'){if(!armed(b))return;S.codes=S.codes.filter(x=>x.h!==id);markDirty();rerenderKeepScroll();return}
  if(a==='cRenew'){const c=S.codes.find(x=>x.h===id);if(c){const base=c.until>today()?c.until:today();c.until=addDays(base,30);markDirty();rerenderKeepScroll();toast('جُدّد الاشتراك حتى '+fd(c.until))}return}
  if(a==='genCode'){pendingCode=genCode();$('#c_code').value=pendingCode;return}
  if(a==='dismissCodes'){ss.del('ao_new');rerenderKeepScroll();return}
  if(a==='logoClear'){S.settings.logo='';markDirty();rerenderKeepScroll();return}
});
root.addEventListener('submit',async e=>{
  e.preventDefault();const f=e.target.id;
  if(f==='loginForm'){
    const btn=e.target.querySelector('button'),msg=$('#loginMsg');btn.disabled=true;msg.textContent='';msg.classList.remove('warn');
    const r=await tryCode($('#code').value);
    if(!r.ok){btn.disabled=false;msg.textContent=r.err;if(r.warn)msg.classList.add('warn')}
    return}
  if(f==='ghForm'){await ghSave(e.target);return}
  if(f==='gForm'){
    const title=$('#g_title').value.trim(),raw=($('#g_url')||{value:''}).value.trim(),url=raw?(safeUrl(raw)||raw):'';
    const files=pendingFiles;pendingFiles=[];
    const pc=($('#g_code')||{value:''}).value.trim();if(pc)files.push({name:title||'لعبة جديدة',html:pc});
    const used=S.games.reduce((n,g)=>n+(g.html?g.html.length:0),0)+files.reduce((n,f)=>n+f.html.length,0);
    if(used>13*1024*1024){toast('حجم الألعاب المرفوعة كبير جدًا (أكثر من ١٣ ميغابايت). احذف لعبة قديمة أو صغّر الملف.');return}
    if(!files.length&&!title){toast('اختر ملف اللعبة أو الصق الكود أو اكتب اسمها');return}
    const base={grade:parseInt($('#g_grade').value),desc:$('#g_desc').value.trim(),url};
    if(editG){
      const g=S.games.find(x=>x.id===editG);
      Object.assign(g,base,{title:title||(files[0]&&files[0].name)||g.title});
      if(files[0])g.html=files[0].html;
      editG=null;
    }else if(files.length){
      files.forEach(f=>S.games.push(Object.assign({id:uid()},base,{title:(files.length===1&&title)?title:f.name,html:f.html})));
    }else S.games.push(Object.assign({id:uid()},base,{title}));
    markDirty();rerenderKeepScroll();toast(savedMsg('جارٍ حفظ اللعبة ونشرها للطلاب…'));return}
  if(f==='lForm'){
    const raw=$('#l_url').value.trim(),url=raw?safeUrl(raw):'',dur=parseInt($('#l_dur').value);
    if(raw&&!url){toast('الرابط غير صالح. يجب أن يبدأ بـ https://');return}
    if(!(dur>=5&&dur<=240)){toast('المدة بين ٥ و٢٤٠ دقيقة');return}
    const o={grade:parseInt($('#l_grade').value),day:parseInt($('#l_day').value),time:$('#l_time').value||'16:00',dur,title:$('#l_title').value.trim(),url};
    if(editL){Object.assign(S.live.find(x=>x.id===editL),o);editL=null}else S.live.push(Object.assign({id:uid()},o));
    markDirty();rerenderKeepScroll();toast(savedMsg('جارٍ حفظ الموعد ونشره للطلاب…'));return}
  if(f==='cForm'){
    const name=$('#c_name').value.trim(),until=$('#c_until').value,grade=parseInt($('#c_grade').value);
    if(!name||!until){toast('أكمل اسم الطالب وتاريخ الانتهاء');return}
    let code=pendingCode,h=await hashCode(code);
    while(S.codes.some(x=>x.h===h)){code=genCode();h=await hashCode(code)}
    S.codes.push({h,name,grade,until});
    let a=[];try{a=JSON.parse(ss.get('ao_new')||'[]')}catch(x){}
    a.unshift({code,name,grade,until});ss.set('ao_new',JSON.stringify(a.slice(0,30)));
    pendingCode=genCode();markDirty();render();toast(savedMsg('جارٍ حفظ الاشتراك. سيبقى الكود ظاهرًا أمامك بعد الحفظ.'));return}
});
root.addEventListener('input',e=>{
  const id=e.target.id;
  if(id==='s_notice'){S.settings.notice=e.target.value;markDirty(false)}
  else if(id==='s_fees'){S.settings.fees=e.target.value;markDirty(false)}
  else if(id==='s_contact'){S.settings.contact=e.target.value.trim();markDirty(false)}
  else if(id==='c_filter'){cFilter=e.target.value;const pos=e.target.selectionStart;rerenderKeepScroll();const n=$('#c_filter');if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(x){}}}
});
function readGameFiles(list){
  const arr=[...list];
  if(!arr.length){toast('لم يتم اختيار ملف.');return}
  const big=arr.find(f=>f.size>10*1024*1024);
  if(big){toast('الملف «'+big.name+'» أكبر من ١٠ ميغابايت.');return}
  Promise.all(arr.map(f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res({name:f.name.replace(/\.[^.]+$/,''),html:String(r.result)});r.onerror=rej;r.readAsText(f)})))
    .then(fs=>{
      fs=fs.filter(f=>/</.test(f.html));
      if(!fs.length){toast('الملف المختار ليس ملف لعبة HTML.');return}
      if(editG){pendingFiles=fs;const i=$('#g_fileinfo');if(i)i.textContent='تم اختيار الملف: '+fs[0].name+'. اضغط «حفظ التعديل».';return}
      const used=S.games.reduce((n,g)=>n+(g.html?g.html.length:0),0)+fs.reduce((n,f)=>n+f.html.length,0);
      if(used>13*1024*1024){toast('حجم الألعاب المرفوعة كبير جدًا. احذف لعبة قديمة أو صغّر الملف.');return}
      const gr=parseInt(($('#g_grade')||{value:0}).value)||0,ds=($('#g_desc')||{value:''}).value.trim();
      fs.forEach(f=>S.games.push({id:uid(),grade:gr,title:f.name,desc:ds,url:'',html:f.html}));
      markDirty();rerenderKeepScroll();toast(savedMsg('تمت إضافة '+fs.length+' لعبة. جارٍ حفظها ونشرها للطلاب…'));
    })
    .catch(()=>toast('تعذّرت قراءة الملف'));
}
root.addEventListener('dragover',e=>{const d=e.target.closest('#g_drop');if(d){e.preventDefault();d.classList.add('over')}});
root.addEventListener('dragleave',e=>{const d=e.target.closest('#g_drop');if(d)d.classList.remove('over')});
root.addEventListener('drop',e=>{const d=e.target.closest('#g_drop');if(d){e.preventDefault();d.classList.remove('over');readGameFiles(e.dataTransfer.files)}});
root.addEventListener('change',e=>{
  const id=e.target.id;
  if(id==='g_filter'){gFilter=e.target.value;rerenderKeepScroll()}
  if(id==='g_file'&&e.target.files&&e.target.files.length)readGameFiles(e.target.files);
  if(id==='pv')_pv=parseInt(e.target.value);
  if(id==='s_open'){S.settings.openCode=e.target.checked;markDirty()}
  if(id==='s_notice'||id==='s_fees'||id==='s_contact')markDirty()
  if(id==='s_logo'&&e.target.files&&e.target.files[0]){
    const file=e.target.files[0],url=URL.createObjectURL(file),img=new Image();
    img.onload=()=>{
      const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d');
      const s=Math.min(img.width,img.height);x.drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,256,256);
      try{S.settings.logo=c.toDataURL('image/png')}catch(err){toast('تعذّر قراءة الصورة');URL.revokeObjectURL(url);return}
      URL.revokeObjectURL(url);markDirty();rerenderKeepScroll();
    };
    img.onerror=()=>{URL.revokeObjectURL(url);toast('تعذّر قراءة الصورة')};
    img.src=url;
  }
});

/* ---------- boot ---------- */
render();
restore();
(async()=>{
  try{
    const c=window.claude;
    if(!c||!c.use)return;
    const [u,a]=await Promise.all([c.use('user'),c.use('artifact')]);
    artifact=a||null;refreshBar();
    isAdmin=u?await u.canEdit():false;

  }catch(e){}
})();
})();
