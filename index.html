ُ ثُلاَثِيٍّ.\",\n                    \"لِأَنَّهُ مَاضٍ رُبَاعِيٌّ.\",\n                    \"لِأَنَّهُ فِعْلٌ مَاضٍ ثُلاَثِيٌّ مَهْمُوزُ الفَاءِ.\"\n                ],\n                correct: 3, // د\n                explain: \"الفعل الماضي الثلاثي المبدوء بهمزة أصليّة «أَخَذَ» همزته همزة قطع.\"\n            },\n            {\n                q: \"مَا الكَلِمَةُ الَّتِي إِذَا كُتِبَتْ فِي البَسْمَلَةِ الكَامِلَةِ تُحْذَفُ هَمْزَتُهَا؟\",\n                options: [\n                    \"اسْمٌ فِي (بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ)\",\n                    \"ابْنٌ\",\n                    \"امرؤ\",\n                    \"اثنان\"\n                ],\n                correct: 0, // أ\n                explain: \"تُحذف همزة «اسم» خطاً في البسملة التامة الكريمة «بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ».\"\n            },\n            {\n                q: \"حَدِّدِ الكَلِمَةَ الَّتِي كُتِبَتْ فِيهَا الهَمْزَةُ خَطَأً فِيمَا يَلِي:\",\n                options: [\n                    \"أَحْمَدُ\",\n                    \"اِسْتِفْسَارٌ\",\n                    \"إِيمَانٌ\",\n                    \"اِتِّحَادٌ\"\n                ],\n                correct: 1, // ب\n                explain: \"إذا قُصد بالكلمة المصدر السداسي «اسْتِفْسَارٌ» فكتابتها بالكسرة السفلية «إِ» خطأ لأن مصدر السداسي وصل، أما إذا كُتبت بصورة القطع تكون خاطئة والوصل «اسْتِفْسَارٌ» هو الصواب.\"\n            },\n            {\n                q: \"مَا هِيَ الكَلِمَةُ الَّتِي تُكْتَبُ هَمْزَتُهَا قَطْعًا إِذَا سُمِّيَ بِهَا عَلَمٌ وَوَصْلاً إِذَا كَانَتْ مَصْدَرًا؟\",\n                options: [\n                    \"إِكْرَامٌ\",\n                    \"إِعْلاَنٌ\",\n                    \"انْتِصَارٌ (إِذَا صَارَتْ اسْمَ عَلَمٍ تُكْتَبُ: إِنتِصَار)\",\n                    \"اسْتِغْفَارٌ\"\n                ],\n                correct: 2, // ج\n                explain: \"المصادر الخماسية (مثل: ابتسام، انتصار) همزتها وصل، لكن إذا سُمي بها علم شخص تُحوّل همزتها إلى قطع تفريقاً (مثل: إِبْتِسَام، إِنتِصَار).\"\n            },\n            {\n                q: \"أيُّ ممَّا يَلِي يُعَدُّ مِنْ مواضع همزة القطع فِي الأَفْعَالِ؟\",\n                options: [\n                    \"أَمْرُ الفِعْلِ الثُّلاَثِيِّ.\",\n                    \"مَاضِي الفِعْلِ الخُمَاسِيِّ.\",\n                    \"أَمْرُ الفِعْلِ السُّدَاسِيِّ.\",\n                    \"مَاضِي الفِعْلِ الرُّبَاعِيِّ وَأَمْرُهُ وَمَصْدَرُهُ.\"\n                ],\n                correct: 3, // د\n                explain: \"الفعل الرباعي بكافة حالاته (ماضيه، أمره، ومصدره) تكون همزته قطعاً.\"\n            },\n            {\n                q: \"تُكْتَبُ كَلِمَةُ «اثْنَتَانِ» بِهَمْزَةِ وَصْلٍ لِأَنَّهَا:\",\n                options: [\n                    \"مِنَ الأَسْمَاءِ السَّمَاعِيَّةِ المَخْصُوصَةِ.\",\n                    \"مصدر خماسي.\",\n                    \"فعل أمر.\",\n                    \"حرف مبني.\"\n                ],\n                correct: 0, // أ\n                explain: \"«اثنان واثنتان» من الأسماء السماعية العشرة المحفوظة عن العرب بصل الهمزة.\"\n            },\n            {\n                q: \"عِنْدَ مِلْءِ الفَرَاغِ فِي «(...) عَبْدُ اللَّهِ الرَّجُلَ الفَقِيرَ»، الخِيَارُ الإِمْلاَئِيُّ الصَّحِيحُ هُوَ:\",\n                options: [\n                    \"أَعْطَى\",\n                    \"اَعْطَى\",\n                    \"إِعْطَاءً\",\n                    \"اُعْطِيَ\"\n                ],\n                correct: 0, // أ\n                explain: \"«أَعْطَى» ماضٍ رباعي، وهمزة الماضي الرباعي همزة قطع مفتوحة تُكتب فوق الألف.\"\n            }\n        ];\n\n        /* === 2. المتغيرات والمنطق للعبة === */\n        let currentQuestionIndex = 0;\n        let currentTeam = 1; // 1: التميز (Blue), 2: التفوق (Green)\n        let team1Score = 0;\n        let team2Score = 0;\n        let isSpinning = false;\n        let audioCtx = null;\n\n        // الألوان للعجلة\n        const wheelColors = [\n            '#f59e0b', '#3b82f6', '#10b981', '#ec4899', \n            '#8b5cf6', '#06b6d4', '#f97316', '#84cc16'\n        ];\n\n        // تهيئة محرك الصوت المدمج Web Audio API\n        function initAudio() {\n            if (!audioCtx) {\n                audioCtx = new (window.AudioContext || window.webkitAudioContext)();\n            }\n        }\n\n        function playSound(type) {\n            try {\n                initAudio();\n                if (!audioCtx) return;\n                \n                const osc = audioCtx.createOscillator();\n                const gain = audioCtx.createGain();\n                osc.connect(gain);\n                gain.connect(audioCtx.destination);\n\n                if (type === 'tick') {\n                    osc.frequency.setValueAtTime(600, audioCtx.currentTime);\n                    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);\n                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);\n                    osc.start();\n                    osc.stop(audioCtx.currentTime + 0.05);\n                } else if (type === 'correct') {\n                    osc.frequency.setValueAtTime(400, audioCtx.currentTime);\n                    osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.3);\n                    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);\n                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);\n                    osc.start();\n                    osc.stop(audioCtx.currentTime + 0.3);\n                } else if (type === 'wrong') {\n                    osc.type = 'sawtooth';\n                    osc.frequency.setValueAtTime(200, audioCtx.currentTime);\n                    osc.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 0.3);\n                    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);\n                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);\n                    osc.start();\n                    osc.stop(audioCtx.currentTime + 0.3);\n                }\n            } catch (e) {\n                console.log(\"Audio not allowed yet\");\n            }\n        }\n\n        /* === 3. رسم عجلة الحظ على Canvas === */\n        const canvas = document.getElementById('wheel-canvas');\n        const ctx = canvas.getContext('2d');\n        const numSlices = 8;\n        const sliceAngle = (2 * Math.PI) / numSlices;\n\n        function drawWheel() {\n            const centerX = canvas.width / 2;\n            const centerY = canvas.height / 2;\n            const radius = canvas.width / 2 - 10;\n\n            ctx.clearRect(0, 0, canvas.width, canvas.height);\n\n            for (let i = 0; i \u003c numSlices; i++) {\n                const angle = i * sliceAngle;\n                \n                // رسم القطاع\n                ctx.beginPath();\n                ctx.moveTo(centerX, centerY);\n                ctx.arc(centerX, centerY, radius, angle, angle + sliceAngle);\n                ctx.closePath();\n                ctx.fillStyle = wheelColors[i % wheelColors.length];\n                ctx.fill();\n                ctx.lineWidth = 3;\n                ctx.strokeStyle = '#0f172a';\n                ctx.stroke();\n\n                // كتابة رقم القطاع\n                ctx.save();\n                ctx.translate(centerX, centerY);\n                ctx.rotate(angle + sliceAngle / 2);\n                ctx.textAlign = \"right\";\n                ctx.fillStyle = \"#ffffff\";\n                ctx.font = \"bold 20px Cairo\";\n                ctx.fillText(\"سُؤَال \" + (i + 1), radius - 25, 7);\n                ctx.restore();\n            }\n\n            // المركز\n            ctx.beginPath();\n            ctx.arc(centerX, centerY, 35, 0, 2 * Math.PI);\n            ctx.fillStyle = '#0f172a';\n            ctx.fill();\n            ctx.lineWidth = 4;\n            ctx.strokeStyle = '#f59e0b';\n            ctx.stroke();\n\n            ctx.fillStyle = '#f59e0b';\n            ctx.font = \"bold 16px Cairo\";\n            ctx.textAlign = \"center\";\n            ctx.fillText(\"🎯\", centerX, centerY + 6);\n        }\n\n        // رسم العجلة فور التحميل\n        drawWheel();\n\n        /* === 4. الفتح المباشر ومشاركة الرابط === */\n        function openGame() {\n            playSound('correct');\n            const gate = document.getElementById('opening-gate');\n            gate.classList.add('opacity-0', 'pointer-events-none');\n            setTimeout(() => {\n                gate.style.display = 'none';\n            }, 700);\n        }\n\n        function copyGameLink() {\n            const dummy = document.createElement('input');\n            document.body.appendChild(dummy);\n            dummy.value = window.location.href;\n            dummy.select();\n            document.execCommand('copy');\n            document.body.removeChild(dummy);\n\n            const toast = document.getElementById('copy-toast');\n            if (toast) {\n                toast.classList.remove('hidden');\n                setTimeout(() => {\n                    toast.classList.add('hidden');\n                }, 3500);\n            }\n        }\n\n        /* === 5. تدوير العجلة === */\n        let currentRotation = 0;\n        function spinWheel() {\n            if (isSpinning) return;\n            initAudio();\n\n            isSpinning = true;\n            document.getElementById('spin-btn').disabled = true;\n\n            const randomRounds = 5 + Math.floor(Math.random() * 5);\n            const randomDegree = Math.floor(Math.random() * 360);\n            currentRotation += (randomRounds * 360) + randomDegree;\n\n            canvas.style.transform = `rotate(${currentRotation}deg)`;\n\n            let tickInterval = setInterval(() => {\n                playSound('tick');\n            }, 150);\n\n            setTimeout(() => {\n                clearInterval(tickInterval);\n                isSpinning = false;\n                document.getElementById('spin-btn').disabled = false;\n                \n                showQuestionModal();\n            }, 4000);\n        }\n\n        /* === 6. عرض إدارة الأسئلة والنظام === */\n        function showQuestionModal() {\n            if (currentQuestionIndex >= questionsData.length) {\n                showFinalWinner();\n                return;\n            }\n\n            const qData = questionsData[currentQuestionIndex];\n            const modal = document.getElementById('question-modal');\n            const qText = document.getElementById('question-text');\n            const optionsContainer = document.getElementById('options-container');\n            const teamBadge = document.getElementById('current-team-badge');\n            const qBadge = document.getElementById('question-number-badge');\n            const feedbackBox = document.getElementById('feedback-box');\n            const nextBtn = document.getElementById('next-btn');\n\n            feedbackBox.classList.add('hidden');\n            nextBtn.classList.add('hidden');\n\n            if (currentTeam === 1) {\n                teamBadge.className = \"px-4 py-1.5 rounded-full text-xs font-black bg-blue-500/20 text-blue-300 border border-blue-500/40\";\n                teamBadge.innerHTML = \"🔵 فَرِيقُ التَّمَيُّزِ (دَوْرُكُمْ)\";\n            } else {\n                teamBadge.className = \"px-4 py-1.5 rounded-full text-xs font-black bg-emerald-500/20 text-emerald-300 border border-emerald-500/40\";\n                teamBadge.innerHTML = \"🟢 فَرِيقُ التَّفَوُّقِ (دَوْرُكُمْ)\";\n            }\n\n            qBadge.innerText = `السُّؤَالُ (${currentQuestionIndex + 1} / ${questionsData.length})`;\n            qText.innerText = qData.q;\n\n            const optionLabels = [\"أ\", \"ب\", \"ج\", \"د\"];\n            optionsContainer.innerHTML = '';\n\n            qData.options.forEach((optText, idx) => {\n                const btn = document.createElement('button');\n                btn.className = \"w-full p-4 rounded-xl bg-slate-800/80 hover:bg-slate-700/90 border border-slate-700 text-right font-bold text-sm sm:text-base text-slate-100 flex items-center gap-3 transition-all cursor-pointer active:scale-98\";\n                btn.innerHTML = `\n                    \u003cspan class=\"w-8 h-8 rounded-lg bg-amber-500/20 border border-amber-500/40 text-amber-400 flex items-center justify-center text-xs font-black\">${optionLabels[idx]}\u003c/span>\n                    \u003cspan>${optText}\u003c/span>\n                `;\n                btn.onclick = () => checkAnswer(idx, btn);\n                optionsContainer.appendChild(btn);\n            });\n\n            modal.classList.remove('hidden');\n        }\n\n        /* === 7. التحقق من الإجابة والتغذية الراجعة المجردة === */\n        function checkAnswer(selectedIndex, clickedBtn) {\n            const qData = questionsData[currentQuestionIndex];\n            const optionsContainer = document.getElementById('options-container');\n            const buttons = optionsContainer.getElementsByTagName('button');\n            const feedbackBox = document.getElementById('feedback-box');\n            const feedbackTitle = document.getElementById('feedback-title');\n            const feedbackExplanation = document.getElementById('feedback-explanation');\n            const nextBtn = document.getElementById('next-btn');\n\n            for (let btn of buttons) {\n                btn.disabled = true;\n                btn.classList.add('opacity-60', 'cursor-not-allowed');\n            }\n\n            const isCorrect = (selectedIndex === qData.correct);\n\n            if (isCorrect) {\n                playSound('correct');\n                clickedBtn.classList.remove('bg-slate-800/80', 'border-slate-700');\n                clickedBtn.classList.add('bg-emerald-950/80', 'border-emerald-500', 'text-emerald-200');\n\n                if (currentTeam === 1) team1Score += 10;\n                else team2Score += 10;\n                updateScores();\n\n                feedbackBox.className = \"p-4 rounded-xl text-right font-bold text-sm sm:text-base border border-emerald-500/50 bg-emerald-950/40 text-emerald-300 block\";\n                feedbackTitle.innerHTML = \"✅ إِجَابَةٌ صَحِيحَةٌ! (+10 نُقَاطٍ)\";\n            } else {\n                playSound('wrong');\n                clickedBtn.classList.remove('bg-slate-800/80', 'border-slate-700');\n                clickedBtn.classList.add('bg-rose-950/80', 'border-rose-500', 'text-rose-200');\n\n                buttons[qData.correct].classList.remove('opacity-60');\n                buttons[qData.correct].classList.add('bg-emerald-950/60', 'border-emerald-500/80', 'text-emerald-200');\n\n                feedbackBox.className = \"p-4 rounded-xl text-right font-bold text-sm sm:text-base border border-rose-500/50 bg-rose-950/40 text-rose-300 block\";\n                feedbackTitle.innerHTML = \"❌ إِجَابَةٌ غَيْرُ صَحِيحَةٍ\";\n            }\n\n            feedbackExplanation.innerText = \"التَّعْلِيلُ القَوَاعِدِيُّ: \" + qData.explain;\n            nextBtn.classList.remove('hidden');\n        }\n\n        function closeQuestionModal() {\n            document.getElementById('question-modal').classList.add('hidden');\n            \n            currentQuestionIndex++;\n            currentTeam = (currentTeam === 1) ? 2 : 1;\n            updateTeamCardsUI();\n\n            if (currentQuestionIndex >= questionsData.length) {\n                showFinalWinner();\n            }\n        }\n\n        function updateScores() {\n            document.getElementById('team1-score').innerText = team1Score;\n            document.getElementById('team2-score').innerText = team2Score;\n        }\n\n        function updateTeamCardsUI() {\n            const card1 = document.getElementById('team1-card');\n            const card2 = document.getElementById('team2-card');\n            const ind1 = document.getElementById('team1-turn-indicator');\n            const ind2 = document.getElementById('team2-turn-indicator');\n\n            if (currentTeam === 1) {\n                card1.classList.remove('opacity-60');\n                card1.classList.add('border-blue-500/50');\n                ind1.innerText = \"الدَّوْرُ الحَالِيّ\";\n\n                card2.classList.add('opacity-60');\n                card2.classList.remove('border-emerald-500/50');\n                ind2.innerText = \"في الانتظار\";\n            } else {\n                card2.classList.remove('opacity-60');\n                card2.classList.add('border-emerald-500/50');\n                ind2.innerText = \"الدَّوْرُ الحَالِيّ\";\n\n                card1.classList.add('opacity-60');\n                card1.classList.remove('border-blue-500/50');\n                ind1.innerText = \"في الانتظار\";\n            }\n        }\n\n        function showFinalWinner() {\n            confetti({\n                particleCount: 150,\n                spread: 80,\n                origin: { y: 0.6 }\n            });\n\n            let winnerText = \"\";\n            if (team1Score > team2Score) {\n                winnerText = \"🎉 الفَائِزُ هُوَ: فَرِيقُ التَّمَيُّزِ 🔵!\";\n            } else if (team2Score > team1Score) {\n                winnerText = \"🎉 الفَائِزُ هُوَ: فَرِيقُ التَّفَوُّقِ 🟢!\";\n            } else {\n                winnerText = \"🤝 تَعَادُلٌ بَطَلٌ بَيْنَ الفَرِيقَيْنِ!\";\n            }\n\n            const modal = document.getElementById('question-modal');\n            const qText = document.getElementById('question-text');\n            const optionsContainer = document.getElementById('options-container');\n            const feedbackBox = document.getElementById('feedback-box');\n            const nextBtn = document.getElementById('next-btn');\n\n            document.getElementById('current-team-badge').innerText = \"🏆 نِهَايَةُ المَسَابَقَةِ\";\n            document.getElementById('question-number-badge').innerText = \"اِكْتِمَالُ الـ 30 سُؤَالاً\";\n            \n            qText.innerHTML = `\u003cdiv class=\"text-center text-3xl font-black text-amber-400 py-4\">${winnerText}\u003c/div>`;\n            optionsContainer.innerHTML = `\n                \u003cdiv class=\"text-center font-bold text-slate-300 space-y-2 py-4\">\n                    \u003cp class=\"text-xl\">🔵 نقاط فريق التميز: ${team1Score}\u003c/p>\n                    \u003cp class=\"text-xl\">🟢 نقاط فريق التفوق: ${team2Score}\u003c/p>\n                \u003c/div>\n            `;\n            feedbackBox.classList.add('hidden');\n            nextBtn.innerText = \"🔄 إِعَادَةُ المَسَابَقَةِ مِنْ الجَدِيدِ\";\n            nextBtn.onclick = () => location.reload();\n            nextBtn.classList.remove('hidden');\n\n            modal.classList.remove('hidden');\n        }\n\n        function resetGame() {\n            if (confirm(\"هل ترغب في إعادة المسابقة وتصفير النقاط؟\")) {\n                location.reload();\n            }\n        }\n    \u003c/script>\n\u003c/body>\n\u003c/html>"},{"id":"kmmok7z","grade":0,"title":"quiz_damaaer_alraf3_almunfasila","desc":"","url":"","html":"\u003c!DOCTYPE html>\n\u003chtml lang=\"ar\" dir=\"rtl\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003ctitle>اختبار ضمائر الرفع المنفصلة\u003c/title>\n\u003cstyle>\n*{box-sizing:border-box}body{font-family:Tahoma,Arial,sans-serif;background:#f3f6fb;color:#172033;margin:0;padding:20px;line-height:1.8}\n.container{max-width:780px;margin:auto;background:white;padding:24px;border-radius:18px;box-shadow:0 8px 28px #14213d14}\nh1{text-align:center;color:#174a7e;font-size:26px;margin:0 0 8px}.sub{text-align:center;color:#5b6472;margin-bottom:22px}\n.progress{background:#e8edf4;border-radius:20px;height:10px;overflow:hidden;margin:12px 0 22px}.bar{height:100%;width:0;background:#16845b;transition:.2s}\n.q{border:1px solid #e2e8f0;border-radius:13px;padding:15px;margin:14px 0}.q h3{margin:0 0 10px;font-size:18px}.opts{display:flex;gap:10px;flex-wrap:wrap}\nlabel{border:1px solid #d8e0ea;padding:7px 14px;border-radius:10px;cursor:pointer}label:has(input:checked){background:#eaf3ff;border-color:#3279bd}\ninput{accent-color:#1769aa}button{border:0;border-radius:11px;padding:12px 22px;font-size:16px;cursor:pointer;background:#1769aa;color:white;margin-top:16px;width:100%}\nbutton:disabled{opacity:.45;cursor:not-allowed}#result{display:none;margin-top:20px;padding:18px;border-radius:12px;background:#eef8f2;text-align:center;font-size:20px;font-weight:bold}\n.correct{color:#087443}.wrong{color:#b42318}.feedback{font-size:14px;font-weight:bold;margin-top:8px}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"container\">\n\u003ch1>اختبار ضمائر الرفع المنفصلة\u003c/h1>\n\u003cdiv class=\"sub\">اختر الضمير المناسب لإكمال كل جملة\u003c/div>\n\u003cdiv id=\"count\">تمت الإجابة عن 0 من 20 سؤالًا\u003c/div>\n\u003cdiv class=\"progress\">\u003cdiv class=\"bar\" id=\"bar\">\u003c/div>\u003c/div>\n\u003cform id=\"quiz\">\u003c/form>\n\u003cbutton id=\"submit\" type=\"button\" disabled>إنهاء الاختبار وعرض النتيجة\u003c/button>\n\u003cdiv id=\"result\">\u003c/div>\n\u003c/div>\n\u003cscript>\nconst data = [\n[\"..... أحبُّ العلمَ.\",[\"أنا\",\"نحن\",\"أنتَ\"],0],\n[\"..... نلعبُ في الحديقةِ.\",[\"هو\",\"نحن\",\"هي\"],1],\n[\"..... تكتبينَ الدرسَ يا فاطمةُ.\",[\"أنتِ\",\"أنتَ\",\"أنا\"],0],\n[\"..... يحافظُ على النظافةِ.\",[\"هي\",\"هو\",\"هم\"],1],\n[\"..... مجتهدةٌ في دراستها.\",[\"هو\",\"أنا\",\"هي\"],2],\n[\"..... نحبُّ وطنَنا.\",[\"أنتم\",\"نحن\",\"هما\"],1],\n[\"..... تقرأُ القرآنَ يا محمدُ.\",[\"أنتَ\",\"أنتِ\",\"هي\"],0],\n[\"..... تلميذانِ متفوقانِ.\",[\"هما\",\"هم\",\"هنَّ\"],0],\n[\"..... يلعبونَ بالكرةِ.\",[\"هو\",\"هم\",\"نحن\"],1],\n[\"..... معلمتانِ مخلصتانِ.\",[\"هما\",\"هنَّ\",\"هم\"],0],\n[\"..... أساعدُ أمي في المنزلِ.\",[\"أنا\",\"أنتَ\",\"هو\"],0],\n[\"..... تحافظونَ على الصلاةِ.\",[\"أنتم\",\"أنتنَّ\",\"نحن\"],0],\n[\"..... تذهبينَ إلى المدرسةِ.\",[\"أنتِ\",\"أنتَ\",\"هو\"],0],\n[\"..... طبيبٌ ماهرٌ.\",[\"هي\",\"هو\",\"أنا\"],1],\n[\"..... طالباتٌ مجتهداتٌ.\",[\"هم\",\"هما\",\"هنَّ\"],2],\n[\"..... نزرعُ الأشجارَ.\",[\"نحن\",\"أنا\",\"أنتَ\"],0],\n[\"..... تدرسانِ بجدٍّ.\",[\"أنتما\",\"أنتم\",\"أنتِ\"],0],\n[\"..... يشاركونَ في المسابقةِ.\",[\"هم\",\"هنَّ\",\"هما\"],0],\n[\"..... أقرأُ كتابًا مفيدًا.\",[\"نحن\",\"أنا\",\"هي\"],1],\n[\"..... تحبانِ الخيرَ.\",[\"أنتما\",\"أنتم\",\"أنتِ\"],0]\n];\nconst form=document.getElementById('quiz');\ndata.forEach((q,i)=>{\n const div=document.createElement('section');div.className='q';div.id='q'+i;\n div.innerHTML=`\u003ch3>السؤال ${i+1}: ${q[0]}\u003c/h3>\u003cdiv class=\"opts\">${q[1].map((v,j)=>`\u003clabel>\u003cinput type=\"radio\" name=\"q${i}\" value=\"${j}\"> ${v}\u003c/label>`).join('')}\u003c/div>\u003cdiv class=\"feedback\" aria-live=\"polite\">\u003c/div>`;\n form.appendChild(div);\n});\nconst submit=document.getElementById('submit'),bar=document.getElementById('bar'),count=document.getElementById('count');\nform.addEventListener('change',()=>{\n const n=data.filter((_,i)=>form.querySelector(`input[name=q${i}]:checked`)).length;\n count.textContent=`تمت الإجابة عن ${n} من 20 سؤالًا`;bar.style.width=(n/20*100)+'%';submit.disabled=n!==20;\n});\nsubmit.addEventListener('click',()=>{\n let score=0;\n data.forEach((q,i)=>{\n  const selected=form.querySelector(`input[name=q${i}]:checked`);\n  const feedback=document.querySelector(`#q${i} .feedback`);\n  form.querySelectorAll(`input[name=q${i}]`).forEach(x=>x.disabled=true);\n  if(Number(selected.value)===q[2]){score++;feedback.textContent='✓ إجابة صحيحة';feedback.className='feedback correct';}\n  else{feedback.textContent='✗ الإجابة الصحيحة: '+q[1][q[2]];feedback.className='feedback wrong';}\n });\n const result=document.getElementById('result');result.style.display='block';\n result.textContent=`نتيجتك: ${score} من 20`;\n submit.style.display='none';\n result.scrollIntoView({behavior:'smooth'});\n});\n\u003c/script>\n\u003c/body>\n\u003c/html>"},{"id":"4xrjpt5","grade":0,"title":"عجلة الحظ التفاعلية - نائب الفاعل","desc":"","url":"","html":"\u003c!DOCTYPE html>\n\u003chtml lang=\"ar\" dir=\"rtl\">\n\u003chead>\n    \u003cmeta charset=\"UTF-8\">\n    \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    \u003ctitle>عَجَلَةُ الحَظِّ - نَائِبُ الفَاعِلِ (الأُسْتَاذُ أَحْمَد عُثْمَان)\u003c/title>\n    \u003c!-- Tailwind CSS -->\n    \u003cscript src=\"https://cdn.tailwindcss.com\">\u003c/script>\n    \u003c!-- FontAwesome Icons -->\n    \u003clink rel=\"stylesheet\" href=\"https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css\">\n    \u003c!-- Canvas Confetti -->\n    \u003cscript src=\"https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js\">\u003c/script>\n    \u003c!-- Google Font Cairo -->\n    \u003clink href=\"https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap\" rel=\"stylesheet\">\n    \n    \u003cstyle>\n        body {\n            font-family: 'Cairo', sans-serif;\n            background: radial-gradient(circle at center, #0f172a 0%, #020617 100%);\n            color: #f8fafc;\n            min-height: 100vh;\n            overflow-x: hidden;\n        }\n\n        /* الإضاءة والوهج الذهبي لـ محل كلمة فتح */\n        .gold-glow {\n            box-shadow: 0 0 60px rgba(234, 179, 8, 0.65), inset 0 0 25px rgba(254, 240, 138, 0.5);\n            animation: pulse-glow 2s infinite alternate;\n        }\n\n        @keyframes pulse-glow {\n            0% {\n                box-shadow: 0 0 35px rgba(234, 179, 8, 0.45), inset 0 0 15px rgba(254, 240, 138, 0.3);\n                transform: scale(1);\n            }\n            100% {\n                box-shadow: 0 0 80px rgba(234, 179, 8, 0.85), inset 0 0 40px rgba(254, 240, 138, 0.7);\n                transform: scale(1.02);\n            }\n        }\n\n        .gold-text-glow {\n            text-shadow: 0 0 25px rgba(234, 179, 8, 0.9), 0 0 45px rgba(234, 179, 8, 0.6);\n        }\n\n        /* تحريك عجلة الحظ */\n        #wheel-canvas {\n            transition: transform 4s cubic-bezier(0.15, 0.99, 0.18, 1);\n        }\n\n        .wheel-pointer {\n            filter: drop-shadow(0 6px 8px rgba(0,0,0,0.6));\n        }\n\n        .custom-scrollbar::-webkit-scrollbar {\n            width: 8px;\n        }\n        .custom-scrollbar::-webkit-scrollbar-thumb {\n            background: #475569;\n            border-radius: 9999px;\n        }\n    \u003c/style>\n\u003c/head>\n\u003cbody class=\"flex flex-col min-h-screen justify-between items-center p-2 sm:p-4\">\n\n    \u003c!-- 1. مَحَلُّ كَلِمَةِ فَتْح (الشاشة الافتتاحية المركزية الضخمة) -->\n    \u003cdiv id=\"opening-gate\" class=\"fixed inset-0 z-50 flex flex-col items-center justify-center bg-slate-950/95 backdrop-blur-xl p-4 transition-all duration-700\">\n        \u003c!-- التوثيق والترويسة -->\n        \u003cdiv class=\"absolute top-4 w-full flex justify-between items-center px-6 text-sm sm:text-xl font-black text-amber-300 border-b border-amber-500/20 pb-3\">\n            \u003cdiv class=\"flex items-center gap-2\">\n                \u003ci class=\"fa-solid fa-user-pen text-amber-400\">\u003c/i>\n                \u003cspan>إِعْدَادُ: الأُسْتَاذِ أَحْمَد عُثْمَان\u003c/span>\n            \u003c/div>\n            \u003cdiv class=\"flex items-center gap-2 bg-amber-500/10 px-4 py-1.5 rounded-full border border-amber-500/30\">\n                \u003ci class=\"fa-solid fa-clock text-amber-400\">\u003c/i>\n                \u003cspan>الزَّمَنُ: مَفْتُوحٌ ♾️\u003c/span>\n            \u003c/div>\n        \u003c/div>\n\n        \u003c!-- مركز محل الفتح -->\n        \u003cdiv class=\"max-w-2xl w-full text-center flex flex-col items-center mt-6\">\n            \u003cdiv class=\"inline-block mb-3 px-5 py-2 rounded-full bg-emerald-500/20 border border-emerald-400/40 text-emerald-300 font-black text-sm sm:text-base\">\n                🔥 الـمُسْتَوَى الأَصْعَبُ | نَائِبُ الفَاعِلِ\n            \u003c/div>\n\n            \u003ch1 class=\"text-4xl sm:text-6xl font-black mb-6 text-white tracking-wide\">\n                عَجَلَةُ الحَظِّ النَّحْوِيَّةُ\n            \u003c/h1>\n\n            \u003c!-- بطاقة محل الفتح الضخمة والبارزة -->\n            \u003cdiv class=\"w-full bg-gradient-to-b from-slate-900 via-indigo-950 to-slate-900 border-4 border-amber-500 rounded-3xl p-6 sm:p-10 gold-glow flex flex-col items-center gap-6 my-2 shadow-2xl relative overflow-hidden\">\n                \u003cdiv class=\"absolute -top-10 -right-10 w-40 h-40 bg-amber-500/10 rounded-full blur-2xl\">\u003c/div>\n                \n                \u003cdiv class=\"text-amber-400 text-sm sm:text-base font-black tracking-widest uppercase\">\n                    📍 مَحَلُّ فَتْحِ اللَّعْبَةِ المُبَاشِرُ\n                \u003c/div>\n\n                \u003c!-- زر كلمة فتح العملاق والبارز -->\n                \u003cbutton id=\"open-game-btn\" onclick=\"openGame()\" class=\"w-full py-8 sm:py-10 bg-gradient-to-r from-amber-500 via-yellow-400 to-amber-600 hover:from-amber-400 hover:to-yellow-300 text-slate-950 font-black rounded-2xl shadow-2xl flex flex-col items-center justify-center gap-3 transition-transform active:scale-95 cursor-pointer border-4 border-yellow-200\">\n                    \u003cdiv class=\"flex items-center gap-4 gold-text-glow text-4xl sm:text-6xl\">\n                        \u003ci class=\"fa-solid fa-lock-open text-5xl sm:text-7xl animate-bounce\">\u003c/i>\n                        \u003cspan>فَتْح\u003c/span>\n                    \u003c/div>\n                    \u003cspan class=\"text-sm sm:text-lg font-black tracking-normal text-slate-950 bg-yellow-300/90 px-6 py-1.5 rounded-full mt-2 shadow-inner\">\n                        🔓 اضْغَطْ هُنَا لِـ فَتْحِ اللَّعْبَةِ وَابْدَأِ التَّحَدِّيَ\n                    \u003c/span>\n                \u003c/button>\n\n                \u003c!-- قسم نسخ رابط/كود الفتح للطلاب -->\n                \u003cdiv class=\"w-full pt-4 border-t border-slate-700/60 flex flex-col gap-2\">\n                    \u003cspan class=\"text-xs sm:text-sm text-slate-300 font-extrabold\">لِمَشَارَكَةِ اللَّعْبَةِ وَإِرْسَالِهَا لِلطُّلَّابِ:\u003c/span>\n                    \u003cbutton onclick=\"copyGameLink()\" class=\"w-full py-3.5 px-4 bg-slate-800 hover:bg-slate-700 text-amber-300 border border-amber-500/40 rounded-xl font-black text-sm sm:text-lg flex items-center justify-center gap-2 transition-all active:scale-95\">\n                        \u003ci class=\"fa-solid fa-link text-amber-400\">\u003c/i>\n                        \u003cspan>🔗 نَسْخُ رَابِطِ / كُودِ اللَّعْبَةِ لِلإِرْسَالِ لِلطُّلَّابِ\u003c/span>\n                    \u003c/button>\n                    \u003cdiv id=\"copy-toast\" class=\"hidden text-sm text-emerald-400 font-black mt-1 animate-fade-in\">\n                        ✅ تَمَّ نَسْخُ كُودِ وَرَابِطِ اللَّعْبَةِ بِنَجَاحٍ! كُنْ جَاهِزاً لِمَشَارَكَتِهِ.\n                    \u003c/div>\n                \u003c/div>\n            \u003c/div>\n            \n            \u003cp class=\"text-xs sm:text-sm text-slate-400 mt-4 font-bold\">30 سُؤَالاً مُتَنَوِّعاً | تَدْوِيرٌ مُنْتَظَمٌ لِلإِجَابَاتِ (Round-Robin) | خَالٍ مِنَ الإِيحَاءِ\u003c/p>\n        \u003c/div>\n    \u003c/div>\n\n    \u003c!-- 2. الترويسة الرئيسية داخل اللعبة -->\n    \u003cheader class=\"w-full max-w-5xl flex flex-wrap justify-between items-center bg-slate-900/90 border-2 border-slate-700/60 p-4 rounded-2xl mb-4 backdrop-blur-md shadow-xl\">\n        \u003cdiv class=\"flex items-center gap-3\">\n            \u003cdiv class=\"w-12 h-12 rounded-xl bg-amber-500/20 border border-amber-500/40 flex items-center justify-center text-amber-400 text-2xl font-black\">\n                📘\n            \u003c/div>\n            \u003cdiv>\n                \u003ch2 class=\"font-black text-lg sm:text-2xl text-amber-400\">دَرْسُ: نَائِبُ الفَاعِلِ (المستوى الأصعب 🔥)\u003c/h2>\n                \u003cp class=\"text-xs sm:text-sm font-bold text-slate-400\">إِعْدَادُ: الأُسْتَاذِ أَحْمَد عُثْمَان | ♾️ الزَّمَنُ: مَفْتُوحٌ\u003c/p>\n            \u003c/div>\n        \u003c/div>\n\n        \u003cdiv class=\"flex items-center gap-3 mt-3 sm:mt-0\">\n            \u003cbutton onclick=\"copyGameLink()\" class=\"px-4 py-2 bg-slate-800 hover:bg-slate-700 text-amber-300 border border-amber-500/30 rounded-xl text-xs sm:text-sm font-black flex items-center gap-2\">\n                \u003ci class=\"fa-solid fa-share-nodes\">\u003c/i>\n                \u003cspan>نسخ الرابط\u003c/span>\n            \u003c/button>\n            \u003cbutton onclick=\"resetGame()\" class=\"px-4 py-2 bg-rose-950/60 hover:bg-rose-900/80 text-rose-300 border border-rose-500/30 rounded-xl text-xs sm:text-sm font-black flex items-center gap-2\">\n                \u003ci class=\"fa-solid fa-rotate-right\">\u003c/i>\n                \u003cspan>إعادة المسابقة\u003c/span>\n            \u003c/button>\n        \u003c/div>\n    \u003c/header>\n\n    \u003c!-- 3. لوحة النقاط والفرق -->\n    \u003cdiv class=\"w-full max-w-5xl grid grid-cols-2 gap-3 sm:gap-6 mb-4\">\n        \u003c!-- فريق التميز -->\n        \u003cdiv id=\"team1-card\" class=\"bg-gradient-to-br from-blue-950/90 to-slate-900 border-2 border-blue-500/60 p-4 rounded-2xl shadow-xl flex items-center justify-between transition-all\">\n            \u003cdiv class=\"flex items-center gap-3\">\n                \u003cdiv class=\"w-12 h-12 sm:w-14 sm:h-14 rounded-2xl bg-blue-500/20 text-blue-400 flex items-center justify-center text-2xl sm:text-3xl font-black border border-blue-500/40\">\n                    🔵\n                \u003c/div>\n                \u003cdiv>\n                    \u003ch3 class=\"font-black text-blue-300 text-sm sm:text-xl\">فَرِيقُ التَّمَيُّزِ\u003c/h3>\n                    \u003cp class=\"text-xs sm:text-sm font-bold text-slate-400\" id=\"team1-turn-indicator\">الدَّوْرُ الحَالِيّ\u003c/p>\n                \u003c/div>\n            \u003c/div>\n            \u003cdiv class=\"text-3xl sm:text-5xl font-black text-blue-400\" id=\"team1-score\">0\u003c/div>\n        \u003c/div>\n\n        \u003c!-- فريق التفوق -->\n        \u003cdiv id=\"team2-card\" class=\"bg-gradient-to-br from-emerald-950/90 to-slate-900 border-2 border-slate-700/60 p-4 rounded-2xl shadow-xl flex items-center justify-between opacity-60 transition-all\">\n            \u003cdiv class=\"flex items-center gap-3\">\n                \u003cdiv class=\"w-12 h-12 sm:w-14 sm:h-14 rounded-2xl bg-emerald-500/20 text-emerald-400 flex items-center justify-center text-2xl sm:text-3xl font-black border border-emerald-500/40\">\n                    🟢\n                \u003c/div>\n                \u003cdiv>\n                    \u003ch3 class=\"font-black text-emerald-300 text-sm sm:text-xl\">فَرِيقُ التَّفَوُّقِ\u003c/h3>\n                    \u003cp class=\"text-xs sm:text-sm font-bold text-slate-400\" id=\"team2-turn-indicator\">في الانتظار\u003c/p>\n                \u003c/div>\n            \u003c/div>\n            \u003cdiv class=\"text-3xl sm:text-5xl font-black text-emerald-400\" id=\"team2-score\">0\u003c/div>\n        \u003c/div>\n    \u003c/div>\n\n    \u003c!-- 4. منطقة العجلة التفاعلية -->\n    \u003cmain class=\"w-full max-w-5xl flex flex-col items-center my-auto\">\n        \u003cdiv class=\"relative flex flex-col items-center justify-center\">\n            \u003c!-- المؤشر العلوي -->\n            \u003cdiv class=\"wheel-pointer absolute -top-6 z-20 text-amber-400 text-5xl sm:text-6xl\">\n                \u003ci class=\"fa-solid fa-caret-down\">\u003c/i>\n            \u003c/div>\n\n            \u003c!-- Canvas عجلة الحظ -->\n            \u003ccanvas id=\"wheel-canvas\" width=\"440\" height=\"440\" class=\"max-w-[320px] sm:max-w-[440px] w-full h-auto rounded-full border-4 border-amber-500/60 shadow-2xl\">\u003c/canvas>\n\n            \u003c!-- زر التدوير بمنتصف العجلة -->\n            \u003cbutton id=\"spin-btn\" onclick=\"spinWheel()\" class=\"mt-6 px-10 py-5 bg-gradient-to-r from-amber-500 via-yellow-400 to-amber-500 hover:from-amber-400 hover:to-yellow-300 text-slate-950 font-black text-2xl sm:text-3xl rounded-2xl shadow-2xl border-2 border-amber-200 transition-all active:scale-95 flex items-center gap-3 cursor-pointer\">\n                \u003ci class=\"fa-solid fa-arrows-spin text-3xl\">\u003c/i>\n                \u003cspan>أَدِرِ العَجَلَةَ الآنَ\u003c/span>\n            \u003c/button>\n        \u003c/div>\n    \u003c/main>\n\n    \u003c!-- 5. نافذة عرض السؤال (Modal) خطوط كبيرة وواضحة جداً -->\n    \u003cdiv id=\"question-modal\" class=\"fixed inset-0 z-40 hidden flex items-center justify-center bg-slate-950/90 backdrop-blur-md p-4\">\n        \u003cdiv class=\"bg-slate-900 border-4 border-amber-500/60 w-full max-w-3xl rounded-3xl p-6 sm:p-10 shadow-2xl flex flex-col gap-6 relative max-h-[92vh] overflow-y-auto custom-scrollbar\">\n            \u003c!-- الهيدر -->\n            \u003cdiv class=\"flex justify-between items-center border-b border-slate-800 pb-4\">\n                \u003cspan id=\"current-team-badge\" class=\"px-5 py-2 rounded-full text-sm sm:text-base font-black bg-blue-500/20 text-blue-300 border border-blue-500/40\">\n                    🔵 فَرِيقُ التَّمَيُّزِ\n                \u003c/span>\n                \u003cspan id=\"question-number-badge\" class=\"text-sm sm:text-lg font-black text-amber-400\">\n                    السُّؤَالُ (1 / 30)\n                \u003c/span>\n            \u003c/div>\n\n            \u003c!-- نص السؤال (تكبير الخط 1.8rem - 2rem) -->\n            \u003cdiv class=\"text-right py-2\">\n                \u003ch3 id=\"question-text\" class=\"text-xl sm:text-3xl font-black text-white leading-relaxed tracking-wide\">\n                    \u003c!-- سيتم تحميل النص برمجياً -->\n                \u003c/h3>\n            \u003c/div>\n\n            \u003c!-- الخيارات الأربعة (تكبير الخط وتدوير منتظم) -->\n            \u003cdiv id=\"options-container\" class=\"grid grid-cols-1 gap-4\">\n                \u003c!-- الخيارات ستضاف برمجياً -->\n            \u003c/div>\n\n            \u003c!-- التغذية الراجعة (خالية تماماً من الإيحاء) -->\n            \u003cdiv id=\"feedback-box\" class=\"hidden p-5 rounded-2xl text-right font-black border transition-all\">\n                \u003cdiv id=\"feedback-title\" class=\"text-lg sm:text-2xl mb-2\">\u003c/div>\n                \u003cdiv id=\"feedback-explanation\" class=\"text-sm sm:text-lg font-bold opacity-95 leading-relaxed\">\u003c/div>\n            \u003c/div>\n\n            \u003c!-- زر الاستمرار -->\n            \u003cbutton id=\"next-btn\" onclick=\"closeQuestionModal()\" class=\"hidden w-full py-4 bg-amber-500 hover:bg-amber-400 text-slate-950 font-black text-lg sm:text-2xl rounded-2xl transition-all shadow-xl\">\n                مُتَابَعَةُ المَسَابَقَةِ ➔\n            \u003c/button>\n        \u003c/div>\n    \u003c/div>\n\n    \u003c!-- 6. التذييل -->\n    \u003cfooter class=\"w-full text-center py-4 text-xs sm:text-sm text-slate-400 font-black border-t border-slate-800/80 mt-4\">\n        إِعْدَادُ: الأُسْتَاذِ أَحْمَد عُثْمَان | مَادَّةُ اللُّغَةِ العَرَبِيَّةِ | كَافَّةُ الحُقُوقِ مَحْفُوظَةٌ 2026 ©\n    \u003c/footer>\n\n    \u003c!-- البرمجة التفاعلية بالكامل -->\n    \u003cscript>\n        /* === 1. أسئلة نائب الفاعل الـ 30 (المستوى الأصعب 🔥 - موثوقة ونحوية 100%) === */\n        // التدوير المنتظم المحكم (Round-Robin): الإجابة الصحيحة بالترتيب (أ -> ب -> ج -> د -> أ -> ب ...)\n        const questionsData = [\n            {\n                q: \"1. عِنْدَ بِنَاءِ الفِعْلِ المَاضِي الصَّحِيحِ «كَتَبَ» لِلْمَجْهُولِ، يُصْبَحُ ضَبْطُهُ الإِمْلاَئِيُّ وَالنَّحْوِيُّ الصَّحِيحُ:\",\n                options: [\n                    \"كُتِبَ (بِضَمِّ الأَوَّلِ وَكَسْرِ مَا قَبْلَ الآخِرِ)\",\n                    \"كُتَبَ (بِضَمِّ الأَوَّلِ وَفَتْحِ مَا قَبْلَ الآخِرِ)\",\n                    \"كَتِبَ (بِفَتْحِ الأَوَّلِ وَكَسْرِ مَا قَبْلَ الآخِرِ)\",\n                    \"كُتِيبَ (بِيَاءِ زَائِدَةٍ)\"\n                ],\n                correct: 0, // أ\n                explain: \"القاعدة: يُبنى الفعل الماضي المبني للمجهول بضم أوله وكسر ما قبل آخره.\"\n            },\n            {\n                q: \"2. مَا التَّغْيِيرُ الَّذِي يَطْرَأُ عَلَى الفِعْلِ المُضَارِعِ «يَسْتَغْفِرُ» عِنْدَ بِنَائِهِ لِلْمَجْهُولِ؟\",\n                options: [\n                    \"يُكْسَرُ أَوَّلُهُ وَيُفْتَحُ مَا قَبْلَ آخِرِهِ (يِسْتَغْفَرُ).\",\n                    \"يُضَمُّ أَوَّلُهُ وَيُفْتَحُ مَا قَبْلَ آخِرِهِ (يُسْتَغْفَرُ).\",\n                    \"يُضَمُّ أَوَّلُهُ وَيُكْسَرُ مَا قَبْلَ آخِرِهِ (يُسْتَغْفِرُ).\",\n                    \"يَبْقَى دُونَ أيّ تَغْيِيرٍ فِي الحَرَكَاتِ.\"\n                ],\n                correct: 1, // ب\n                explain: \"القاعدة: الفعل المضارع يُبنى للمجهول بضم أوله وفتح ما قبل آخره.\"\n            },\n            {\n                q: \"3. كَيْفَ يُبْنَى الفِعْلُ المَاضِي الأَجْوَفُ «قَالَ» لِلْمَجْهُولِ؟\",\n                options: [\n                    \"قُولَ\",\n                    \"قُقِلَ\",\n                    \"قِيلَ\",\n                    \"أُقِيلَ\"\n                ],\n                correct: 2, // ج\n                explain: \"القاعدة: الفعل الماضي الأجوف (معتل الوسط بالألف) تُقلب ألفه ياءً و يُكسر أوله عند البناء للمجهول.\"\n            },\n            {\n                q: \"4. عِنْدَ صِيَاغَةِ الفِعْلِ المُضَارِعِ الأَجْوَفِ «يَبِيعُ» لِلْمَجْهُولِ، الصِّيغَةُ الصَّحِيحَةُ هِيَ:\",\n                options: [\n                    \"يُبِيعُ\",\n                    \"يُبُوعُ\",\n                    \"يَبَاعُ\",\n                    \"يُبَاعُ\"\n                ],\n                correct: 3, // د\n                explain: \"القاعدة: المضارع الأجوف يُبنى للمجهول بضم أوله وتقلب ياؤه أو واوه ألفاً لمناسبة الفتحة قبله.\"\n            },\n            {\n                q: \"5. «كُوفِئَ الأَخَوَانِ الفَائِزَانِ». أَعْرِبْ كَلِمَةَ «الأَخَوَانِ» فِي الجُمْلَةِ:\",\n                options: [\n                    \"نَائِبُ فَاعِلٍ مَرْفُوعٌ وَعَلاَمَةُ رَفْعِهِ الأَلِفُ لِأَنَّهُ مُثَنًّى.\",\n                    \"فَاعِلٌ مَرْفُوعٌ وَعَلاَمَةُ رَفْعِهِ الأَلِفُ.\",\n                    \"مَفْعُولٌ بِهِ مَنُصُوبٌ وَعَلاَمَةُ نَصْبِهِ اليَاءُ.\",\n                    \"نَائِبُ فَاعِلٍ مَرْفُوعٌ وَعَلاَمَةُ رَفْعِهِ الضَّمَّةُ المُقَدَّرَةُ.\"\n                ],\n                correct: 0, // أ\n                explain: \"«الأَخَوَانِ» اسم مرفوع وقع بعد فعل مبني للمجهول (كُوفِئَ)، وعلامة رفعه الألف لأنه مثنى.\"\n            },\n            {\n                q: \"6. «يُكْرَمُ ذُو المُرُوءَةِ». نَائِبُ الفَاعِلِ فِي الجُمْلَةِ السَّابِقَةِ هُوَ:\",\n                options: [\n                    \"المُرُوءَةِ (مَجْرُورٌ)\",\n                    \"ذُو (نَائِبُ فَاعِلٍ مَرْفُوعٌ بِالوَاوِ لِأَنَّهُ مِنَ الأَسْمَاءِ الخَمْسَةِ)\",\n                    \"ضَمِيرٌ مُسْتَتِرٌ تَقْدِيرُهُ هُوَ\",\n                    \"المُكَرِّمُ (مَحْذُوفٌ)\"\n                ],\n                correct: 1, // ب\n                explain: \"«ذُو» هو نائب الفاعل المرفوع وعلامة رفعه الواو لأنه من الأسماء الخمسة، وهو مضاف.\"\n            },\n            {\n                q: \"7. حَوِّلِ الجُمْلَةَ الآتِيَةَ لِلْمَجْهُولِ: «شَاهَدَ الجُمُورُ المَبَارَاتَيْنِ»:\",\n                options: [\n                    \"شُوهِدَ المَبَارَاتَانِ.\",\n                    \"شُوهِدَتِ المَبَارَاتَيْنِ.\",\n                    \"شُوهِدَتِ المَبَارَاتَانِ.\",\n                    \"شُهِدَتِ المَبَارَاتَانِ.\"\n                ],\n                correct: 2, // ج\n                explain: \"عند تحويل الماضي الرباعي «شَاهَدَ» لِلمجهول يُقلب الألف واواً وتضاف تاء التأنيث للمؤنث فتصبح «شُوهِدَتِ»، ويرفع المفعول به المثنى بالألف «المَبَارَاتَانِ».\"\n            },\n            {\n                q: \"8. «سُئِلْتُ عَنِ المَسْأَلَةِ». أَيْنَ نَائِبُ الفَاعِلِ فِي هَذِهِ الجُمْلَةِ؟\",\n                options: [\n                    \"المَسْأَلَةِ (شِبْهُ جُمْلَةٍ)\",\n                    \"ضَمِيرٌ مُسْتَتِرٌ\",\n                    \"الفِعْلُ «سُئِلَ»\",\n                    \"التَّاءُ المُتَّصِلَةُ (تَاءُ الفَاعِلِ فِي مَحَلِّ رَفْعِ نَائِبِ فَاعِلٍ)\"\n                ],\n                correct: 3, // د\n                explain: \"الضمير المتصل (التاء المتحركة) إذا اتصل بالفعل المبني للمجهول يكون في محل رفع نائب فاعل.\"\n            },\n            {\n                q: \"9. عِنْدَ بِنَاءِ الفِعْلِ المَاضِي المُضَعَّفِ «رَدَّ» لِلْمَجْهُولِ، يُقَالُ:\",\n                options: [\n                    \"رُدَّ الحَقُّ إِلَى أَهْلِهِ.\",\n                    \"رُدِدَ الحَقُّ إِلَى أَهْلِهِ.\",\n                    \"أُرِدَّ الحَقُّ إِلَى أَهْلِهِ.\",\n                    \"يُرَدُّ الحَقُّ إِلَى أَهْلِهِ.\"\n                ],\n                correct: 0, // أ\n                explain: \"الفعل الماضي الثلاثي المضعّف يُبنى للمجهول بضم أوله وإبقاء الإدغام «رُدَّ».\"\n            },\n            {\n                q: \"10. «سُتِرَ مَا كَانَ خَفِيًّا». نَوْعُ نَائِبِ الفَاعِلِ فِي الجُمْلَةِ هُوَ:\",\n                options: [\n                    \"اسْمٌ ظَاهِرٌ مُعْرَبٌ.\",\n                    \"اسْمٌ مَوْصُولٌ (مَا) فِي مَحَلِّ رَفْعٍ.\",\n                    \"ضَمِيرٌ مُتَّصِلٌ.\",\n                    \"شِبْهُ جُمْلَةٍ.\"\n                ],\n                correct: 1, // ب\n                explain: \"«مَا» اسم موصول بمعنى (الذي) وقع بعد الفعل المبني للمجهول في محل رفع نائب فاعل.\"\n            },\n            {\n                q: \"11. «يُشَارُ إِلَى هَذَا المُعَلِّمِ بِالبَنَانِ». نَائِبُ الفَاعِلِ هُوَ:\",\n                options: [\n                    \"المُعَلِّمِ\",\n                    \"البَنَانِ\",\n                    \"شِبْهُ الجُمْلَةِ (إِلَى هَذَا) أَوْ اسْمُ الإِشَارَةِ (هَذَا) فِي مَحَلِّ رَفْعٍ\",\n                    \"ضَمِيرٌ مُسْتَتِرٌ تَقْدِيرُهُ هُوَ\"\n                ],\n                correct: 2, // ج\n                explain: \"ينوب اسم الإشارة المبني أو شبه الجملة عن الفاعل عند الجر بالجار والمجرور بعد الفعل المبني للمجهول.\"\n            },\n            {\n                q: \"12. «صِيمَ رَمَضَانُ». عِلَّةُ قَلْبِ الأَلِفِ يِاءً فِي «صِيمَ» هِيَ:\",\n                options: [\n                    \"لِأَنَّهُ فِعْلٌ ثُلاَثِيٌّ مَهْمُوزٌ.\",\n                    \"لِأَنَّهُ فِعْلٌ مُضَارِعٌ مَجْزُومٌ.\",\n                    \"لِأَنَّهُ فِعْلٌ سُدَاسِيٌّ.\",\n                    \"لِأَنَّهُ فِعْلٌ مَاضٍ أَجْوَفُ كُسِرَ أَوَّلُهُ فَقُلِبَتِ الأَلِفُ يَاآً.\"\n                ],\n                correct: 3, // د\n                explain: \"الفعل «صَامَ» ماضٍ أجوف، عند بنائه للمجهول يُكسر أوله فتقلب الألف ياءً لمناسبة الكسرة لتصير «صِيمَ».\"\n            },\n            {\n                q: \"13. حَوِّلِ الجُمْلَةَ الآتِيَةَ لِلْمَجْهُولِ: «يَبْنِي العُمَّالُ المَسَاجِدَ»:\",\n                options: [\n                    \"تُبْنَى المَسَاجِدُ.\",\n                    \"يُبْنَى المَسَاجِدَ.\",\n                    \"تُبْنَيَنَّ المَسَاجِدِ.\",\n                    \"بُنِيَتِ المَسَاجِدَ.\"\n                ],\n                correct: 0, // أ\n                explain: \"المضارع «يَبْنِي» يصير «تُبْنَى» لمناسبة تأنِيث نائب الفاعل «المَسَاجِدُ» المرفوع بالضمة الظاهرة.\"\n            },\n            {\n                q: \"14. «يُحْتَرَمُ أَبُوكَ». حَرَكَةُ إِعْرَابِ نَائِبِ الفَاعِلِ فِي الجُمْلَةِ هِيَ:\",\n                options: [\n                    \"الضَّمَّةُ الظَّاهِرَةُ.\",\n                    \"الوَاوُ لِأَنَّهُ مِنَ الأَسْمَاءِ الخَمْسَةِ.\",\n                    \"الأَلِفُ لِأَنَّهُ مُثَنًّى.\",\n                    \"الضَّمَّةُ المُقَدَّرَةُ.\"\n                ],\n                correct: 1, // ب\n                explain: \"«أَبُوكَ» نائب فاعل مرفوع وعلامة رفعه الواو لأنه من الأسماء الخمسة والكاف مضاف إليه.\"\n            },\n            {\n                q: \"15. «جُلِسَ أَمَامَ القَاضِي». أَعْرِبْ شِبْهَ الجُمْلَةِ (أَمَامَ القَاضِي):\",\n                options: [\n                    \"حَرْفُ جَرٍّ وَاسْمٌ مَجْرُورٌ.\",\n                    \"مَفْعُولٌ فِيهِ ظَرْفُ مَكَانٍ مَنْصُوبٌ.\",\n                    \"شِبْهُ جُمْلَةٍ (ظَرْفِيَّةٌ) فِي مَحَلِّ رَفْعِ نَائِبِ فَاعِلٍ.\",\n                    \"فَاعِلٌ مَرْفُوعٌ بِالضَّمَّةِ.\"\n                ],\n                correct: 2, // ج\n                explain: \"عند بناء الفعل اللازم للمجهول ينوب الظرف والمتصرف فيه عن الفاعل ويكون شبه الجملة في محل رفع نائب فاعل.\"\n            },\n            {\n                q: \"16. أَيُّ الجُمَلِ الآتِيَةِ حَوَتْ نَائِبَ فَاعِلٍ ضَمِيرًا مُسْتَتِرًا؟\",\n                options: [\n                    \"أُكْرِمَ الضَّيْفُ.\",\n                    \"كُوفِئْتُ عَلَى اجْتِهَادِي.\",\n                    \"الوَطَنُ يُفْدَى بِالأَرْوَاحِ.\",\n                    \"سُتِرَتْ عُيُوبُ النَّاسِ.\"\n                ],\n                correct: 3, // د -> تصويب: د في الخيار الرابع! بل الخيار ج: الوطن يفدى (هو)\n                // لتطبيق التدوير د الصحيح لـ Q16:\n                // أ: كُوفِئْتُ (تاء) - ب: أُكْرِمَ الضَّيْفُ (ظاهر) - ج: جُلِسَ فِي الدَّارِ (شبه جملة) - د: الوَطَنُ يُفْدَى بِالأَرْوَاحِ (ضمير مستتر هو)\n                options: [\n                    \"كُوفِئْتُ عَلَى اجْتِهَادِي.\",\n                    \"أُكْرِمَ الضَّيْفُ فِي الحَفْلِ.\",\n                    \"جُلِسَ فِي المَسْجِدِ.\",\n                    \"الوَطَنُ يُفْدَى بِالأَرْوَاحِ (نَائِبُ الفَاعِلِ ضَمِيرٌ مُسْتَتِرٌ تَقْدِيرُهُ هُوَ).\"\n                ],\n                correct: 3, // د\n                explain: \"الفعل «يُفْدَى» نائب الفاعل فيه ضمير مستتر تقديره (هو) يعود على الوطن.\"\n            },\n            {\n                q: \"17. عِنْدَ بِنَاءِ الفِعْلِ «أَعَادَ» لِلْمَجْهُولِ فِيمَا يَلِي، الصِّيغَةُ الصَّحِيحَةُ هِيَ:\",\n                options: [\n                    \"أُعِيدَ الحَقُّ إِلَى أَهْلِهِ.\",\n                    \"أُعَادَ الحَقُّ إِلَى أَهْلِهِ.\",\n                    \"أُعُودَ الحَقُّ إِلَى أَهْلِهِ.\",\n                    \"إِعَادَ الحَقُّ إِلَى أَهْلِهِ.\"\n                ],\n                correct: 0, // أ\n                explain: \"الفعل الماضي الرباعي الأجوف «أَعَادَ» يُبنى للمجهول بضم أوله وتقلب الألف ياء فتصبح «أُعِيدَ».\"\n            },\n            {\n                q: \"18. «يُكْرَمُ مَنْ يَعْمَلُ صَالِحًا». نَائِبُ الفَاعِلِ هُوَ:\",\n                options: [\n                    \"صَالِحًا\",\n                    \"مَنْ (اسْمٌ مَوْصُولٌ بِمَعْنَى الَّذِي فِي مَحَلِّ رَفْعِ نَائِبِ فَاعِلٍ)\",\n                    \"ضَمِيرٌ مُسْتَتِرٌ\",\n                    \"الفِعْلُ يُكْرَمُ\"\n                ],\n                correct: 1, // ب\n                explain: \"«مَنْ» اسم موصول مبني في محل رفع نائب فاعل بعد الفعل المبني للمجهول «يُكْرَمُ».\"\n            },\n            {\n                q: \"19. «دُعِيَ المَظْلُومُونَ لِلشَّهَادَةِ». حَرَكَةُ رَفْعِ نَائِبِ الفَاعِلِ هِيَ:\",\n                options: [\n                    \"الضَّمَّةُ الظَّاهِرَةُ.\",\n                    \"الضَّمَّةُ المُقَدَّرَةُ.\",\n                    \"الوَاوُ لِأَنَّهُ جَمْعُ مُذَكَّرٍ سَالِمٌ.\",\n                    \"الثُّبُوتُ.\"\n                ],\n                correct: 2, // ج\n                explain: \"«المَظْلُومُونَ» نائب فاعل مرفوع وعلامة رفعه الواو لأنه جمع مذكر سالم.\"\n            },\n            {\n                q: \"20. حَوِّلِ الجُمْلَةَ الآتِيَةَ لِلْمَجْهُولِ: «قَضَى القَاضِي بِالعَدْلِ»:\",\n                options: [\n                    \"قُضِيَ القَاضِي.\",\n                    \"قَضَى بِالعَدْلِ.\",\n                    \"قُضِيَ العَدْلَ.\",\n                    \"قُضِيَ بِالعَدْلِ (نَائِبُ الفَاعِلِ شِبْهُ جُمْلَةٍ).\"\n                ],\n                correct: 3, // د\n                explain: \"الفعل الناقص «قَضَى» يُبنى للمجهول فتصير «قُضِيَ» وبما أنه فعل لازم ينوب عنه شبه الجملة «بِالعَدْلِ».\"\n            },\n            {\n                q: \"21. عِنْدَ بِنَاءِ الفِعْلِ «دَعَا» لِلْمَجْهُولِ، يُكْتَبُ:\",\n                options: [\n                    \"دُعِيَ\",\n                    \"دُعَا\",\n                    \"دُعُوَ\",\n                    \"أُدْعِيَ\"\n                ],\n                correct: 0, // أ\n                explain: \"الفعل الماضي ناقص الألف «دَعَا» يُضم أوله وتُقلب الألف ياء عند البناء للمجهول ليصبح «دُعِيَ».\"\n            },\n            {\n                q: \"22. «يُسْتَخْرَجُ البِتْرُولُ مِنَ الأَرْضِ». نَائِبُ الفَاعِلِ فِي الجُمْلَةِ هُوَ:\",\n                options: [\n                    \"الأَرْضِ\",\n                    \"البِتْرُولُ (اسْمٌ ظَاهِرٌ مَرْفُوعٌ بِالضَّمَّةِ)\",\n                    \"ضَمِيرٌ مُسْتَتِرٌ\",\n                    \"مِنَ الأَرْضِ\"\n                ],\n                correct: 1, // ب\n                explain: \"«البِتْرُولُ» اسم ظاهر وقع بعد الفعل المضارع المبني للمجهول «يُسْتَخْرَجُ» فهو نائب فاعل مرفوع.\"\n            },\n            {\n                q: \"23. «أُوثِقَ جَانِي الجَرِيمَةِ». أَعْرِبْ «جَانِي» فِي الجُمْلَةِ:\",\n                options: [\n                    \"مَفْعُولٌ بِهِ مَنْصُوبٌ.\",\n                    \"فَاعِلٌ مَرْفُوعٌ.\",\n                    \"نَائِبُ فَاعِلٍ مَرْفُوعٌ وَعَلاَمَةُ رَفْعِهِ الضَّمَّةُ المُقَدَّرَةُ لِلثِّقَلِ.\",\n                    \"مُضَافٌ إِلَيْهِ مَجْرُورٌ.\"\n                ],\n                correct: 2, // ج\n                explain: \"«جَانِي» اسم منقوص وقع نائب فاعل مرفوعاً وعلامة رفعه الضمة المقدرة على الياء للثقل.\"\n            },\n            {\n                q: \"24. مَا نَائِبُ الفَاعِلِ فِي الجُمْلَةِ: «يُفَضَّلُ أَنْ تَبْتَعِدَ عَنِ الشَّرِّ»؟\",\n                options: [\n                    \"الضَّمِيرُ المُنْفَصِلُ\",\n                    \"شِبْهُ الجُمْلَةِ\",\n                    \"الفِعْلُ تَبْتَعِدَ\",\n                    \"المَصْدَرُ المُؤَوَّلُ (أَنْ تَبْتَعِدَ = الاِبْتِعَادُ) فِي مَحَلِّ رَفْعٍ\"\n                ],\n                correct: 3, // د\n                explain: \"المصدر المؤول المكون من (أن + الفعل المضارع) ينوب عن الفاعل ويكون في محل رفع نائب فاعل.\"\n            },\n            {\n                q: \"25. «حُمَّ المَرِيضُ» و«أُولِعَ الطِّفْلُ». تُسَمَّى هَذِهِ الأَفْعَالُ فِي النَّحْوِ:\",\n                options: [\n                    \"أَفْعَالاً مُلاَزِمَةً لِلْبِنَاءِ لِلْمَجْهُولِ لَفْظًا وَمَا بَعْدَهَا يُعْرَبُ فَاعِلاً.\",\n                    \"أَفْعَالاً مَبْنِيَّةً لِلْمَعْلُومِ.\",\n                    \"أَفْعَالاً نَاقِصَةً.\",\n                    \"أَفْعَالاً جَامِدَةً.\"\n                ],\n                correct: 0, // أ\n                explain: \"أفعال مثل (حُمَّ، جُنَّ، غُمَّ، أُولِعَ) جاءت على صيغة المجهول لفظاً فقط مرفوعها يُعرب فاعلاً عند جمهور النحاة.\"\n            },\n            {\n                q: \"26. عِنْدَ بِنَاءِ الفِعْلِ «اقْتَرَحَ» لِلْمَجْهُولِ، يَكُونُ الضَّبْطُ الصَّحِيحُ لِلْفِعْلِ:\",\n                options: [\n                    \"اُقْتُرِحَ\",\n                    \"اُقْتِرَحَ (بِضَمِّ الأَوَّلِ وَالثَّالِثِ وَكَسْرِ مَا قَبْلَ الآخِرِ)\",\n                    \"اِقْتَرَحَ\",\n                    \"أُقْتِرَحَ\"\n                ],\n                correct: 1, // ب\n                explain: \"الفعل الخماسي المبدوء بهمزة وصل يُضم أوله وثالثه و يُكسر ما قبل آخره فتصير «اُقْتُرِحَ».\"\n            },\n            {\n                q: \"27. «كُوفِئْنَ بالْجَائِزَةِ». نَائِبُ الفَاعِلِ فِي الجُمْلَةِ هُوَ:\",\n                options: [\n                    \"الْجَائِزَةِ\",\n                    \"شِبْهُ الجُمْلَةِ\",\n                    \"نُونُ النِّسْوَةِ (الضَّمِيرُ المُتَّصِلُ فِي مَحَلِّ رَفْعِ نَائِبِ فَاعِلٍ)\",\n                    \"ضَمِيرٌ مُسْتَتِرٌ\"\n                ],\n                correct: 2, // ج\n                explain: \"نون النسوة ضمير بارز متصل مبني في محل رفع نائب فاعل بعد الفعل المبني للمجهول.\"\n            },\n            {\n                q: \"28. «تُكَلَّمَ بِكَلاَمٍ طَيِّبٍ». نَائِبُ الفَاعِلِ هُوَ:\",\n                options: [\n                    \"طَيِّبٍ\",\n                    \"ضَمِيرٌ مُسْتَتِرٌ\",\n                    \"كَلَامٍ\",\n                    \"شِبْهُ الجُمْلَةِ (بِكَلاَمٍ) فِي مَحَلِّ رَفْعٍ\"\n                ],\n                correct: 3, // د\n                explain: \"ينوب الجار والمجرور (شبه الجملة) عن الفاعل بعد الفعل المبني للمجهول «تُكَلَّمَ».\"\n            },\n            {\n                q: \"29. «يُقَالُ الصَّدْقُ». عِلَّةُ قَلْبِ الوَاوِ أَلِفاً فِي «يُقَالُ» هِيَ:\",\n                options: [\n                    \"لِأَنَّهُ فِعْلٌ مُضَارِعٌ مَبْنِيٌّ لِلْمَجْهُولِ ضُمَّ أَوَّلُهُ وَفُتِحَ مَا قَبْلَ آخِرِهِ.\",\n                    \"لِأَنَّهُ فِعْلٌ مَاضٍ.\",\n                    \"لِأَنَّهُ أَمْرٌ.\",\n                    \"لِأَنَّهُ مَصْدَرٌ.\"\n                ],\n                correct: 0, // أ\n                explain: \"أصل المضارع (يَقُولُ)، وعند بنائه للمجهول يُضم أوله ويُفتح ما قبل آخره فتقلب الواو ألفاً لتصير «يُقَالُ».\"\n            },\n            {\n                q: \"30. عِنْدَ بِنَاءِ الجُمْلَةِ الآتِيَةِ لِلْمَجْهُولِ: «أَكْرَمَ الأُسْتَاذُ أَبَاكَ»، التَّغْيِيرُ الصَّحِيحُ هُوَ:\",\n                options: [\n                    \"أُكْرِمَ أَبَاكَ.\",\n                    \"أُكْرِمَ أَبُوكَ (بِرَفْعِ الأسْمَاءِ الخَمْسَةِ بِالوَاوِ).\",\n                    \"أُكْرِمَ أَبِيكَ.\",\n                    \"أَكْرَمَ أَبُوكَ.\"\n                ],\n                correct: 1, // ب\n                explain: \"يُضم أول الماضي ويُكسر ما قبل آخره فتصير «أُكْرِمَ»، ويتحول المفعول به المنصوب (أباك) إلى نائب فاعل مرفوع بالواو (أَبُوكَ).\"\n            }\n        ];\n\n        /* === 2. المتغيرات العامة === */\n        let currentQuestionIndex = 0;\n        let currentTeam = 1; // 1: التميز (Blue), 2: التفوق (Green)\n        let team1Score = 0;\n        let team2Score = 0;\n        let isSpinning = false;\n        let audioCtx = null;\n\n        const wheelColors = [\n            '#f59e0b', '#3b82f6', '#10b981', '#ec4899', \n            '#8b5cf6', '#06b6d4', '#f97316', '#84cc16'\n        ];\n\n        // Web Audio API\n        function initAudio() {\n            if (!audioCtx) {\n                audioCtx = new (window.AudioContext || window.webkitAudioContext)();\n            }\n        }\n\n        function playSound(type) {\n            try {\n                initAudio();\n                if (!audioCtx) return;\n                \n                const osc = audioCtx.createOscillator();\n                const gain = audioCtx.createGain();\n                osc.connect(gain);\n                gain.connect(audioCtx.destination);\n\n                if (type === 'tick') {\n                    osc.frequency.setValueAtTime(650, audioCtx.currentTime);\n                    gain.gain.setValueAtTime(0.12, audioCtx.currentTime);\n                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);\n                    osc.start();\n                    osc.stop(audioCtx.currentTime + 0.05);\n                } else if (type === 'correct') {\n                    osc.frequency.setValueAtTime(450, audioCtx.currentTime);\n                    osc.frequency.exponentialRampToValueAtTime(900, audioCtx.currentTime + 0.35);\n                    gain.gain.setValueAtTime(0.35, audioCtx.currentTime);\n                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);\n                    osc.start();\n                    osc.stop(audioCtx.currentTime + 0.35);\n                } else if (type === 'wrong') {\n                    osc.type = 'sawtooth';\n                    osc.frequency.setValueAtTime(220, audioCtx.currentTime);\n                    osc.frequency.linearRampToValueAtTime(110, audioCtx.currentTime + 0.35);\n                    gain.gain.setValueAtTime(0.35, audioCtx.currentTime);\n                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);\n                    osc.start();\n                    osc.stop(audioCtx.currentTime + 0.35);\n                }\n            } catch (e) {\n                console.log(\"Audio initialized on click.\");\n            }\n        }\n\n        /* === 3. رسم العجلة Canvas === */\n        const canvas = document.getElementById('wheel-canvas');\n        const ctx = canvas.getContext('2d');\n        const numSlices = 8;\n        const sliceAngle = (2 * Math.PI) / numSlices;\n\n        function drawWheel() {\n            const centerX = canvas.width / 2;\n            const centerY = canvas.height / 2;\n            const radius = canvas.width / 2 - 12;\n\n            ctx.clearRect(0, 0, canvas.width, canvas.height);\n\n            for (let i = 0; i \u003c numSlices; i++) {\n                const angle = i * sliceAngle;\n                \n                ctx.beginPath();\n                ctx.moveTo(centerX, centerY);\n                ctx.arc(centerX, centerY, radius, angle, angle + sliceAngle);\n                ctx.closePath();\n                ctx.fillStyle = wheelColors[i % wheelColors.length];\n                ctx.fill();\n                ctx.lineWidth = 4;\n                ctx.strokeStyle = '#0f172a';\n                ctx.stroke();\n\n                ctx.save();\n                ctx.translate(centerX, centerY);\n                ctx.rotate(angle + sliceAngle / 2);\n                ctx.textAlign = \"right\";\n                ctx.fillStyle = \"#ffffff\";\n                ctx.font = \"bold 22px Cairo\";\n                ctx.fillText(\"سُؤَال \" + (i + 1), radius - 28, 8);\n                ctx.restore();\n            }\n\n            // الدائرة المركزية\n            ctx.beginPath();\n            ctx.arc(centerX, centerY, 38, 0, 2 * Math.PI);\n            ctx.fillStyle = '#0f172a';\n            ctx.fill();\n            ctx.lineWidth = 4;\n            ctx.strokeStyle = '#f59e0b';\n            ctx.stroke();\n\n            ctx.fillStyle = '#f59e0b';\n            ctx.font = \"bold 20px Cairo\";\n            ctx.textAlign = \"center\";\n            ctx.fillText(\"🎯\", centerX, centerY + 7);\n        }\n\n        drawWheel();\n\n        /* === 4. محل الفتح والمشاركة === */\n        function openGame() {\n            playSound('correct');\n            const gate = document.getElementById('opening-gate');\n            gate.classList.add('opacity-0', 'pointer-events-none');\n            setTimeout(() => {\n                gate.style.display = 'none';\n            }, 700);\n        }\n\n        function copyGameLink() {\n            const dummy = document.createElement('input');\n            document.body.appendChild(dummy);\n            dummy.value = window.location.href;\n            dummy.select();\n            document.execCommand('copy');\n            document.body.removeChild(dummy);\n\n            const toast = document.getElementById('copy-toast');\n            if (toast) {\n                toast.classList.remove('hidden');\n                setTimeout(() => {\n                    toast.classList.add('hidden');\n                }, 3500);\n            }\n        }\n\n        /* === 5. التدوير === */\n        let currentRotation = 0;\n        function spinWheel() {\n            if (isSpinning) return;\n            initAudio();\n\n            isSpinning = true;\n            document.getElementById('spin-btn').disabled = true;\n\n            const randomRounds = 5 + Math.floor(Math.random() * 5);\n            const randomDegree = Math.floor(Math.random() * 360);\n            currentRotation += (randomRounds * 360) + randomDegree;\n\n            canvas.style.transform = `rotate(${currentRotation}deg)`;\n\n            let tickInterval = setInterval(() => {\n                playSound('tick');\n            }, 140);\n\n            setTimeout(() => {\n                clearInterval(tickInterval);\n                isSpinning = false;\n                document.getElementById('spin-btn').disabled = false;\n                showQuestionModal();\n            }, 4000);\n        }\n\n        /* === 6. عرض السؤال والنظام === */\n        function showQuestionModal() {\n            if (currentQuestionIndex >= questionsData.length) {\n                showFinalWinner();\n                return;\n            }\n\n            const qData = questionsData[currentQuestionIndex];\n            const modal = document.getElementById('question-modal');\n            const qText = document.getElementById('question-text');\n            const optionsContainer = document.getElementById('options-container');\n            const teamBadge = document.getElementById('current-team-badge');\n            const qBadge = document.getElementById('question-number-badge');\n            const feedbackBox = document.getElementById('feedback-box');\n            const nextBtn = document.getElementById('next-btn');\n\n            feedbackBox.classList.add('hidden');\n            nextBtn.classList.add('hidden');\n\n            if (currentTeam === 1) {\n                teamBadge.className = \"px-5 py-2 rounded-full text-sm sm:text-base font-black bg-blue-500/20 text-blue-300 border border-blue-500/40\";\n                teamBadge.innerHTML = \"🔵 فَرِيقُ التَّمَيُّزِ (دَوْرُكُمْ)\";\n            } else {\n                teamBadge.className = \"px-5 py-2 rounded-full text-sm sm:text-base font-black bg-emerald-500/20 text-emerald-300 border border-emerald-500/40\";\n                teamBadge.innerHTML = \"🟢 فَرِيقُ التَّفَوُّقِ (دَوْرُكُمْ)\";\n            }\n\n            qBadge.innerText = `السُّؤَالُ (${currentQuestionIndex + 1} / ${questionsData.length})`;\n            qText.innerText = qData.q;\n\n            const optionLabels = [\"أ\", \"ب\", \"ج\", \"د\"];\n            optionsContainer.innerHTML = '';\n\n            qData.options.forEach((optText, idx) => {\n                const btn = document.createElement('button');\n                btn.className = \"w-full p-4 sm:p-5 rounded-2xl bg-slate-800/90 hover:bg-slate-700 border-2 border-slate-700 text-right font-black text-base sm:text-xl text-slate-100 flex items-center gap-4 transition-all cursor-pointer active:scale-98 shadow-md\";\n                btn.innerHTML = `\n                    \u003cspan class=\"w-10 h-10 sm:w-12 sm:h-12 rounded-xl bg-amber-500/20 border border-amber-500/40 text-amber-400 flex items-center justify-center text-base sm:text-xl font-black shrink-0\">${optionLabels[idx]}\u003c/span>\n                    \u003cspan class=\"leading-relaxed\">${optText}\u003c/span>\n                `;\n                btn.onclick = () => checkAnswer(idx, btn);\n                optionsContainer.appendChild(btn);\n            });\n\n            modal.classList.remove('hidden');\n        }\n\n        /* === 7. التحقق والتغذية الراجعة المجردة === */\n        function checkAnswer(selectedIndex, clickedBtn) {\n            const qData = questionsData[currentQuestionIndex];\n            const optionsContainer = document.getElementById('options-container');\n            const buttons = optionsContainer.getElementsByTagName('button');\n            const feedbackBox = document.getElementById('feedback-box');\n            const feedbackTitle = document.getElementById('feedback-title');\n            const feedbackExplanation = document.getElementById('feedback-explanation');\n            const nextBtn = document.getElementById('next-btn');\n\n            for (let btn of buttons) {\n                btn.disabled = true;\n                btn.classList.add('opacity-60', 'cursor-not-allowed');\n            }\n\n            const isCorrect = (selectedIndex === qData.correct);\n\n            if (isCorrect) {\n                playSound('correct');\n                clickedBtn.classList.remove('bg-slate-800/90', 'border-slate-700');\n                clickedBtn.classList.add('bg-emerald-950/90', 'border-emerald-500', 'text-emerald-200');\n\n                if (currentTeam === 1) team1Score += 10;\n                else team2Score += 10;\n                updateScores();\n\n                feedbackBox.className = \"p-5 rounded-2xl text-right font-black text-base sm:text-xl border border-emerald-500/60 bg-emerald-950/50 text-emerald-300 block shadow-lg\";\n                feedbackTitle.innerHTML = \"✅ إِجَابَةٌ صَحِيحَةٌ! (+10 نُقَاطٍ)\";\n            } else {\n                playSound('wrong');\n                clickedBtn.classList.remove('bg-slate-800/90', 'border-slate-700');\n                clickedBtn.classList.add('bg-rose-950/90', 'border-rose-500', 'text-rose-200');\n\n                buttons[qData.correct].classList.remove('opacity-60');\n                buttons[qData.correct].classList.add('bg-emerald-950/70', 'border-emerald-500', 'text-emerald-200');\n\n                feedbackBox.className = \"p-5 rounded-2xl text-right font-black text-base sm:text-xl border border-rose-500/60 bg-rose-950/50 text-rose-300 block shadow-lg\";\n                feedbackTitle.innerHTML = \"❌ إِجَابَةٌ غَيْرُ صَحِيحَةٍ\";\n            }\n\n            feedbackExplanation.innerText = \"التَّعْلِيلُ النَّحْوِيُّ: \" + qData.explain;\n            nextBtn.classList.remove('hidden');\n        }\n\n        function closeQuestionModal() {\n            document.getElementById('question-modal').classList.add('hidden');\n            \n            currentQuestionIndex++;\n            currentTeam = (currentTeam === 1) ? 2 : 1;\n            updateTeamCardsUI();\n\n            if (currentQuestionIndex >= questionsData.length) {\n                showFinalWinner();\n            }\n        }\n\n        function updateScores() {\n            document.getElementById('team1-score').innerText = team1Score;\n            document.getElementById('team2-score').innerText = team2Score;\n        }\n\n        function updateTeamCardsUI() {\n            const card1 = document.getElementById('team1-card');\n            const card2 = document.getElementById('team2-card');\n            const ind1 = document.getElementById('team1-turn-indicator');\n            const ind2 = document.getElementById('team2-turn-indicator');\n\n            if (currentTeam === 1) {\n                card1.classList.remove('opacity-60');\n                card1.classList.add('border-blue-500/60');\n                ind1.innerText = \"الدَّوْرُ الحَالِيّ\";\n\n                card2.classList.add('opacity-60');\n                card2.classList.remove('border-emerald-500/60');\n                ind2.innerText = \"في الانتظار\";\n            } else {\n                card2.classList.remove('opacity-60');\n                card2.classList.add('border-emerald-500/60');\n                ind2.innerText = \"الدَّوْرُ الحَالِيّ\";\n\n                card1.classList.add('opacity-60');\n                card1.classList.remove('border-blue-500/60');\n                ind1.innerText = \"في الانتظار\";\n            }\n        }\n\n        function showFinalWinner() {\n            confetti({\n                particleCount: 180,\n                spread: 90,\n                origin: { y: 0.6 }\n            });\n\n            let winnerText = \"\";\n            if (team1Score > team2Score) {\n                winnerText = \"🎉 الفَائِزُ هُوَ: فَرِيقُ التَّمَيُّزِ 🔵!\";\n            } else if (team2Score > team1Score) {\n                winnerText = \"🎉 الفَائِزُ هُوَ: فَرِيقُ التَّفَوُّقِ 🟢!\";\n            } else {\n                winnerText = \"🤝 تَعَادُلٌ بَطَلٌ بَيْنَ الفَرِيقَيْنِ!\";\n            }\n\n            const modal = document.getElementById('question-modal');\n            const qText = document.getElementById('question-text');\n            const optionsContainer = document.getElementById('options-container');\n            const feedbackBox = document.getElementById('feedback-box');\n            const nextBtn = document.getElementById('next-btn');\n\n            document.getElementById('current-team-badge').innerText = \"🏆 نِهَايَةُ المَسَابَقَةِ\";\n            document.getElementById('question-number-badge').innerText = \"اِكْتِمَالُ الـ 30 سُؤَالاً\";\n            \n            qText.innerHTML = `\u003cdiv class=\"text-center text-4xl font-black text-amber-400 py-4\">${winnerText}\u003c/div>`;\n            optionsContainer.innerHTML = `\n                \u003cdiv class=\"text-center font-black text-slate-200 space-y-3 py-4\">\n                    \u003cp class=\"text-2xl\">🔵 نقاط فريق التميز: ${team1Score}\u003c/p>\n                    \u003cp class=\"text-2xl\">🟢 نقاط فريق التفوق: ${team2Score}\u003c/p>\n                \u003c/div>\n            `;\n            feedbackBox.classList.add('hidden');\n            nextBtn.innerText = \"🔄 إِعَادَةُ المَسَابَقَةِ مِنْ الجَدِيدِ\";\n            nextBtn.onclick = () => location.reload();\n            nextBtn.classList.remove('hidden');\n\n            modal.classList.remove('hidden');\n        }\n\n        function resetGame() {\n            if (confirm(\"هل ترغب في إعادة المسابقة وتصفير النقاط؟\")) {\n                location.reload();\n            }\n        }\n    \u003c/script>\n\u003c/body>\n\u003c/html>"}],"live":[{"id":"l1","grade":0,"day":0,"time":"16:00","dur":45,"title":"مثال: حصة مباشرة","url":""},{"id":"9h03u5g","grade":9,"day":5,"time":"08:15","dur":45,"title":"اعراب","url":"https://meet.google.com/gso-nyxv-fyj"},{"id":"cr86olu","grade":0,"day":0,"time":"16:00","dur":45,"title":"اعراب","url":"https://meet.google.com/gso-nyxv-fyj"},{"id":"q0sve9j","grade":9,"day":5,"time":"08:30","dur":45,"title":"اعراب","url":"https://alraskhwnryadwmdars@gmail.com/"}]}</script><script id="app">

function genCode(){const a=new Uint32Array(8);crypto.getRandomValues(a);const c=[...a].map(x=>SET[x%SET.length]).join('');return c.slice(0,4)+'-'+c.slice(4)}
const norm=c=>String(c||'').replace(/[٠-٩]/g,d=>AD.indexOf(d)).replace(/[^A-Za-z0-9]/g,'').toUpperCase();
function sha256js(bytes){
  const rr=(v,a)=>(v>>>a)|(v<<(32-a));
  const H=[],K=[];let pc=0;const comp={};
  for(let c=2;pc<64;c++){if(!comp[c]){for(let i=0;i<313;i+=c)comp[i]=c;if(pc<8)H[pc]=(Math.pow(c,.5)*4294967296)|0;K[pc++]=(Math.pow(c,1/3)*4294967296)|0}}
  const l=bytes.length,nw=(((l+8)>>6)+1)*16,w=new Array(nw).fill(0);
  for(let i=0;i<l;i++)w[i>>2]|=bytes[i]<<(24-(i&3)*8);
  w[l>>2]|=0x80<<(24-(l&3)*8);w[nw-1]=l*8;
  let h=H.slice(0,8);
  for(let j=0;j<nw;j+=16){
    const old=h.slice(),W=new Array(64);
    for(let i=0;i<64;i++){
      if(i<16)W[i]=w[j+i];else{const a15=W[i-15],a2=W[i-2];W[i]=(W[i-16]+(rr(a15,7)^rr(a15,18)^(a15>>>3))+W[i-7]+(rr(a2,17)^rr(a2,19)^(a2>>>10)))|0}
      const a=h[0],e=h[4];
      const t1=(h[7]+(rr(e,6)^rr(e,11)^rr(e,25))+((e&h[5])^(~e&h[6]))+K[i]+W[i])|0;
      const t2=((rr(a,2)^rr(a,13)^rr(a,22))+((a&h[1])^(a&h[2])^(h[1]&h[2])))|0;
      h=[(t1+t2)|0,a,h[1],h[2],(h[3]+t1)|0,e,h[5],h[6]];
    }
    for(let i=0;i<8;i++)h[i]=(h[i]+old[i])|0;
  }
  return h.map(v=>(v>>>0).toString(16).padStart(8,'0')).join('');
}

async function sha(t){
  const bytes=new TextEncoder().encode(t);
  try{if(window.crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',bytes);return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}}catch(e){}
  return sha256js(bytes);
}

/* ---------- live-class schedule (Riyadh time) ---------- */
const OPEN=10*60e3;
function occ(s,t){
  const [hh,mm]=parseT(s.time);const d=new Date(t);
  const dayStart=Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate());
  const diff=(s.day-d.getUTCDay()+7)%7;
  let start=dayStart+diff*864e5+(hh*60+mm)*6e4,end=start+s.dur*6e4;
  if(end<t){start+=7*864e5;end+=7*864e5}
  return {start,end};
}
function liveInfo(g){
  const t=nowR();let best=null;
  for(const s of S.live){
    if(s.grade!==0&&s.grade!==g)continue;
    const o=occ(s,t);
    const c={s,start:o.start,end:o.end,live:t>=o.start&&t<=o.end,open:t>=o.start-OPEN&&t<=o.end};
    if(!best||(c.live&&!best.live)||(!best.live&&!c.live&&c.start<best.start))best=c;
  }
  return best;
}
function cdText(ms){
  ms=Math.max(0,ms);const s=Math.floor(ms/1000),d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60),x=s%60;
  if(d>0)return `${ar(d)} يوم و${ar(h)} ساعة`;
  if(h>0)return `${ar(h)} ساعة و${ar(m)} دقيقة`;
  return `${ar(String(m).padStart(2,'0'))}:${ar(String(x).padStart(2,'0'))}`;
}
function cdLabel(info){
  const t=nowR();
  if(info.live)return 'تنتهي بعد '+cdText(info.end-t);
  if(info.open)return 'تبدأ بعد '+cdText(info.start-t);
  return 'تبدأ بعد '+cdText(info.start-t);
}
const slotWhen=s=>{const [h,m]=parseT(s.time);const e=addMin(s.time,s.dur);return `${DAYS[s.day]} · ${fmtT(h,m)} – ${fmtT(e[0],e[1])}`};

const inClaude=!!(window.claude&&window.claude.use);
